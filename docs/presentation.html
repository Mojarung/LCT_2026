// ---- scenes/06-placement.js
// 05 размещение: лист ложится обратно, по улице идут станции, каждое место проверяется целиком,
// места, где не проходят отступы, уходят в отказ с причиной
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const S = G.street;
  const M = G.M;
  const BACK = [0.3, 1.9], DUR = 19;

  const ORDER = G.candidates.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const T0 = 3.8, DT = 0.26;
  const at = (c) => T0 + ORDER.indexOf(c) * DT;
  const DONE = T0 + ORDER.length * DT + 0.3;
  const FADE = DUR - 1.3; // отметки проверки гаснут, остаются деревья
  const offsetsA = [2, 2.5, 3].map((m) => S.curbA - m * M);
  const offsetsB = [2, 2.5, 3].map((m) => S.curbB + m * M);
  const short = { power: 'кабель', water: 'водопровод', pole: 'опора', gas: 'газ', sewer: 'канализ.', heat: 'теплосеть', telecom: 'связь' };

  function rays(ctx, c, q) {
    ctx.save();
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    for (const n of S.nets) {
      const [px, py] = G.nearestOnPoly(c.x, c.y, n.pts);
      if (Math.hypot(px - c.x, py - c.y) > 5 * M) continue;
      ctx.strokeStyle = lib.rgba(n.color === C.telecom ? P.annBlue : n.color, 0.95 * q);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(lib.lerp(c.x, px, q), lib.lerp(c.y, py, q));
      ctx.stroke();
    }
    for (const [px, py] of S.poles) {
      if (Math.hypot(px - c.x, py - c.y) > 5 * M) continue;
      ctx.strokeStyle = lib.rgba(P.annYellow, q);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(lib.lerp(c.x, px, q), lib.lerp(c.y, py, q));
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = lib.rgba(P.ink, 0.8 * q);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(c.x - 1.1 * M, c.y - 1.1 * M, 2.2 * M, 2.2 * M);
    ctx.restore();
  }

  function street(ctx, t) {
    G.world(ctx, G.CAMS.street, { t: t + 62 });
    G.traffic(ctx, t + 42);
    // станции на трёх отступах от борта
    const sq = G.seg(t, 2.0, 1.2, 'inOutCubic');
    ctx.save();
    ctx.globalAlpha *= 1 - G.seg(t, FADE, 0.7, 'linear');
    for (const ys of [offsetsA, offsetsB]) {
      ys.forEach((y, i) => {
        ctx.strokeStyle = lib.rgba(P.annBlue, 0.55);
        ctx.setLineDash([3, 7]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1920 * sq, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = lib.rgba(P.annBlue, 0.7);
        for (let x = 60 + i * 40; x < 1920 * sq; x += 120) {
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }
    ctx.restore();
    // проверка кандидатов
    for (const c of ORDER) {
      const t0 = at(c);
      if (t < t0) continue;
      const q = clamp((t - t0) / 0.35);
      if (t - t0 < 0.6) rays(ctx, c, E.outCubic(q));
      if (c.ok) {
        G.tree(ctx, c.x, c.y, 52, { s: G.pop(t, t0 + 0.3, 0.2), seed: c.id * 31 });
        G.ring(ctx, c.x, c.y, 60, t, t0 + 0.32, { color: P.annYellow });
      } else {
        G.cross(ctx, c.x, c.y, 13, { p: ((t - t0 - 0.3) / 0.2) * (1 - G.seg(t, FADE, 0.7, 'linear')) });
        const tagA = clamp((t - t0 - 0.3) / 0.12) * (1 - clamp((t - t0 - 0.75) / 0.2));
        if (tagA > 0) {
          const f = c.fails[0];
          const txt = `${short[f.key] || f.what} ${G.fmt(f.d, 1)} < ${G.fmt(f.need, 1)} м`;
          const lvl = ORDER.indexOf(c) % 2;
          const ty = c.row === 'A' ? c.y - 56 - lvl * 32 : c.y + 70 + lvl * 32;
          const w = G.measure(ctx, txt, { size: 17, weight: 500, family: G.MONO }) + 18;
          ctx.save();
          ctx.globalAlpha *= tagA;
          ctx.fillStyle = P.annMagenta;
          ctx.fillRect(c.x - w / 2, ty - 20, w, 28);
          ctx.restore();
          G.text(ctx, txt, c.x, ty, { size: 17, weight: 500, family: G.MONO, color: P.white, align: 'center', alpha: tagA });
        }
      }
    }
  }

  FILM.slide({
    id: 'placement',
    mode: 'paper',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      const q = 1 - G.seg(t, BACK[0], BACK[1] - BACK[0], 'linear');
      // под листом та же синька, что в конце прошлого слайда, и она продолжает жить
      G.peel(ctx, q, (c) => G.undergroundScene(c, 19 + t), (c) => street(c, t));
      const bl = lib.clamp((q - 0.35) / 0.35);
      if (bl < 1) G.chapters(ctx, t, 2, { dur: DUR, alpha: 1 - bl });
      if (bl > 0) G.chapters(ctx, t, 2, { blue: true, dur: DUR, alpha: bl });
      if (q > 0) return;
      G.chapterTitle(ctx, t, '03 · РАЗМЕЩЕНИЕ', 'Место проверяется целиком', { t0: BACK[1], t1: DUR - 0.8 });
      G.caption(ctx, t, 2.2, 11.2, 1180, 880, 700, 'Станции вдоль борта через 5 м на отступах 3, 2,5 и 2 м и сетка по газону. Яма дерева 2,2 × 2,2 м проверяется по всем 62 отступам сразу.', { size: 23, seed: 9 });
      G.caption(ctx, t, 11.6, DUR - 0.9, 1180, 850, 700, 'Где под газоном кабель, водопровод или рядом опора, место уходит в отказ: причина и недобор до нормы остаются в объяснении. Берзарина: 68 190 кандидатов у борта, 1 871 на газоне.', { size: 23, seed: 11 });
    },
  });
})();

// ---- scenes/07-species.js
// 07 виды: кроны перекрашиваются волной; где квота вида исчерпана, дерево уступает место группе
// кустарника; снизу выезжает гербарий с формулой MILP
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const TAU = Math.PI * 2;
  const DUR = 20, SHEET = 9.6; // гербарий выезжает
  const QUOTA = 3.8; // места, пустые по квотам
  const EMPTY = G.shrubSpots;
  const qAt = (c) => QUOTA + EMPTY.indexOf(c) * 0.4;
  const SPEC = G.SPECIES.slice(0, 6);

  function trees(ctx, t) {
    G.ok.forEach((c, k) => {
      const q = G.seg(t, 0.5 + (c.x / 1920) * 1.6 + (c.row === 'B' ? 0.15 : 0), 0.45, 'inOutCubic');
      const sp = c.sp;
      const fill = lib.mix(C.crown, sp.fill, q);
      const deep = lib.mix(C.crownDeep, sp.deep, q);
      const conifer = sp.kind === 'conifer' && q > 0.5;
      let r = lib.lerp(52, sp.r, q) * (1 + 0.08 * Math.sin(Math.PI * q));
      if (c.empty) r *= 1 - G.seg(t, qAt(c) + 0.6, 0.4, 'inBack');
      if (r > 1) G.tree(ctx, c.x, c.y, r, { kind: conifer ? 'conifer' : 'leaf', fill, deep, seed: c.id * 31 });
      if (c.empty) {
        const ta = G.seg(t, qAt(c), 0.25, 'linear') * (1 - G.seg(t, qAt(c) + 1.6, 0.4, 'linear'));
        if (ta > 0) {
          const y = c.y + 8;
          ctx.save();
          ctx.globalAlpha *= ta;
          ctx.fillStyle = P.annBlue;
          ctx.fillRect(c.x - 58, y - 22, 116, 30);
          ctx.restore();
          G.text(ctx, 'квота вида', c.x, y, { size: 17, weight: 600, family: G.MONO, color: P.white, align: 'center', alpha: ta });
        }
      }
      const la = G.seg(t, 0.8 + (c.x / 1920) * 1.6, 0.4, 'linear') * (1 - G.seg(t, SHEET - 0.6, 0.5, 'linear')) * (c.empty ? 1 - G.seg(t, qAt(c), 0.3, 'linear') : 1);
      if (la > 0) {
        const lvl = G.trees.indexOf(c) % 2;
        const y = c.row === 'A' ? c.y - sp.r - 14 - lvl * 22 : c.y + sp.r + 28 + lvl * 22;
        G.text(ctx, sp.lat, c.x, y, { size: 16, weight: 500, italic: true, color: P.ink, align: 'center', alpha: la });
      }
    });
  }

  // листья падают на «двойках», каждый своей дорогой
  function leaves(ctx, t) {
    const tt = lib.onTwos(t);
    for (let k = 0; k < 22; k++) {
      const r = lib.rng('leaf' + k);
      const period = 9 + r() * 6;
      const u = ((tt + r() * period) % period) / period;
      const x = r() * 2000 - 40 + Math.sin(u * TAU * 1.5 + k) * 60;
      const y = -40 + u * 1160;
      const a = u * TAU * (1 + r()) + k;
      const s = 9 + r() * 7;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      lib.inkPath(ctx, [[-s, 0], [0, -s * 0.45], [s, 0], [0, s * 0.45]], { closed: true, width: 1.4, fill: [C.crown, '#C8B27A', '#C38F2E', C.crownPale][k % 4], seed: k, smooth: true, wobble: 0.3 });
      lib.inkLine(ctx, -s, 0, s, 0, { width: 1, seed: k + 50, alpha: 0.6 });
      ctx.restore();
    }
  }

  function specimen(ctx, t, sp, i, x, y, w, h, t0) {
    const q = G.seg(t, t0 + i * 0.15, 0.5, 'linear');
    if (q <= 0) return;
    ctx.save();
    ctx.globalAlpha *= clamp(q * 2);
    ctx.fillStyle = lib.rgba(P.white, 0.75);
    ctx.fillRect(x, y, w, h);
    lib.inkPath(ctx, lib.rectPts(x, y, w, h, 30), { closed: true, width: 1.5, seed: 60 + i, smooth: false, wobble: 0.6, alpha: 0.8 });
    // полоска скотча
    ctx.fillStyle = lib.rgba('#F4E9C8', 0.85);
    ctx.save();
    ctx.translate(x + w / 2, y);
    ctx.rotate(((i % 2) - 0.5) * 0.12);
    ctx.fillRect(-34, -10, 68, 20);
    ctx.restore();
    ctx.restore();
    const cx = x + w / 2, cy = y + 80;
    lib.guideCircle(ctx, cx, cy, 58, { color: P.inkFaint, alpha: 0.35, width: 1.2, cross: 6, p: q });
    G.tree(ctx, cx, cy, Math.min(50, sp.r), { s: G.pop(t, t0 + 0.2 + i * 0.15, 0.22), kind: sp.kind, fill: sp.fill, deep: sp.deep, seed: 200 + i });
    G.para(ctx, sp.ru, x + 14, y + 170, { size: 18, weight: 600, maxW: w - 24, lh: 22, color: P.ink, p: q });
    const n = G.lines(ctx, sp.ru, { size: 18, weight: 600, maxW: w - 24 }).length;
    G.text(ctx, sp.lat, x + 14, y + 172 + n * 22, { size: 16, weight: 400, italic: true, color: P.inkSoft, p: q });
    G.text(ctx, sp.h + ' м · ' + sp.fam, x + 14, y + 194 + n * 22, { size: 13, weight: 500, family: G.MONO, color: P.inkFaint, p: q });
  }

  function herbarium(ctx, t) {
    const q = G.seg(t, SHEET, 0.9, 'outCubic') * (1 - G.seg(t, DUR - 1.7, 0.9, 'inCubic'));
    if (q <= 0) return;
    const top = lib.lerp(1100, 560, q);
    // крафт с рваным краем: растр строится один раз
    const kraft = G.cachedCanvas('kraft', (g) => {
      g.fillStyle = '#D8C29A';
      g.beginPath();
      g.moveTo(-20, 30);
      for (let x = -20; x <= 1940; x += 24) g.lineTo(x, 8 + 10 * lib.noise1(x * 0.02, 3) + 6 * lib.noise1(x * 0.11, 4));
      g.lineTo(1940, 1080);
      g.lineTo(-20, 1080);
      g.closePath();
      g.fill();
      lib.stipple(g, lib.rectPts(0, 30, 1920, 1000, 60), { spacing: 11, r: [0.6, 1.4], color: '#8E7440', alpha: 0.35, seed: 5, density: 0.5 });
    }, { boil: false });
    ctx.drawImage(kraft, 0, top, 1920, 1080);
    const y = top + 56;
    SPEC.forEach((sp, i) => specimen(ctx, t, sp, i, 50 + i * 186, y, 176, 262, SHEET + 0.5));
    // формула и числа
    const fx = 1190;
    const fq = G.seg(t, SHEET + 1.2, 0.4);
    G.card(ctx, fx, y - 6, 690, 280, { p: fq, seed: 41 });
    if (fq > 0) {
      G.kicker(ctx, 'MILP · HiGHS', fx + 30, y + 38, { color: P.inkSoft, alpha: fq });
      const F = [
        ['max Σ пригодность·y + 10·занятые места', P.ink, 21],
        ['вид ≤ 0,1·T  род ≤ 0,2·T  семейство ≤ 0,3·T', P.ink, 21],
        ['0,15·T ≤ хвойные ≤ 0,40·T', P.ink, 21],
        ['T - число занятых мест, тоже переменная', P.inkSoft, 17],
      ];
      F.forEach(([s, col, sz], i) => G.text(ctx, s, fx + 30, y + 84 + i * 38, { size: sz, weight: 500, family: G.MONO, color: col, p: G.seg(t, SHEET + 1.4 + i * 0.4, 0.8, 'linear') }));
      G.para(ctx, 'Каталог 55 видов. Клён ясенелистный исключён как инвазивный по 369-ПП. Берзарина: 12 видов, индекс Шеннона 2,44.', fx + 30, y + 240 - 20, { size: 18, weight: 400, maxW: 630, lh: 24, color: P.inkSoft, p: G.seg(t, SHEET + 3.0, 1.6, 'linear') });
    }
  }

  FILM.slide({
    id: 'species',
    mode: 'paper',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      G.world(ctx, G.CAMS.street, { t: t + 81 });
      G.traffic(ctx, t + 61);
      // группы кустарника вырастают на местах, где квота вида исчерпана
      if (t > QUOTA + EMPTY.length * 0.4 + 1.6) G.shrubsFull(ctx);
      else G.drawPlanShrubs(ctx, (k, c) => lib.seg(t, qAt(c) + 0.9, qAt(c) + 1.6));
      trees(ctx, t);
      ctx.save();
      ctx.globalAlpha *= 1 - G.seg(t, DUR - 1.2, 0.9, 'linear');
      leaves(ctx, t);
      ctx.restore();
      G.caption(ctx, t, QUOTA - 0.2, SHEET - 0.4, 1100, 150, 760, 'Шаг пары деревьев вне аллеи - по взрослым кронам, 5-7 м: боярышник 5 м, ель 6 м, липа 7 м. Доля вида до 40%, рода до 50%: перебор штрафуется. Место без вида занимает группа кустарника 3 × 3 с шагом 1 м.', { size: 23, seed: 13 });
      herbarium(ctx, t);
      G.chapters(ctx, t, 3, { dur: DUR });
      G.chapterTitle(ctx, t, '04 · ВИДЫ', 'Вид подбирается под место', { t0: 0.2, t1: DUR - 0.8 });
    },
  });
})();

(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const K = 90; // пикселей в метре на крупном плане
  const TX = 540, TY = 600;
  const SWITCH = 12.5; // в локальном времени крупного плана

  const PLANT = [
    ['Посадка №3, Боярышник обыкновенный (Crataegus laevigata), аллея вдоль борта: посадка допускается.', P.ink, 500],

  const REJECT = [
    ['Отказ №1: посадка запрещена.', P.annMagenta, 500],
    ['Причины: до наружной стены здания 3.37 м < 5.00 м (R-BLD-TREE-001: СП 42.13330.2016, п. 9.6, табл. 9.1: наружная стена здания и сооружения; 743-ПП, п. 3.6.3, табл. 3.6.1; 623-ПП (МГСН 1.02-02), п. 4.2.4)', P.ink, 400],

  ];

  function ground(ctx, o) {
    // тротуар сверху, газон, борт, проезжая часть снизу
    const walkY = TY - 2 * K, curbY = TY + 2 * K;

    ctx.fillRect(-20, 0, 1120, walkY);
    ctx.strokeStyle = lib.rgba(P.inkFaint, 0.25);

    ctx.fillStyle = C.lawn;
    ctx.fillRect(-20, walkY, 1120, curbY - walkY);
    lib.hatch(ctx, lib.rectPts(-20, walkY + 6, 1120, curbY - walkY - 12, 40), { angle: -1.2, spacing: 13, length: [8, 18], gap: [8, 20], width: 1.5, color: C.lawnDeep, alpha: 0.8, seed: 3 });
    ctx.fillStyle = C.asphalt;
    ctx.fillRect(-20, curbY, 1120, 1080 - curbY);
    lib.stipple(ctx, lib.rectPts(-20, curbY + 10, 1120, 1080 - curbY, 60), { spacing: 11, r: [0.8, 1.6], color: P.inkSoft, alpha: 0.3, seed: 8, density: 0.5 });
    lib.inkLine(ctx, -20, curbY, 1100, curbY, { width: 5, seed: 11 });
    lib.inkLine(ctx, -20, curbY + 10, 1100, curbY + 10, { width: 1.8, seed: 12, alpha: 0.6 });
    lib.inkLine(ctx, -20, walkY, 1100, walkY, { width: 2.6, seed: 13 });
    if (o.paving) {
      // въезд с покрытием слева
      const px = TX - 2.11 * K;
      ctx.fillStyle = C.tile;
      ctx.fillRect(px - 150, walkY, 150, curbY - walkY);
      lib.inkLine(ctx, px, walkY, px, curbY, { width: 2.6, seed: 14 });
      lib.inkLine(ctx, px - 150, walkY, px - 150, curbY, { width: 2.6, seed: 15 });

    const y = ly != null ? ly : (y1 + y2) / 2;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.fillStyle = color;
    ctx.fillRect(x, y - 17, w, 34);
    ctx.restore();
    G.text(ctx, label, x + 10, y + 8, { size: 22, weight: 500, family: G.MONO, color: P.white, alpha: a });
  }

  function plantScene(ctx, t) {
    G.cached(ctx, 'closeup-plant', (g) => {
      ground(g, { paving: true });
      G.tree(g, TX, TY, 1.6 * K, { fill: '#B9C98A', deep: '#7D9152', seed: 3 });
    });
    // канализация под проезжей частью: рентгеновская вставка
    const sy = TY + 2.44 * K;
    ctx.save();
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = P.teal;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-20, sy);
    ctx.lineTo(1100, sy);
    ctx.stroke();
    ctx.restore();
    G.text(ctx, 'канализация', 40, sy + 34, { size: 20, weight: 500, family: G.MONO, color: P.tealDeep });
    G.text(ctx, '№3', TX + 1.6 * K + 12, TY - 1.2 * K, { size: 26, weight: 500, family: G.MONO, color: P.ink, alpha: G.seg(t, 0.6, 0.3, 'linear') });
    dim(ctx, TX + 40, TY, TX + 40, TY + 2 * K, 'борт 2,00 ≥ 2,00', P.annBlue, G.seg(t, 1.2, 0.5), TX + 170, TY + 120);
    dim(ctx, TX + 110, TY, TX + 110, sy, 'канализация 2,44 ≥ 1,50', P.teal, G.seg(t, 2.2, 0.5), TX + 170, TY + 170);
    dim(ctx, TX - 40, TY, TX - 40, TY - 2 * K, 'тротуар 2,00 ≥ 0,70', P.annBlue, G.seg(t, 3.2, 0.5), TX - 20, TY - 2 * K - 34);
    dim(ctx, TX, TY + 60, TX - 2.11 * K, TY + 60, 'покрытие 2,11 ≥ 0,70', P.annYellow, G.seg(t, 4.2, 0.5), 30, TY + 110);
    // норма пунктиром поверх: где проходит граница допустимого
    lib.guideCircle(ctx, TX, TY, 2 * K, { color: P.annBlue, alpha: 0.6 * G.seg(t, 1.2, 0.6), dash: [6, 6], width: 2 });
  }

  function rejectScene(ctx, t) {
    G.cached(ctx, 'closeup-reject', (g) => ground(g, { building: true }));
    const cy = TY + 1.84 * K;
    ctx.save();
    ctx.setLineDash([14, 10]);
    ctx.strokeStyle = P.annMagenta;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-20, cy);
    ctx.lineTo(1100, cy);
    ctx.stroke();
    ctx.restore();
    G.text(ctx, 'силовой кабель', 60, cy - 16, { size: 20, weight: 500, family: G.MONO, color: P.annMagenta });
    // тень несостоявшегося дерева и крестик
    lib.guideCircle(ctx, TX, TY, 1.6 * K, { color: P.ink, alpha: 0.5, dash: [5, 7], width: 2 });
    G.cross(ctx, TX, TY, 34, { p: G.seg(t, SWITCH + 0.3, 0.3, 'linear'), width: 6 });
    // нормы: 5 м до стены, 2 м до кабеля
    lib.guideCircle(ctx, TX, TY, 5 * K, { color: P.annMagenta, alpha: 0.5, dash: [8, 8], width: 2, p: G.seg(t, SWITCH + 0.6, 0.8) });
    dim(ctx, TX + 60, TY, TX + 60, TY - 3.37 * K, 'стена 3,37 < 5,00', P.annMagenta, G.seg(t, SWITCH + 0.9, 0.5), TX + 80, TY - 150);
    dim(ctx, TX - 70, TY, TX - 70, cy, 'кабель 1,84 < 2,00', P.annMagenta, G.seg(t, SWITCH + 1.6, 0.5), TX - 330, TY + 60);
    G.ring(ctx, TX, TY, 70, t, SWITCH + 0.35, { color: P.annMagenta, dur: 0.6 });
  }

  function card(ctx, t, lines, t0, alpha) {
    const x = 1110, w = 770;
    ctx.save();
    ctx.globalAlpha *= alpha;
    G.card(ctx, x, 150, w, 540, { p: G.seg(t, t0, 0.4), seed: 31 });
    let y = 214;
    lines.forEach(([s, col, wt], i) => {
      const h = G.para(ctx, s, x + 36, y, { size: i === 0 ? 28 : 23, weight: wt, maxW: w - 72, lh: i === 0 ? 36 : 31, color: col, p: G.seg(t, t0 + 0.4 + i * 1.0, 1.3, 'linear') });
      y += h + 16;
    });
    ctx.restore();
  }

  function closeup(ctx, t) {
    const sw = G.seg(t, SWITCH, 0.5, 'inOutCubic');
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, 1080, 1080);
    ctx.clip();
    if (sw < 1) plantScene(ctx, t);
    if (sw > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, 1080 * sw, 1080);
      ctx.clip();
      rejectScene(ctx, t);
      ctx.restore();
      if (sw < 1) lib.inkLine(ctx, 1080 * sw, 0, 1080 * sw, 1080, { width: 4, color: P.annMagenta, boil: false });
    }
    ctx.restore();
    lib.inkLine(ctx, 1080, 0, 1080, 1080, { width: 3, seed: 40 });
    lib.stripes(ctx, { colors: [P.stripeCream, P.stripeApricot], bounds: [1083, 0, 837, 1080], offset: t * 10 });
    // карточка посадки гаснет, карточка отказа проявляется поверх: без кадра пустоты
    if (t < SWITCH + 0.4) card(ctx, t, PLANT, 0.3, 1 - G.seg(t, SWITCH, 0.4, 'linear'));
    if (t > SWITCH) card(ctx, t, REJECT, SWITCH, G.seg(t, SWITCH, 0.4, 'linear'));
    G.text(ctx, 'interpretations.csv', 1146, 730, { size: 22, weight: 600, family: G.MONO, color: P.ink, p: G.seg(t, 6.0, 0.6, 'linear') });
    ['kind · number · species_ru · x · y · verdict', 'rule_id · measured_m · threshold_m · act_id', 'clause · citation_status · quote · value · …'].forEach((s, i) => G.text(ctx, s, 1146, 770 + i * 30, { size: 19, weight: 400, family: G.MONO, color: P.inkSoft, p: G.seg(t, 6.3 + i * 0.4, 0.8, 'linear') }));
    G.para(ctx, 'В DXF у каждого блока атрибуты NUM, SPECIES, NPA и XDATA LCT_GREEN. Текст собирают шаблоны из трассы правил, без LLM.', 1146, 900, { size: 22, weight: 400, maxW: 720, lh: 30, color: P.inkSoft, p: G.seg(t, 7.6, 1.8, 'linear') });
  }

  function street(ctx, t, cam) {
    G.world(ctx, cam, { t: t + 100 });
    ctx.save();
    G.applyCam(ctx, cam);
    G.zoomNow = cam.z;
    G.traffic(ctx, t + 81);
    G.shrubsFull(ctx);
    G.drawPlanTrees(ctx, () => 1);
    G.zoomNow = 1;
    ctx.restore();
  }

  FILM.slide({
    id: 'explain',
    mode: 'paper',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      const camIn = G.camPath([[0, G.CAMS.street], [0.5, G.CAMS.street], [IN, G.CAMS.tree, 'inOutSine']], t);
      const camOut = G.camPath([[OUT + 0.3, G.CAMS.tree], [DUR - 0.2, G.CAMS.street, 'inOutSine']], t);
      const inA = G.seg(t, IN - 0.4, 0.5, 'linear');
      const outA = G.seg(t, OUT, 0.4, 'linear');
      if (inA < 1) street(ctx, t, camIn);
      if (outA > 0) street(ctx, t, camOut);
      const cq = inA * (1 - outA);
      if (cq > 0) {
        ctx.save();
        ctx.globalAlpha *= cq;
        closeup(ctx, t - IN);
        ctx.restore();
      }
      G.chapters(ctx, t, 4, { dur: DUR });
      if (cq > 0.5) G.chapterTitle(ctx, t, '05 · ОБЪЯСНЕНИЕ', 'Каждое решение с пунктом нормы', { t0: IN, t1: OUT - 0.5 });
    },
  });
})();

// ---- scenes/09-quality.js
// 09 качество: камера поднимается над улицей в ночную синьку; рядом встают ещё 7 раскладок,
// каждая получает свой индекс, выигрывает наибольший
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const TAU = Math.PI * 2;
  const S = G.street;
  const M = G.M;

  // src/green/application/params.py:30-41
  const TERMS = [
    ['плотность', 0.15], ['пригодность', 0.15], ['разнообразие', 0.10], ['ряды', 0.05], ['ярусность', 0.10],
    ['категория', 0.10], ['тень', 0.10], ['пылезащита', 0.10], ['запас до норм', 0.10], ['сезонность', 0.05],
  ];
  const TINT = [P.paleBlue, P.lavender, '#9CE6C6', '#F2C94C', '#FF8A5B', P.paleBlue, P.lavender, '#9CE6C6', '#F2C94C', '#FF8A5B'];
  const VARIANTS = ['baseline', 'joint', 'phase_x', 'phase_xy', 'aligned', 'aligned_joint', 'soil_frame', 'soil_frame_joint'];
  const WIN = 6; // слот, где лежит сама улица
  const DUR = 19;
  const SLOT = (i) => [((i % 4) - 2) * 2320, (Math.floor(i / 4) - 1) * 1700];
  G.SLOT = SLOT;
  G.VARIANT_PLANS = null;
  G.CAMS.high = { x: -1900, y: 600, z: 0.139 };

  // у каждого варианта свой сдвиг сетки; деревья проходят ту же проверку отступов
  const PLANS = VARIANTS.map((_, v) => {
    if (v === WIN) return G.ok.map((c) => [c.x, c.y]);
    const r = lib.rng('var' + v);
    const dx = (v * 23) % 60 - 30, dyA = [0, -10, 10][v % 3];
    return G.candidates
      .map((c) => [c.x + dx, c.y + (c.row === 'A' ? dyA : -dyA)])
      .filter(([x, y]) => {
        for (const n of S.nets) if (G.distPoly(x, y, n.pts) / M - (n.channel ? n.channel / 2 / M : 0) < G.RULES[n.key]) return false;
        for (const [px, py] of S.poles) if (Math.hypot(px - x, py - y) / M < G.RULES.pole) return false;
        return r() > 0.12;
      });
  });
  G.VARIANT_PLANS = PLANS;
  const SCORE = PLANS.map((p, v) => (v === WIN ? 1 : 0.55 + 0.4 * (p.length / (PLANS[WIN].length + 3))));

  function rosette(ctx, t, cx, cy) {
    const R0 = 100, R1 = 168;
    let a = -Math.PI / 2;
    TERMS.forEach(([name, w], i) => {
      const span = w * TAU;
      const q = G.seg(t, 1.6 + i * 0.28, 0.6, 'outCubic');
      const a0 = a + 0.025, a1 = a + span * q - 0.025;
      if (q > 0 && a1 > a0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R1, a0, a1);
        ctx.arc(cx, cy, R0, a1, a0, true);
        ctx.closePath();
        ctx.fillStyle = lib.rgba(TINT[i], 0.22);
        ctx.fill();
        ctx.strokeStyle = lib.rgba(TINT[i], 0.9);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
      const am = a + span / 2;
      const lq = G.seg(t, 1.9 + i * 0.28, 0.5, 'linear');
      const right = Math.cos(am) >= 0;
      const lx = cx + Math.cos(am) * (R1 + 22), ly = cy + Math.sin(am) * (R1 + 22) + 6;
      G.text(ctx, name + ' ' + G.fmt(w, 2), lx, ly, { size: 17, weight: 500, color: P.lineWhite, align: right ? 'left' : 'right', alpha: lq });
      a += span;
    });
    lib.ticks(ctx, cx, cy, { r: R1 + 6, n: 100, len: 5, major: 10, majorLen: 12, color: P.lavender, alpha: 0.5, width: 1.2, start: -Math.PI / 2, rot: t * 0.05 });
    const cq = G.seg(t, 4.4, 0.6, 'linear');
    G.text(ctx, 'Q', cx, cy + 20, { size: 76, weight: 200, color: P.lineWhite, align: 'center', alpha: cq });
    G.text(ctx, '10 слагаемых', cx, cy + 52, { size: 16, weight: 500, family: G.MONO, color: P.lavender, align: 'center', alpha: cq });
  }

  function variants(ctx, t, cam) {
    ctx.save();
    G.applyCam(ctx, cam);
    VARIANTS.forEach((name, v) => {
      const [ox, oy] = SLOT(v);
      const q = v === WIN ? 1 : G.seg(t, 2.8 + v * 0.12, 0.6, 'linear');
      if (q <= 0) return;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.globalAlpha *= q;
      ctx.fillStyle = lib.rgba(P.navyLight, 0.85);
      ctx.fillRect(0, 0, 1920, 1080);
      G.drawSurfaceBlue(ctx, { alpha: 0.6 });
      G.drawNetsBlue(ctx, { labels: false });
      ctx.fillStyle = lib.rgba(P.paleBlue, 0.95);
      for (const [x, y] of PLANS[v]) {
        ctx.beginPath();
        ctx.arc(x, y, 34, 0, TAU);
        ctx.fill();
      }
      ctx.strokeStyle = lib.rgba(P.lavender, 0.8);
      ctx.lineWidth = 1.5 / cam.z;
      ctx.strokeRect(0, 0, 1920, 1080);
      ctx.restore();
    });
    ctx.restore();
    VARIANTS.forEach((name, v) => {
      const [ox, oy] = SLOT(v);
      const [sx, sy] = G.toScreen(cam, ox, oy + 1080);
      const [ex] = G.toScreen(cam, ox + 1920, oy);
      const q = G.seg(t, 3.0 + v * 0.12, 0.5, 'linear');
      if (q <= 0) return;
      G.text(ctx, name, sx, sy + 22, { size: 16, weight: 500, family: G.MONO, color: v === WIN ? P.lineWhite : P.lavender, alpha: q });
      const bq = G.seg(t, 4.8 + v * 0.3, 0.6, 'outCubic');
      ctx.fillStyle = lib.rgba(P.lavender, 0.25);
      ctx.fillRect(sx, sy + 32, ex - sx, 5);
      ctx.fillStyle = v === WIN ? P.magenta : P.lavender;
      ctx.fillRect(sx, sy + 32, (ex - sx) * SCORE[v] * bq, 5);
      if (v === WIN && t > 7.6) {
        const [wx, wy] = G.toScreen(cam, ox, oy);
        const w = (ex - sx), h = sy - wy;
        ctx.save();
        ctx.strokeStyle = P.magenta;
        ctx.lineWidth = 3;
        ctx.strokeRect(wx - 6, wy - 6, w + 12, h + 12);
        ctx.restore();
        G.text(ctx, 'max Q', wx + w, wy - 14, { size: 18, weight: 600, family: G.MONO, color: P.magenta, align: 'right', alpha: G.seg(t, 7.6, 0.3, 'linear') });
        G.ring(ctx, wx + w / 2, wy + h / 2, w * 0.6, t, 7.6, { color: P.magenta, dur: 0.6 });
      }
    });
  }

  FILM.slide({
    id: 'quality',
    mode: 'blue',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      const cam = G.camPath([[0, G.CAMS.street], [0.45, G.CAMS.street], [3.0, G.CAMS.high, 'inOutSine']], t);
      const night = G.seg(t, 0.3, 1.6, 'inOutSine');
      lib.blueprint(ctx, { noise: 0, seed: 21, center: [960, 540] });
      // звёзды мерцают на ночной синьке
      for (let k = 0; k < 60; k++) {
        const r = lib.rng('star' + k);
        const x = r() * 1920, y = r() * 1080;
        const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * (0.6 + r()) + k));
        ctx.fillStyle = lib.rgba(P.lineWhite, 0.5 * tw * night);
        ctx.fillRect(x, y, 2, 2);
      }
      if (night < 1) {
        // улица на бумаге растворяется, остаётся её чертёж
        ctx.save();
        ctx.globalAlpha *= 1 - night;
        G.world(ctx, cam, { t: t + 98, district: false });
        G.applyCam(ctx, cam);
        G.traffic(ctx, t + 108);
        G.shrubsFull(ctx);
        G.drawPlanTrees(ctx, () => 1);
        ctx.restore();
      }
      ctx.save();
      ctx.globalAlpha *= night;
      variants(ctx, t, cam);
      ctx.restore();
      const bl = night;
      if (bl < 1) G.chapters(ctx, t, 5, { dur: DUR, alpha: 1 - bl });
      if (bl > 0) G.chapters(ctx, t, 5, { blue: true, dur: DUR, alpha: bl });
      if (t < 1.0) return;
      const out = 1 - G.seg(t, DUR - 1.0, 0.6, 'linear');
      ctx.save();
      ctx.globalAlpha *= out;
      rosette(ctx, t, 300, 660);
      const tx = 700;
      G.para(ctx, 'До 8 раскладок проходят подбор видов, проверку и индекс. Побеждает наибольший Q, при равенстве меньше согласований.', tx, 710, { size: 23, weight: 400, maxW: 1150, lh: 32, color: P.lavender, p: G.seg(t, 8.4, 1.6, 'linear') });
      G.para(ctx, 'Ценность посадки = Q(план) - Q(план без неё), показана в промилле. Пока в плане есть запрещённая посадка, индекс не выставляется.', tx, 800, { size: 23, weight: 400, maxW: 1150, lh: 32, color: P.lavender, p: G.seg(t, 10.2, 1.8, 'linear') });
      G.para(ctx, 'Камчатская 0,53, Кустанайская 0,58, Песчаный 0,53. В экспериментах портфель ни разу не проиграл жадной раскладке, лучший прирост 0,510 → 0,618.', tx, 890, { size: 23, weight: 500, maxW: 1150, lh: 32, color: P.lineWhite, p: G.seg(t, 12.2, 2.0, 'linear') });
      ctx.restore();
      G.chapterTitle(ctx, t, '06 · КАЧЕСТВО', 'Из восьми раскладок остаётся одна', { blue: true, t0: 1.0, t1: DUR - 0.9 });
    },
  });
})();

// ---- scenes/10-result.js
// 10 сверка: камера возвращается к победившей раскладке, на неё ложатся девять слоёв GREEN_*,
// по исходнику проходит луч отпечатков
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const TAU = Math.PI * 2;
  const S = G.street;
  const CAM = { x: 1452, y: 540, z: 0.62 };
  const DROP = 2.6, SCAN = [6.6, 3.4], DUR = 19;

  function layerContent(ctx, name, q) {
    if (q <= 0) return;
    ctx.save();
    ctx.globalAlpha *= q;
    if (name === 'GREEN_TREES') for (const c of G.trees) {
      ctx.fillStyle = lib.rgba(lib.mix(c.sp.fill, P.paleBlue, 0.4), 0.85);
      ctx.strokeStyle = P.lineWhite;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.sp.r, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = P.navy;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6, 0, TAU);
      ctx.fill();
    }
    if (name === 'GREEN_SHRUBS') {
      ctx.fillStyle = lib.rgba('#9CE6C6', 0.8);
      for (const c of G.shrubSpots) for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        ctx.beginPath();
        ctx.arc(c.x + i * 20, c.y + j * 20, 8, 0, TAU);
        ctx.fill();
      }
    }
    if (name === 'GREEN_REJECT') for (const c of G.rejected) G.cross(ctx, c.x + 30, c.y - 30, 8, { color: P.magenta, width: 3 });
    if (name === 'GREEN_LABELS') G.trees.forEach((c, k) => G.text(ctx, String(k + 1), c.x + c.sp.r * 0.7, c.y - c.sp.r * 0.7, { size: 26, weight: 600, family: G.MONO, color: P.lineWhite }));
    if (name === 'GREEN_ZONE_ALLOWED') {
      for (const [y0, y1] of [S.lawnA, S.lawnB]) lib.hatch(ctx, G.rectPoly(1200, y0 + 6, 1920, y1 - 6), { spacing: 12, width: 2, color: P.paleBlue, alpha: 0.45, seed: y0, angle: -0.8 });
    }
    ctx.restore();
  }

  FILM.slide({
    id: 'result',
    mode: 'blue',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      const cam = G.camPath([[0, G.CAMS.high], [0.45, G.CAMS.high], [2.4, CAM, 'inOutSine']], t);
      lib.blueprint(ctx, { noise: 0, seed: 21, center: [960, 540] });
      ctx.save();
      G.applyCam(ctx, cam);
      // остальные раскладки гаснут
      const fade = 1 - G.seg(t, 0.1, 0.9, 'linear');
      for (let v = 0; v < 8; v++) {
        const [ox, oy] = G.SLOT(v);
        const own = ox === 0 && oy === 0;
        if (!own && fade <= 0) continue;
        ctx.save();
        ctx.translate(ox, oy);
        ctx.globalAlpha *= own ? 1 : fade;
        ctx.fillStyle = lib.rgba(P.navyLight, 0.85);
        ctx.fillRect(0, 0, 1920, 1080);
        G.drawSurfaceBlue(ctx, { alpha: 0.6 });
        G.drawNetsBlue(ctx, { labels: false });
        if (!own || t < DROP) {
          ctx.fillStyle = lib.rgba(P.paleBlue, 0.95 * (own ? 1 - G.seg(t, DROP - 0.3, 0.3, 'linear') : 1));
          for (const [x, y] of G.VARIANT_PLANS[v]) {
            ctx.beginPath();
            ctx.arc(x, y, 34, 0, TAU);
            ctx.fill();
          }
        }
        ctx.strokeStyle = lib.rgba(P.lavender, 0.8);
        ctx.lineWidth = 1.5 / cam.z;
        ctx.strokeRect(0, 0, 1920, 1080);
        ctx.restore();
      }
      // девять листов GREEN_* ложатся сверху
      G.LAYERS.forEach((name, i) => {
        const t0 = DROP + i * 0.36;
        const q = G.seg(t, t0, 0.4, 'outCubic');
        if (q <= 0) return;
        layerContent(ctx, name, G.seg(t, t0 + 0.3, 0.3, 'linear'));
        const land = 1 - G.seg(t, t0 + 0.4, 0.5, 'linear');
        if (land <= 0) return;
        ctx.save();
        const k = 1.25 - 0.25 * q;

      G.para(ctx, 'Однажды проверка нашла в исходнике лишний блок стрелки от ezdxf. Исправлено, на это есть регрессионный тест.', rx, 560, { size: 23, weight: 400, maxW: 560, lh: 32, color: P.lavender, p: G.seg(t, 9.2, 1.8, 'linear') });
      const sq = G.seg(t, 11.4, 0.5);
      G.card(ctx, rx - 20, 710, 580, 220, { blue: true, p: sq });
      if (sq > 0) {

        G.text(ctx, '19 прогонов, 29 391 посадка', rx + 14, 812, { size: 32, weight: 300, color: P.lineWhite, p: G.seg(t, 11.6, 1.0, 'linear') });

// ---- scenes/11-audit.js
// 11 нормоконтроль: та же улица пополам; слева план «как у проектировщика», его правит красный карандаш,
// справа план сервиса
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const HALF = 960;
  const DESIGNER = G.candidates.filter((c) => c.x < HALF);
  const BY_RULE = [['силовой кабель', 159], ['бортовой камень', 104], ['опоры', 77], ['водопровод', 71], ['кабель связи', 62]];

  FILM.slide({
    id: 'audit',
    mode: 'paper',
    dur: 19,
    tr: { kind: 'scan', dur: 1.3, ring: '#C8322B' },
    draw(ctx, t) {
      const fix = G.seg(t, 17.0, 1.4, 'inOutCubic');
      const SPLIT = HALF * (1 - fix);
      const cardsA = 1 - G.seg(t, 16.7, 0.5, 'linear');
      G.world(ctx, G.CAMS.street, { t: t + 150 });
      G.traffic(ctx, t);
      // справа наш план целиком
      ctx.save();
      ctx.beginPath();
      ctx.rect(SPLIT, 0, 1920 - SPLIT, 1080);
      ctx.clip();
      G.shrubsFull(ctx);
      G.drawPlanTrees(ctx, () => 1);
      ctx.restore();
      // слева деревья на каждом месте через 6 м, без оглядки на сети
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, SPLIT, 1080);
      ctx.clip();
      ctx.fillStyle = lib.rgba('#F3E1D8', 0.35);
      ctx.fillRect(0, 0, SPLIT, 1080);
      DESIGNER.forEach((c, k) => G.tree(ctx, c.x, c.y, k % 5 === 4 ? 44 : 52, { s: G.pop(t, 0.5 + k * 0.08, 0.2), kind: k % 5 === 4 ? 'conifer' : 'leaf', seed: c.id * 13, fill: '#A9B98A', deep: '#6E7F52' }));
      // красный карандаш обводит каждое нарушение и пишет недобор
      DESIGNER.forEach((c, k) => {
        if (c.ok) return;
        const t0 = 2.6 + k * 0.3;
        G.scribble(ctx, c.x, c.y, 62, G.seg(t, t0, 0.35, 'linear'), 900 + k);
        const f = c.fails[0];
        const lq = G.seg(t, t0 + 0.3, 0.3, 'linear');
        if (lq > 0) {
          const y = c.row === 'A' ? c.y - 78 - (k % 2) * 26 : c.y + 92 + (k % 2) * 26;
          G.text(ctx, '-' + G.fmt(f.need - f.d, 1) + ' м', c.x, y, { size: 22, weight: 700, italic: true, color: '#C8322B', align: 'center', alpha: lq });
        }
      });
      ctx.restore();
      if (SPLIT > 2) {
        lib.inkLine(ctx, SPLIT, 0, SPLIT, 1080, { width: 5, seed: 71 });
        lib.inkLine(ctx, SPLIT + 9, 0, SPLIT + 9, 1080, { width: 1.5, seed: 72, alpha: 0.5 });
      }
      ctx.save();
      ctx.globalAlpha *= cardsA;

      const hq = G.seg(t, 0.3, 0.4);
      G.card(ctx, 40, 30, 880, 150, { p: hq, seed: 61 });
      G.card(ctx, HALF + 40, 30, 880, 150, { p: hq, seed: 62 });
      if (hq > 0) {
        G.kicker(ctx, 'НОРМОКОНТРОЛЬ · ПЛАН ПРОЕКТИРОВЩИКА, БЕРЗАРИНА', 76, 78, { color: '#C8322B', alpha: hq });
        G.text(ctx, '554 посадки, у 391 нарушен отступ', 76, 134, { size: 36, weight: 400, color: P.ink, p: G.seg(t, 0.6, 0.8, 'linear') });
        G.kicker(ctx, 'ПЛАН СЕРВИСА · ТА ЖЕ УЛИЦА', HALF + 76, 78, { color: P.tealDeep, alpha: hq });
        G.text(ctx, '860 посадок, 0 нарушений', HALF + 76, 134, { size: 36, weight: 400, color: P.ink, p: G.seg(t, 0.9, 0.8, 'linear') });
      }
      const bq = G.seg(t, 7.6, 0.4);
      G.card(ctx, 40, 760, 880, 280, { p: bq, seed: 63 });
      if (bq > 0) {
        G.text(ctx, '785 нарушений по правилам', 76, 810, { size: 24, weight: 500, color: P.ink, alpha: bq });
        BY_RULE.forEach(([name, n], i) => {
          const q = G.seg(t, 7.9 + i * 0.2, 0.8, 'outCubic');
          const y = 850 + i * 38;
          G.text(ctx, name, 76, y + 8, { size: 20, weight: 400, color: P.inkSoft, alpha: bq });
          ctx.fillStyle = lib.rgba('#C8322B', 0.8);
          ctx.fillRect(330, y - 10, (n / 159) * 440 * q, 22);
          G.text(ctx, String(Math.round(n * q)), 340 + (n / 159) * 440 * q, y + 8, { size: 19, weight: 600, family: G.MONO, color: P.ink, alpha: bq });
        });
      }
      const cq = G.seg(t, 9.6, 0.4);
      G.card(ctx, HALF + 40, 760, 880, 280, { p: cq, seed: 64 });
      if (cq > 0) {
        G.text(ctx, '$ green audit план.dxf --plantings "^0?6_+ДП_.+_план$"', HALF + 76, 818, { size: 19, weight: 500, family: G.MONO, color: P.ink, p: G.seg(t, 9.8, 1.2, 'linear') });
        G.para(ctx, 'Те же правила проверяют чужой план. На выходе audit.dxf с отметками на слоях GREEN_AUDIT_* и audit.md с пунктом акта и недобором в метрах. У плана сервиса 3 посадки на согласование: охранная зона воздушной линии.', HALF + 76, 866, { size: 21, weight: 400, maxW: 810, lh: 29, color: P.inkSoft, p: G.seg(t, 10.8, 2.2, 'linear') });
      }
      ctx.restore();
    },
  });
})();

// ---- scenes/12-interface.js
// 12 интерфейс: камера отъезжает, бумажная улица становится картой прогона; выбор посадки и её норма,
// перенос с живой проверкой, удаление, пересборка DXF, слои
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const UI = G.UI;
  const S = G.street;
  const M = G.M;
  const CAM = { x: 1300, y: 560, zoom: 1 };
  G.CAMS.ui = { x: 1300, y: 560, z: 1 };
  const LEAD = 3.0; // сколько идёт отъезд камеры и полоса прогона до правки

  // полоса хода прогона наверху: этапы бегут до «Готово», потом панель уезжает
  const STAGES = ['Склейка комплекта чертежей', 'Чтение чертежа', 'Разбор подосновы', 'Подоснова для карты', 'Размещение посадок', 'Подбор ассортимента', 'Группы кустарников', 'Индекс качества и ценность посадок', 'Объяснения по нормам', 'Запись DXF', 'Сверка целостности исходника', 'Готово'];
  function progress(ctx, T) {
    const q = G.seg(T, 1.2, 1.8, 'inOutSine');
    const a = G.seg(T, 1.0, 0.3, 'linear') * (1 - G.seg(T, 3.6, 0.4, 'linear'));
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha *= a;
    UI.panel(ctx, 560, 30, 800, 110);
    const name = STAGES[Math.min(STAGES.length - 1, Math.floor(q * (STAGES.length - 1) + 0.001))];
    UI.value(ctx, name, 592, 76, { size: 22 });
    G.text(ctx, Math.round(q * 100) + ' %', 1328, 76, { size: 22, weight: 500, family: G.MONO, color: C.bone, align: 'right' });
    ctx.fillStyle = lib.rgba(C.bone, 0.15);
    ctx.fillRect(592, 100, 736, 10);
    ctx.fillStyle = q >= 1 ? C.signal : C.bone;
    ctx.fillRect(592, 100, 736 * q, 10);
    ctx.restore();
  }
  const toScreen = (x, y) => [x - (CAM.x - 960), y - (CAM.y - 540)];

  const TREE = G.TREE3;
  const GONE = G.trees.find((c) => c.row === 'A' && c.x > TREE.x + 200);
  const BAD = [1150, 412], GOOD = [TREE.x + 40, 415];
  // план после правки: для финального слайда, который начинается с этой же карты
  G.EDITED = { TREE, GONE, AT: GOOD };
  const SLOW = 1.2; // правка идёт медленнее, чтобы успевать рассказывать
  const DUR = 24;

  // та же проверка, что на слайде с нормами: первая нарушенная норма или null
  function check(x, y) {
    for (const n of S.nets) {
      const d = G.distPoly(x, y, n.pts) / M - (n.channel ? n.channel / 2 / M : 0);
      if (d < G.RULES[n.key]) return `${n.name} ${G.fmt(d, 1)} < ${G.fmt(G.RULES[n.key], 1)} м`;
    }
    for (const [px, py] of S.poles) {
      const d = Math.hypot(px - x, py - y) / M;
      if (d < G.RULES.pole) return `опора ${G.fmt(d, 1)} < 4,0 м`;
    }
    const dc = Math.abs(y - S.curbA) / M;
    if (dc < G.RULES.curb) return `борт ${G.fmt(dc, 1)} < 2,0 м`;
    return null;
  }

  // положение переносимой посадки
  function treePos(t) {
    if (t < 4.4) return [TREE.x, TREE.y];
    const k = [[4.4, TREE.x, TREE.y], [5.6, BAD[0], BAD[1]], [6.4, BAD[0], BAD[1]], [7.4, GOOD[0], GOOD[1]]];
    return UI.path(k, t);
  }

  function map(ctx, t) {
    const netsOn = G.seg(t, 13.5, 0.4, 'linear');
    lib.camera(ctx, CAM, (g) => {
      UI.street(g);
      UI.nets(g, netsOn);
      UI.plan(g, { skip: TREE, s: (c) => (c === GONE ? 1 - G.seg(t, 9.2, 0.3, 'inBack') : 1) });
      const [x, y] = treePos(t);
      const dragging = t > 4.3 && t < 7.6;
      UI.planting(g, x, y, TREE.sp.r * 0.75, TREE.sp);
      // выбор и вердикт
      if (t > 1.8) {
        const verdict = dragging || (t >= 7.6 && t < 8.6) ? check(x, y) : null;
        const col = !dragging && t < 7.6 ? C.bone : verdict ? P.magenta : C.signal;
        g.save();
        g.strokeStyle = col;
        g.lineWidth = 3;
        g.setLineDash(dragging ? [8, 6] : []);
        g.beginPath();
        g.arc(x, y, TREE.sp.r * 0.75 + 12, 0, Math.PI * 2);
        g.stroke();
        g.restore();
        if (dragging || (t >= 7.6 && t < 8.6)) {
          const txt = verdict ? 'запрещено · ' + verdict : 'допускается';
          const w = G.measure(g, txt, { size: 18, weight: 600, family: G.MONO }) + 22;
          g.fillStyle = col;
          g.beginPath();
          g.roundRect(x - w / 2, y - 92, w, 34, 6);
          g.fill();
          G.text(g, txt, x, y - 69, { size: 18, weight: 600, family: G.MONO, color: C.graphite, align: 'center' });
          G.text(g, 'POST /check', x, y - 104, { size: 15, weight: 500, family: G.MONO, color: C.boneDim, align: 'center' });
        }
      }
      if (t > 8.9 && t < 9.6) {
        const [gx, gy] = [GONE.x, GONE.y];
        g.save();
        g.strokeStyle = C.bone;
        g.lineWidth = 3;
        g.beginPath();
        g.arc(gx, gy, 52, 0, Math.PI * 2);
        g.stroke();
        g.restore();
        g.fillStyle = C.bone;
        g.beginPath();
        g.roundRect(gx - 50, gy - 100, 100, 34, 6);
        g.fill();
        G.text(g, 'Delete', gx, gy - 76, { size: 18, weight: 600, family: G.MONO, color: C.graphite, align: 'center' });
      }
    });
  }

  function left(ctx, t) {
    UI.panel(ctx, 40, 40, 380, 640, { p: G.seg(t, 0.1, 0.5, 'linear') });
    UI.value(ctx, 'berzarina.dxf', 70, 92);
    UI.label(ctx, 'strict · шаг 5 м', 70, 124);
    UI.value(ctx, '608 посадок', 70, 186, { size: 30, weight: 400 });
    UI.label(ctx, '1 734 отклонённых места', 70, 222);
    UI.label(ctx, 'подоснова цела', 70, 262, { color: C.signal });
    UI.label(ctx, '▸ предупреждения', 70, 300);
    ctx.fillStyle = lib.rgba(C.bone, 0.1);
    ctx.fillRect(70, 540, 320, 1);
    UI.check(ctx, 70, 560, 'Переносить и удалять посадки', G.seg(t, 3.3, 0.2, 'linear'));
    const building = t > 10.5 && t < 11.8;
    const built = t >= 11.8;
    UI.button(ctx, 70, 610, 320, 50, building ? 'Пересборка…' : built ? 'DXF собран' : 'Пересобрать DXF', { press: t > 10.5 && t < 10.7 ? 1 : 0, primary: built });
    if (building) {
      ctx.save();
      ctx.strokeStyle = C.bone;
      ctx.lineWidth = 3;
      ctx.beginPath();
      const a = t * 8;
      ctx.arc(110, 635, 11, a, a + 4);
      ctx.stroke();
      ctx.restore();
    }
  }

  function right(ctx, t) {
    UI.panel(ctx, 1500, 40, 380, 1000, { p: G.seg(t, 0.2, 0.5, 'linear') });
    UI.value(ctx, 'Состав плана', 1530, 92);
    UI.field(ctx, 1530, 112, 320, 'Все виды', { select: true });
    G.SPECIES.forEach((sp, i) => {
      const y = 196 + i * 34;
      ctx.fillStyle = sp.fill;
      ctx.beginPath();
      ctx.arc(1542, y - 6, 8, 0, Math.PI * 2);
      ctx.fill();
      G.text(ctx, sp.ru, 1562, y, { size: 17, weight: 400, color: C.bone });
    });
    // карточка выбранной посадки
    const cq = G.seg(t, 2.0, 0.4, 'linear');
    if (cq > 0) {
      ctx.save();
      ctx.globalAlpha *= cq;
      ctx.fillStyle = lib.rgba(C.bone, 0.06);
      ctx.fillRect(1520, 480, 340, 380);
      ctx.restore();
      UI.value(ctx, '№3 · Боярышник обыкновенный', 1536, 520, { size: 19, alpha: cq });
      G.text(ctx, 'Crataegus laevigata', 1536, 548, { size: 17, italic: true, color: C.boneDim, alpha: cq });
      UI.label(ctx, 'ближе всего к норме', 1536, 596, { alpha: cq });
      G.para(ctx, 'бортовой камень 2,00 м при норме 2,00 м', 1536, 626, { size: 19, weight: 500, maxW: 310, lh: 26, color: C.bone, p: G.seg(t, 2.2, 0.6, 'linear') });
      G.para(ctx, 'СП 42.13330.2016, п. 9.6, табл. 9.1; 743-ПП, табл. 3.6.1', 1536, 690, { size: 16, weight: 400, maxW: 310, lh: 22, color: C.boneDim, p: G.seg(t, 2.5, 0.6, 'linear') });
      UI.label(ctx, '▸ остальные нормы', 1536, 760, { alpha: cq });
      UI.label(ctx, 'Чем ценна посадка: вклад', 1536, 806, { alpha: cq, color: C.bone });
      UI.label(ctx, 'в индекс качества, ‰', 1536, 830, { alpha: cq, color: C.bone });
    }
    UI.button(ctx, 1530, 900, 320, 50, 'Скачать DXF', { primary: t >= 11.8 });
    UI.button(ctx, 1530, 962, 320, 50, 'Интерпретации, CSV');
  }

  function controls(ctx, t) {
    const y = 990;
    const items = [['вписать', 110], ['−', 50], ['', 180], ['+', 50], ['по улице', 120], ['обозначения', 150]];
    let x = 440;
    items.forEach(([s, w], i) => {
      if (i === 2) {
        ctx.fillStyle = lib.rgba(C.bone, 0.25);
        ctx.fillRect(x, y + 22, w, 3);
        ctx.fillStyle = C.bone;
        ctx.beginPath();
        ctx.arc(x + w * 0.42, y + 23, 8, 0, Math.PI * 2);
        ctx.fill();
      } else UI.button(ctx, x, y, w, 46, s, { primary: i === 5 && t > 12.6 });
      x += w + 10;

    // панель обозначений со слоями
    const lq = G.seg(t, 12.6, 0.3, 'linear');
    if (lq > 0) {
      UI.panel(ctx, 1030, 690, 440, 270, { p: lq });
      const rows = [['посадки', 1], ['отклонённые места', 1], ['подземные сети, 8 видов', G.seg(t, 13.5, 0.2, 'linear')], ['борта и покрытия, 5', 1], ['здания', 1]];
      rows.forEach(([s, on], i) => UI.check(ctx, 1060, 716 + i * 46, s, on));
    }
  }

  FILM.slide({
    id: 'interface',
    mode: 'ui',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, T) {
      const t = (T - LEAD) / SLOW;
      map(ctx, t);
      // в конце панели уходят, остаётся карта: с неё начинается подъём над городом
      const uiA = 1 - G.seg(T, DUR - 1.8, 0.9, 'linear');
      ctx.save();
      ctx.globalAlpha *= uiA;
      left(ctx, t);
      right(ctx, t);
      controls(ctx, t);
      const [tx, ty] = toScreen(TREE.x, TREE.y);
      const [dx, dy] = toScreen(...treePos(t));
      const [gx, gy] = toScreen(GONE.x, GONE.y);
      const keys = [[0, 1200, 900], [1.4, tx + 6, ty + 6], [2.4, tx + 6, ty + 6], [3.1, 82, 572], [3.6, 82, 572], [4.3, tx + 6, ty + 6]];
      let cx, cy;
      if (t < 4.3) [cx, cy] = UI.path(keys, t);
      else if (t < 7.7) [cx, cy] = [dx + 6, dy + 6];
      else [cx, cy] = UI.path([[7.7, dx + 6, dy + 6], [8.7, gx + 6, gy + 6], [9.6, gx + 6, gy + 6], [10.4, 230, 635], [11.9, 230, 635], [12.5, 1075, 1013], [12.8, 1075, 1013], [13.4, 1072, 820], [16, 1072, 820]], t);
      let click = 0;

/*
 * audio.js : звук синтезируется в Web Audio, файлов нет. Выключен, пока не нажата M.
 * Пэд держит аккорд слайда, на смене слайда глухой удар и колокольчик, на каждой доле тихий щелчок.
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  let ac = null;
  let master = null;
  let on = false;
  let pad = [];
  let tickTimer = null;

  // аккорды по кругу: ля минор, фа, до, соль, ре минор (частоты в герцах)
  const CHORDS = [
    [220.0, 261.63, 329.63, 392.0],
    [174.61, 220.0, 261.63, 329.63],
    [196.0, 261.63, 329.63, 392.0],
    [196.0, 246.94, 293.66, 392.0],
    [146.83, 220.0, 293.66, 349.23],
  ];

  function ensure() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    master.connect(comp);
    comp.connect(ac.destination);
  }

  function setPad(i) {
    const now = ac.currentTime;
    for (const v of pad) {
      v.g.gain.cancelScheduledValues(now);
      v.g.gain.setTargetAtTime(0, now, 0.6);
      v.o.stop(now + 4);
    }
    pad = [];
    const chord = CHORDS[i % CHORDS.length];
    chord.forEach((f, k) => {
      for (const det of [-4, 5]) {
        const o = ac.createOscillator();
        o.type = k === 0 ? 'triangle' : 'sawtooth';
        o.frequency.value = f / (k === 0 ? 2 : 1);
        o.detune.value = det;
        const flt = ac.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.value = 900;
        flt.Q.value = 0.4;
        const g = ac.createGain();
        g.gain.value = 0;
        g.gain.setTargetAtTime(k === 0 ? 0.05 : 0.016, now, 1.2);
        o.connect(flt);
        flt.connect(g);
        g.connect(master);
        o.start(now);
        pad.push({ o, g });
      }
    });
  }

  function hit(freq, dur, vol, type) {
    const now = ac.currentTime;
    const o = ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, now);
    if (!type) o.frequency.exponentialRampToValueAtTime(freq * 0.5, now + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(master);
    o.start(now);
    o.stop(now + dur + 0.05);
  }

  function tick() {
    if (!on) return;
    const now = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 0.02);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const flt = ac.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = 3500;
    const g = ac.createGain();
    g.gain.value = 0.05;
    src.connect(flt);
    flt.connect(g);
    g.connect(master);
    src.start(now);
  }

  let current = 0;
  FILM.audio = {
    toggle() {
      ensure();
      on = !on;
      if (ac.state === 'suspended') ac.resume();
      master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.3);
      if (on) {
        setPad(current);
        tickTimer = setInterval(tick, 500);
      } else {
        clearInterval(tickTimer);
      }
    },
    onSlide(i) {
      current = i;
      if (!on) return;
      setPad(i);
      hit(110, 0.5, 0.35);
      hit(CHORDS[i % CHORDS.length][3] * 2, 1.2, 0.05, 'sine');
    },
  };
})();

/*
 * player.js : показ слайдов.
 *
 *   сами по себе     слайды идут подряд до последнего и замирают на нём
 *   → ← PgDn PgUp   листать; после ручного шага слайд доигрывает анимацию и ждёт
 *   клик            следующий слайд
 *   пробел          пауза
 *   Enter           снова автопоказ с текущего слайда
 *   Home / End      к первому / последнему
 *   F               полный экран
 *   M               звук
 *   ?s=N&t=сек&still=1   открыть слайд N на секунде t и заморозить кадр (для снимков)
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const lib = FILM.lib;
  const P = lib.pal;
  const W = FILM.W;
  const H = FILM.H;
  const slides = FILM.SLIDES;
  const N = slides.length;
  const params = new URLSearchParams(location.search);
  const EPS = 1e-6;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  const canvas = document.getElementById('stage');
  let ctx = canvas.getContext('2d', { alpha: false });
  const layerA = FILM.makeCanvas(2, 2);
  const layerB = FILM.makeCanvas(2, 2);
  const ctxA = layerA.getContext('2d', { alpha: false });
  const ctxB = layerB.getContext('2d', { alpha: false });

  // ---------------------------------------------------------------------------
  // Размер и качество
  // ---------------------------------------------------------------------------

  const MAX_PX = Number(params.get('px')) || 2560;
  let quality = 1;
  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const cssW = Math.min(vw, (vh * 16) / 9);
    const cssH = (cssW * 9) / 16;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = window.devicePixelRatio || 1;
    const pw = Math.max(640, Math.min(MAX_PX, Math.round(cssW * dpr * quality)));
    const ph = Math.round((pw * 9) / 16);
    for (const c of [canvas, layerA, layerB]) {
      c.width = pw;
      c.height = ph;
    }
    ctx = canvas.getContext('2d', { alpha: false });
    FILM.S = pw / W;
  }
  window.addEventListener('resize', resize);
  resize();

  function base(c) {
    c.setTransform(c.canvas.width / W, 0, 0, c.canvas.height / H, 0, 0);
  }

  function resetCtx(c, clear) {
    if (clear && typeof c.reset === 'function') c.reset();
    else {
      for (let i = 0; i < 32; i++) c.restore();
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
      c.setLineDash([]);
    }
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = 'high';
  }

  // ---------------------------------------------------------------------------
  // Кадр одного слайда
  // ---------------------------------------------------------------------------

  let clock = 0; // общее время показа: от него кипят линии
  function drawSlide(c, i, t) {
    const s = slides[i];
    resetCtx(c, true);
    c.fillStyle = s.mode === 'blue' ? P.navy : s.mode === 'ui' ? FILM.G.C.graphite : P.paper;
    c.fillRect(0, 0, c.canvas.width, c.canvas.height);
    base(c);
    FILM.frameT = clock;
    const info = { i, dur: s.dur, p: clamp01(t / s.dur), T: clock, W, H, lib, mode: s.mode, S: FILM.S };
    try {
      if (FILM.G) {
        FILM.G.sunA = 0.9;
        FILM.G.zoomNow = 1;
      }
      c.save();
      s.draw(c, t, info);
      c.restore();
    } catch (e) {
      console.error('slide ' + s.id, e);
      resetCtx(c);
      base(c);
      c.fillStyle = '#5a1010';
      c.fillRect(0, 0, W, H);
      c.fillStyle = '#fff';
      c.font = '32px monospace';
      c.fillText(s.id + ': ' + (e && e.message), 60, 120);
    }
    resetCtx(c);
  }

  // ---------------------------------------------------------------------------
  // Переходы: A уходит, B приходит, p от 0 до 1
  // ---------------------------------------------------------------------------

  const E = lib.ease;
  function composite(tr, A, B, p, dir, fromMode) {
    resetCtx(ctx);
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const S = w / W;
    const kind = tr.kind || 'fade';
    const x = (tr.x != null ? tr.x : W / 2) * S;
    const y = (tr.y != null ? tr.y : H / 2) * S;
    if (kind === 'cut') {
      ctx.drawImage(B, 0, 0);
      return;
    }
    if (kind === 'fade' || kind === 'morph') {
      const e = E.inOutSine(p);
      ctx.drawImage(A, 0, 0);
      ctx.globalAlpha = e;
      ctx.drawImage(B, 0, 0);
      return;
    }
    if (kind === 'lens') {
      // рентгеновская линза: B проявляется в растущем круге, по краю идёт кольцо с делениями
      const e = E.inOutSine(p);
      const R = Math.hypot(Math.max(x, w - x), Math.max(y, h - y)) * 1.02;
      const r = Math.max(0.5, e * R);
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.clip();
      const k = 1.08 - 0.08 * e; // внутри линзы лёгкое увеличение
      ctx.translate(x, y);
      ctx.scale(k, k);
      ctx.translate(-x, -y);
      ctx.drawImage(B, 0, 0);
      ctx.restore();
      ringEdge(x, y, r, S, p, tr.ring || (fromMode === 'blue' ? P.lavender : P.ink));
      return;
    }
    if (kind === 'scan') {
      // диагональная развёртка по углу полос
      const e = E.inOutSine(p);
      const a = tr.angle != null ? tr.angle : -0.52;
      const nx = -Math.sin(a), ny = Math.cos(a);
      const L = (Math.abs(nx) * w + Math.abs(ny) * h) / 2 + 80 * S;
      const d = -L + 2 * L * e;
      const cx = w / 2, cy = h / 2;
      const ux = Math.cos(a), uy = Math.sin(a);
      const far = Math.hypot(w, h);
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath();
      const px0 = cx + nx * d, py0 = cy + ny * d;
      ctx.moveTo(px0 - ux * far, py0 - uy * far);
      ctx.lineTo(px0 + ux * far, py0 + uy * far);
      ctx.lineTo(px0 + ux * far - nx * far * 2, py0 + uy * far - ny * far * 2);
      ctx.lineTo(px0 - ux * far - nx * far * 2, py0 - uy * far - ny * far * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(B, 0, 0);
      ctx.restore();
      // кромка: двойная линия и штрихи вдоль неё
      ctx.save();
      ctx.strokeStyle = tr.ring || P.annYellow;
      ctx.lineWidth = 3 * S;
      ctx.beginPath();
      ctx.moveTo(px0 - ux * far, py0 - uy * far);
      ctx.lineTo(px0 + ux * far, py0 + uy * far);
      ctx.stroke();
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.5 * S;
      ctx.beginPath();
      ctx.moveTo(px0 - ux * far + nx * 9 * S, py0 - uy * far + ny * 9 * S);
      ctx.lineTo(px0 + ux * far + nx * 9 * S, py0 + uy * far + ny * 9 * S);
      ctx.stroke();
      ctx.restore();
      return;
    }
    if (kind === 'push') {
      // бумага едет: соседний лист приходит сбоку, как продолжение одного чертежа
      const e = E.inOutCubic(p);
      const sgn = dir < 0 ? -1 : 1;
      const vertical = tr.axis === 'y';
      const dx = vertical ? 0 : -sgn * w * e;
      const dy = vertical ? -sgn * h * e : 0;
      ctx.drawImage(A, dx, dy);
      ctx.drawImage(B, dx + (vertical ? 0 : sgn * w), dy + (vertical ? sgn * h : 0));
      ctx.save();
      ctx.globalAlpha = Math.sin(Math.PI * p) * 0.5;
      ctx.fillStyle = P.ink;
      if (vertical) ctx.fillRect(0, dy + sgn * h - 2 * S, w, 4 * S);
      else ctx.fillRect(dx + (sgn > 0 ? w : 0) - 2 * S, 0, 4 * S, h);
      ctx.restore();
      return;
    }
    if (kind === 'zoom') {
      // наезд в точку: A растёт и тает, B собирается из той же точки
      const e = E.inOutCubic(p);
      const zA = 1 + 5 * E.inQuart(p);
      ctx.save();
      ctx.translate(x, y);
      const zB = 0.55 + 0.45 * E.outCubic(p);
      ctx.scale(zB, zB);
      ctx.translate(-x, -y);
      ctx.drawImage(B, 0, 0);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 1 - clamp01((e - 0.25) / 0.6);
      ctx.translate(x, y);
      ctx.scale(zA, zA);
      ctx.translate(-x, -y);
      ctx.drawImage(A, 0, 0);
      ctx.restore();
      return;
    }
    if (kind === 'ink') {
      // B проступает кляксами, как тушь, растекающаяся по бумаге
      const e = E.inOutCubic(p);
      ctx.drawImage(A, 0, 0);
      ctx.save();
      ctx.beginPath();
      const r = lib.rng('ink' + (tr.seed || 1));
      for (let k = 0; k < 26; k++) {
        const bx = r() * w, by = r() * h;
        const delay = r() * 0.45;
        const q = clamp01((e - delay) / (1 - delay));
        const rad = E.outCubic(q) * Math.hypot(w, h) * (0.18 + r() * 0.22);
        if (rad <= 0) continue;
        ctx.moveTo(bx + rad, by);
        const n = 28;
        for (let j = 1; j <= n; j++) {
          const aa = (j / n) * Math.PI * 2;
          const wob = 1 + 0.12 * lib.noise1(j * 0.7 + k * 3.1, 5);
          ctx.lineTo(bx + Math.cos(aa) * rad * wob, by + Math.sin(aa) * rad * wob);
        }
        ctx.closePath();
      }
      ctx.clip();
      ctx.drawImage(B, 0, 0);
      ctx.restore();
      return;
    }
    ctx.drawImage(B, 0, 0);
  }

  function ringEdge(x, y, r, S, p, color) {
    const fade = Math.sin(Math.PI * clamp01(p));
    if (fade <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3 * S;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = fade * 0.5;
    ctx.lineWidth = 1.5 * S;
    ctx.beginPath();
    ctx.arc(x, y, r + 12 * S, 0, Math.PI * 2);
    ctx.stroke();
    // деления по кольцу, поворачиваются вместе с раскрытием
    ctx.globalAlpha = fade * 0.8;
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    const n = 72;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + p * 1.4;
      const L = (k % 6 === 0 ? 22 : 10) * S;
      ctx.moveTo(x + Math.cos(a) * (r + 12 * S), y + Math.sin(a) * (r + 12 * S));
      ctx.lineTo(x + Math.cos(a) * (r + 12 * S + L), y + Math.sin(a) * (r + 12 * S + L));
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Шкала внизу: деление на каждый слайд, как линейка на чертеже
  // ---------------------------------------------------------------------------

  function hud(mode) {
    resetCtx(ctx);
    base(ctx);
    const col = mode === 'blue' ? P.lavender : mode === 'ui' ? FILM.G.C.boneDim : P.inkSoft;
    const x0 = 60, x1 = W - 60, y = H - 26;
    const seg = (x1 - x0) / N;
    ctx.save();
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    for (let k = 0; k <= N; k++) {
      ctx.moveTo(x0 + k * seg, y - (k % 5 === 0 ? 12 : 7));
      ctx.lineTo(x0 + k * seg, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = mode === 'paper' ? P.annMagenta : P.magenta;
    ctx.lineWidth = 3;
    ctx.beginPath();
    const prog = clamp01(lt / slides[idx].dur);
    ctx.moveTo(x0 + idx * seg, y);
    ctx.lineTo(x0 + (idx + prog) * seg, y);
    ctx.stroke();
    ctx.restore();
    lib.text(ctx, String(idx + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0'), x1, y - 14, {
      size: 20, weight: 400, color: col, alpha: 0.6, align: 'right', tracking: 2,
      family: 'ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace',
    });
    let status = '';
    if (paused) status = 'пауза';
    else if (!auto) status = 'ручной показ';
    if (status) lib.text(ctx, status, x0, y - 14, { size: 20, weight: 400, color: col, alpha: 0.6, tracking: 2 });
    const hintA = 1 - clamp01((clock - 5) / 1.5);
    if (hintA > 0) {
      lib.text(ctx, '← → листать   пробел пауза   F полный экран   M звук', W / 2, y - 14, {
        size: 20, weight: 400, color: col, alpha: 0.55 * hintA, align: 'center', tracking: 1,
      });
    }
  }

  // ---------------------------------------------------------------------------
  // Состояние показа
  // ---------------------------------------------------------------------------

  let idx = Math.max(0, Math.min(N - 1, (Number(params.get('s')) || 1) - 1));
  let lt = Number(params.get('t')) || 0;
  let auto = !params.has('s');
  let paused = params.get('still') === '1';
  let trans = null; // { from, fromLt, t, tr, dir }
  if (params.has('tr') && idx > 0) {
    // кадр перехода для снимков: ?s=N&tr=доля
    const tr = slides[idx].tr || { kind: 'fade', dur: 0.6 };
    const tt = Number(params.get('tr')) * tr.dur;
    trans = { from: idx - 1, fromLt: slides[idx - 1].dur, t: tt, tr, dir: 1 };
    lt = tt;
  }

  function go(j, byAuto) {
    if (j < 0 || j >= N || j === idx) return;
    const dir = j > idx ? 1 : -1;
    const tr = dir > 0 ? slides[j].tr || { kind: 'fade', dur: 0.6 } : { kind: 'push', dur: 0.7 };
    trans = { from: idx, fromLt: lt, t: 0, tr, dir };
    idx = j;
    lt = 0;
    if (!byAuto) auto = false;
    if (FILM.audio) FILM.audio.onSlide(j, tr);
  }
  FILM.go = go;

  window.addEventListener('keydown', (ev) => {
    const k = ev.key;
    if (k === 'ArrowRight' || k === 'PageDown') go(idx + 1, false);
    else if (k === 'ArrowLeft' || k === 'PageUp') go(idx - 1, false);
    else if (k === ' ') paused = !paused;
    else if (k === 'Enter') { auto = true; paused = false; }
    else if (k === 'Home') { go(0, false); auto = true; }
    else if (k === 'End') go(N - 1, false);
    else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    } else if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь') {
      if (FILM.audio) FILM.audio.toggle();
    } else return;
    ev.preventDefault();
  });
  canvas.addEventListener('click', () => go(idx + 1, false));

  // ---------------------------------------------------------------------------
  // Цикл
  // ---------------------------------------------------------------------------

  let last = performance.now();
  let slowFrames = 0;
  let adaptUntil = 8;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (!paused) {
      clock += dt;
      lt += dt;
      if (trans) trans.t += dt;
    }
    if (auto && !paused && !trans && lt >= slides[idx].dur && idx < N - 1) go(idx + 1, true);
    const t0 = performance.now();
    if (trans && trans.t < trans.tr.dur) {
      const p = clamp01(trans.t / trans.tr.dur);
      drawSlide(ctxA, trans.from, trans.fromLt + trans.t);
      drawSlide(ctxB, idx, lt);
      composite(trans.tr, layerA, layerB, p, trans.dir, slides[trans.from].mode);
    } else {
      trans = null;
      drawSlide(ctx, idx, lt);
    }
    hud(slides[idx].mode);
    // если кадр не укладывается в 1/40 с, понижаем разрешение (не ниже 60 процентов)
    if (clock < adaptUntil && !paused) {
      const cost = performance.now() - t0;
      slowFrames = cost > 25 ? slowFrames + 1 : Math.max(0, slowFrames - 1);
      if (slowFrames > 30 && quality > 0.6) {
        quality = Math.max(0.6, quality - 0.15);
        slowFrames = 0;
        adaptUntil = clock + 6;
        resize();
      }
    }
    requestAnimationFrame(frame);
  }
  // Отладка: прогон всего показа кадр за кадром с переходами, как в автопоказе.
  // Возвращает разницу соседних кадров (0..255) по уменьшенной копии: пики = скачки и мерцание.
  FILM.scan = (fps = 30, from = 0, to = N) => {
    const small = FILM.makeCanvas(160, 90);
    const sg = small.getContext('2d', { willReadFrequently: true });
    let prev = null, prev2 = null;
    const out = [];
    let clk = 0;
    for (let i = from; i < to; i++) {
      const s = slides[i];
      for (let k = 0; k * (1 / fps) < s.dur - 1e-6; k++) {
        const lt2 = k / fps;
        clock = clk;
        const tr = s.tr || { kind: 'fade', dur: 0.6 };
        if (i > from && lt2 < tr.dur) {
          drawSlide(ctxA, i - 1, slides[i - 1].dur + lt2);
          drawSlide(ctxB, i, lt2);
          composite(tr, layerA, layerB, clamp01(lt2 / tr.dur), 1, slides[i - 1].mode);
        } else drawSlide(ctx, i, lt2);
        sg.drawImage(canvas, 0, 0, 160, 90);
        const d = sg.getImageData(0, 0, 160, 90).data;
        const g = new Uint8Array(160 * 90);
        for (let p = 0; p < g.length; p++) g[p] = (d[p * 4] * 3 + d[p * 4 + 1] * 5 + d[p * 4 + 2] * 2) / 10;
        let diff = 0, flick = 0;
        if (prev) {
          for (let p = 0; p < g.length; p++) diff += Math.abs(g[p] - prev[p]);
          diff /= g.length;
        }
        if (prev2) {
          // мерцание: кадр вернулся к позапрошлому, а соседний от обоих отличается
          for (let p = 0; p < g.length; p++) flick += Math.max(0, Math.min(Math.abs(g[p] - prev[p]), Math.abs(prev[p] - prev2[p])) - Math.abs(g[p] - prev2[p]));
          flick /= g.length;
        }
        out.push([i, s.id, +lt2.toFixed(3), +diff.toFixed(2), +flick.toFixed(2)]);
        prev2 = prev;
        prev = g;
        clk += 1 / fps;
      }
    }
    return out;
  };

  // Отладка: один кадр слайда i на локальном времени lt при общем времени clk, как PNG
  FILM.shot = (i, lt2, clk) => {
    clock = clk;
    const tr = slides[i].tr || { kind: 'fade', dur: 0.6 };
    if (i > 0 && lt2 < tr.dur) {
      drawSlide(ctxA, i - 1, slides[i - 1].dur + lt2);
      drawSlide(ctxB, i, lt2);
      composite(tr, layerA, layerB, clamp01(lt2 / tr.dur), 1, slides[i - 1].mode);
    } else drawSlide(ctx, i, lt2);
    return canvas.toDataURL('image/png');
  };

  // Прогрев: бумага, синька и растровые слои каждого слайда строятся до показа,
  // иначе первый кадр нового листа стоит до 100 мс и рвёт переход.
  function loading(k) {
    resetCtx(ctx, true);
    ctx.fillStyle = P.paper;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    base(ctx);
    lib.ticks(ctx, W / 2 - 300, H / 2 + 30, { length: 600, n: N * 3, len: 8, major: 3, majorLen: 18, color: P.ink, alpha: 0.5, width: 1.5, p: k / (N * 3) });
    lib.text(ctx, 'green', W / 2, H / 2, { size: 64, weight: 200, color: P.ink, align: 'center', tracking: 4 });
  }
  const warm = [];
  // три кадра на слайд: середина, поздняя часть и финал, каждый на своём варианте «кипения»
  for (let i = 0; i < N; i++) for (let v = 0; v < 4; v++) warm.push([i, v % 3, [0.18, 0.35, 0.7, 1.05][v] * slides[i].dur]);
  let wk = 0;
  function warmStep() {
    const t0 = performance.now();
    while (wk < warm.length && performance.now() - t0 < 40) {
      const [i, v, wt] = warm[wk++];
      const saved = clock;
      clock = v / 12 + 0.001;
      drawSlide(ctxA, i, wt);
      drawSlide(ctxB, i, wt);
      clock = saved;
    }
    if (wk < warm.length) {
      loading(wk);
      setTimeout(warmStep, 0);
    } else {
      requestAnimationFrame((now) => {
        last = now;
        frame(now);
      });
    }
  }
  loading(0);
  setTimeout(warmStep, 0);
})();

</script>
</body>
</html>
