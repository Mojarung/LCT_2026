      const g = c.getContext('2d');
      g.scale(Sx, Sx);
      const saved = FILM.frameT, sun = G.sunA;
      FILM.frameT = variant / 12 + 0.001;
      G.sunA = 0.9;
      drawFn(g);
      FILM.frameT = saved;
      G.sunA = sun;
      layerCache.set(k, c);
      if (layerCache.size > 80) layerCache.delete(layerCache.keys().next().value);
    }
    return c;
  };
  G.cached = (ctx, key, drawFn, o = {}) => ctx.drawImage(G.cachedCanvas(key, drawFn, o), 0, 0, FILM.W, FILM.H);

  function rectPoly(x0, y0, x1, y1) {
    return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  }
  G.rectPoly = rectPoly;

  /** Поверхность улицы: здания, тротуары, газоны, борта, проезжая часть. */
  G.drawSurface = (g, o = {}) => {
    const W = 1920;
    // o.part: 'road' | 'walks' | 'lawns' | 'buildings'; без него вся поверхность
    const on = (p) => !o.part || o.part === p;
    if (on('road')) {
    // проезжая часть
    g.fillStyle = C.asphalt;
    g.fillRect(-60, S.road[0], W + 120, S.road[1] - S.road[0]);
    lib.stipple(g, rectPoly(-60, S.road[0], W + 60, S.road[1]), { spacing: 9, r: [0.6, 1.3], color: P.inkSoft, alpha: 0.35, seed: 41, density: 0.55 });
    // осевая разметка
    for (let x = -20; x < W; x += 110) lib.inkLine(g, x, 580, x + 60, 580, { width: 3, color: P.white, alpha: 0.95, seed: 700 + x, taper: 4 });
    // пешеходный переход
    for (let k = 0; k < 7; k++) {
      const yy = S.road[0] + 16 + k * 30;
      g.fillStyle = lib.rgba(P.white, 0.9);
      g.fillRect(1500, yy, 110, 16);
    }
    }
    if (on('walks')) {
    // тротуары с плиткой
    for (const [y0, y1] of [S.walkTop, S.walkB]) {
      g.fillStyle = C.tile;
      g.fillRect(-60, y0, W + 120, y1 - y0);
      g.strokeStyle = lib.rgba(P.inkFaint, 0.22);
      g.lineWidth = 1;
      g.beginPath();
      for (let x = -20; x < W; x += 40) {
        g.moveTo(x, y0);
        g.lineTo(x, y1);
      }
      for (let y = y0 + 20; y < y1; y += 20) {
        g.moveTo(-60, y);
        g.lineTo(W + 60, y);
      }
      g.stroke();
    }
    for (const y of [S.walkTop[1], S.walkB[0]]) lib.inkLine(g, -40, y, W + 40, y, { width: 2, alpha: 0.8, seed: y + 11, wobble: 1.2 });
    }
    if (on('lawns')) {
    // газоны
    for (const [y0, y1] of [S.lawnA, S.lawnB]) {
      g.fillStyle = C.lawn;
      g.fillRect(-60, y0, W + 120, y1 - y0);
      lib.hatch(g, rectPoly(-60, y0 + 4, W + 60, y1 - 4), { angle: -1.2, spacing: 11, length: [6, 14], gap: [6, 16], width: 1.3, color: C.lawnDeep, alpha: 0.8, seed: y0 });
    }
    }
    if (on('road')) {
    // бортовой камень: двойная линия
    for (const y of [S.curbA, S.curbB]) {
      lib.inkLine(g, -40, y, W + 40, y, { width: 4, seed: y, wobble: 1 });
      lib.inkLine(g, -40, y + (y === S.curbA ? 7 : -7), W + 40, y + (y === S.curbA ? 7 : -7), { width: 1.5, alpha: 0.6, seed: y + 5, wobble: 1 });
    }
    }
    if (on('buildings')) {
    // здания: кровля, штриховка тени, двойной контур
    S.buildings.forEach((poly, i) => {
      g.save();
      g.beginPath();
      lib.tracePath(g, poly, true);
      g.fillStyle = C.roof;
      g.fill();
      g.restore();
      lib.hatch(g, poly, { spacing: 9, width: 1.3, color: C.roofDeep, alpha: 0.75, seed: 90 + i, density: 0.75 });
      lib.inkPath(g, poly, { closed: true, width: 3.2, seed: 50 + i, smooth: false, wobble: 1.2, double: true });
    });
    // тень верхнего ряда зданий на тротуаре: свет сверху слева
    g.save();
    g.globalAlpha *= 0.1;
    g.fillStyle = P.ink;
    for (const poly of S.buildings.slice(0, 4)) {
      const xs = poly.map((p) => p[0]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      g.beginPath();
      g.moveTo(x0, 230);
      g.lineTo(x1, 230);
      g.lineTo(x1 + 26, 262);
      g.lineTo(x0 + 26, 262);
      g.closePath();
      g.fill();
    }
    g.restore();
    // детали кровли: вентшахты и коньки
    const rr = lib.rng(77);
    S.buildings.forEach((poly, i) => {
      const xs = poly.map((p) => p[0]), ys = poly.map((p) => p[1]);
      const x0 = Math.max(Math.min(...xs), -20), x1 = Math.min(Math.max(...xs), 1940);
      const y0 = Math.min(...ys), y1 = Math.min(Math.max(...ys), 1080);
      for (let k = 0; k < 3; k++) {
        const bx = lerp(x0 + 40, x1 - 80, rr()), by = lerp(y0 + 20, y1 - 60, rr());
        g.fillStyle = C.roofDeep;
        g.fillRect(bx, by, 34, 22);
        lib.inkPath(g, lib.rectPts(bx, by, 34, 22, 12), { closed: true, width: 1.8, seed: i * 10 + k, wobble: 0.5, smooth: false });
      }
      lib.inkLine(g, x0 + 20, (y0 + y1) / 2, x1 - 20, (y0 + y1) / 2, { width: 1.4, alpha: 0.45, seed: 300 + i });
    });
    }
    if (on('walks')) {
    // тактильная плитка у перехода и скамейки
    g.fillStyle = '#E8C766';
    g.fillRect(1500, S.walkTop[1] - 16, 110, 12);
    g.fillRect(1500, S.walkB[0] + 4, 110, 12);
    for (const x of [300, 820, 1760]) {
      g.fillStyle = C.roof;
      g.fillRect(x, 262, 70, 16);
      lib.inkPath(g, lib.rectPts(x, 262, 70, 16, 14), { closed: true, width: 1.6, seed: x, smooth: false, wobble: 0.4 });
    }
    // остановка на нижнем тротуаре
    g.fillStyle = lib.rgba(P.paleBlue, 0.6);
    g.fillRect(980, 812, 200, 50);
    lib.hatch(g, lib.rectPts(980, 812, 200, 50, 20), { spacing: 7, width: 1.1, color: P.tealDeep, alpha: 0.5, seed: 5 });
    lib.inkPath(g, lib.rectPts(980, 812, 200, 50, 20), { closed: true, width: 2.4, seed: 44, smooth: false });
    }
    if (on('road')) {
    // стрелки на полосах
    for (const [x, y, d] of [[260, 520, 1], [1180, 520, 1], [760, 640, -1], [1760, 640, -1]]) {
      lib.inkPath(g, [[x - 34 * d, y], [x + 20 * d, y]], { width: 3, color: P.white, taper: 3, seed: x });
      lib.inkPath(g, [[x + 6 * d, y - 12], [x + 24 * d, y], [x + 6 * d, y + 12]], { width: 3, color: P.white, taper: 3, seed: x + 1 });
    }
    // люки канализации
    for (const x of S.nets[5].wells) {
      g.fillStyle = C.asphaltDeep;
      g.beginPath();
      g.arc(x, 560, 13, 0, TAU);
      g.fill();
      lib.inkCircle(g, x, 560, 13, { width: 2, seed: x });
    }
    if (o.poles !== false) G.drawPoles(g);
    }
  };

  G.drawPoles = (g, o = {}) => {
    for (const [x, y] of S.poles) {
      g.fillStyle = P.white;
      g.beginPath();
      g.arc(x, y, 9, 0, TAU);
      g.fill();
      lib.inkCircle(g, x, y, 9, { width: 2.4, seed: x + y });
      lib.inkLine(g, x - 5, y, x + 5, y, { width: 1.6, taper: 2, seed: x });
      lib.inkLine(g, x, y - 5, x, y + 5, { width: 1.6, taper: 2, seed: y });
    }
  };

  /** Сети на синьке: двойная линия, подпись у левого края, колодцы. */
  G.drawNetsBlue = (g, o = {}) => {
    const q = o.p != null ? o.p : 1;
    const only = o.only;
    for (const n of S.nets) {
      if (only && !only.includes(n.key)) continue;
      const pts = n.pts;
      let L = 0;
      for (let i = 0; i + 1 < pts.length; i++) L += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      g.save();
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.setLineDash([L * q, L * 2]);
      const off = n.channel || 0;
      const passes = off ? [-off / 2, off / 2] : [0];
      for (const d of passes) {
        g.beginPath();
        pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1] + d) : g.moveTo(p[0], p[1] + d)));
        g.strokeStyle = lib.rgba(n.color, 0.25);
        g.lineWidth = 10;
        g.stroke();
        g.strokeStyle = n.color;
        g.lineWidth = 2.5;
        g.stroke();
      }
      g.restore();
      if (o.labels !== false && q > 0.2) {
        G.text(g, n.name, (o.labelX || 70), pts[0][1] - 12 - (n.channel || 0) / 2, { size: 20, weight: 500, family: G.MONO, color: n.color, alpha: 0.9 * clamp((q - 0.2) * 3), tracking: 1 });
      }
      if (n.wells) {
        for (const x of n.wells) {
          g.strokeStyle = lib.rgba(n.color, 0.8);
          g.lineWidth = 1.5;
          g.beginPath();
          g.arc(x, pts[0][1], 12 * q, 0, TAU);
          g.stroke();
        }
      }
    }
  };

  /** Контуры поверхности на синьке тонкой лавандой: здания, борта, края газонов. */
  G.drawSurfaceBlue = (g, o = {}) => {
    g.save();
    g.strokeStyle = lib.rgba(P.lavender, o.alpha != null ? o.alpha : 0.5);
    g.lineWidth = 1.5;
    for (const poly of S.buildings) {
      g.beginPath();
      lib.tracePath(g, poly, true);
      g.stroke();
    }
    g.beginPath();
    for (const y of [S.walkTop[1], S.curbA, S.curbB, S.walkB[0]]) {
      g.moveTo(-40, y);
      g.lineTo(1960, y);
    }
    g.stroke();
    g.setLineDash([4, 8]);
    g.strokeStyle = lib.rgba(P.lavender, 0.25);
    g.beginPath();
    g.moveTo(-40, 580);
    g.lineTo(1960, 580);
    g.stroke();
    g.restore();
    for (const [x, y] of S.poles) {
      g.strokeStyle = lib.rgba(P.lineWhite, 0.7);
      g.lineWidth = 1.5;
      g.beginPath();
      g.arc(x, y, 8, 0, TAU);
      g.stroke();
    }
  };

  // ---------------------------------------------------------------------------
  // Деревья и кустарники в плане
  // ---------------------------------------------------------------------------

  const crownCache = new Map();
  function crownPts(x, y, r, seed, lobes) {
    const key = [x, y, r, seed, lobes].join('|');
    let v = crownCache.get(key);
    if (v) return v;
    const rr = lib.rng(seed);
    const n = lobes || 9;
    const pts = [];
    const ph = rr() * TAU;
    const steps = n * 6;
    for (let i = 0; i < steps; i++) {
      const a = ph + (i / steps) * TAU;
      const lobe = Math.abs(Math.sin(((i % 6) / 6) * Math.PI));
      const k = 0.86 + 0.14 * lobe + 0.05 * lib.noise1(i * 0.37, seed);
      pts.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]);
    }
    v = pts;
    crownCache.set(key, v);
    if (crownCache.size > 3000) crownCache.clear();
    return v;
  }

  /**
   * tree(ctx, x, y, r, o) : крона сверху. o.s : масштаб появления (0..1+), o.kind 'leaf' | 'conifer',
   * o.fill / o.deep : цвета, o.hatch : штриховать тень (дорого, для крупных планов).
   */
  G.tree = (g, x, y, r, o = {}) => {
    const s = o.s != null ? o.s : 1;
    if (s <= 0.01) return;
    const seed = o.seed || Math.round(x * 7 + y * 13);
    const rad = r * s;
    const conifer = o.kind === 'conifer';
    const fill = o.fill || (conifer ? C.conifer : C.crown);
    const deep = o.deep || (conifer ? C.coniferDeep : C.crownDeep);
    let pts;
    if (conifer) {
      pts = [];
      const n = 16;
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * TAU;
        const k = i % 2 ? 0.62 : 1;
        pts.push([x + Math.cos(a) * rad * k, y + Math.sin(a) * rad * k]);
      }
    } else pts = crownPts(x, y, rad, seed, o.lobes);
    // тень кроны на земле
    g.save();
    g.globalAlpha *= 0.18;
    g.fillStyle = P.ink;
    g.beginPath();
    const sa = o.sun != null ? o.sun : G.sunA != null ? G.sunA : 0.9;
    const sl = o.shadow != null ? o.shadow : 0.26;
    lib.tracePath(g, pts.map(([px, py]) => [px + Math.cos(sa) * rad * sl, py + Math.sin(sa) * rad * sl]), true);
    g.fill();
    g.restore();
    // при наезде камеры дрожь линий в координатах мира растёт вместе с масштабом: гасим её
    const zb = 1 / Math.max(1, G.zoomNow || 1);
    lib.inkPath(g, pts, { closed: true, width: o.width || Math.max(1.6, Math.min(4, rad * 0.07)), fill, seed, wobble: 0.8, smooth: !conifer, boilAmp: 0.7 * zb });
    if (o.hatch !== false && rad > 14) {
      // тень на правой нижней половине
      lib.hatch(g, pts, {
        spacing: Math.max(4, rad * 0.11),
        width: Math.max(0.9, rad * 0.025),
        length: [rad * 0.2, rad * 0.55],
        color: deep,
        alpha: 0.85,
        seed: seed + 3,
        clip: true,
        density: (px, py) => clamp(((px - x) + (py - y)) / (rad * 1.2) + 0.35),
        boilAmp: 0.45 * zb,
      });
    }
    // ствол
    g.fillStyle = P.inkSoft;
    g.beginPath();
    g.arc(x, y, Math.max(1.5, rad * 0.09), 0, TAU);
    g.fill();
  };

  /** Группа кустарников: несколько мелких крон в полосе. */
  G.shrubs = (g, x, y, w, h, o = {}) => {
    const s = o.s != null ? o.s : 1;
    if (s <= 0.01) return;
    const rr = lib.rng(o.seed || Math.round(x + y * 3));
    const n = o.n || Math.max(3, Math.round((w * h) / 900));
    for (let i = 0; i < n; i++) {
      const px = x + rr() * w, py = y + rr() * h;
      const r = rr.range(9, 15);
      const q = clamp(s * 1.4 - (i / n) * 0.4);
      G.tree(g, px, py, r, { s: E.outBack(q), fill: o.fill || C.shrub, deep: C.shrubDeep, hatch: false, seed: i + 17 * (o.seed || 1), lobes: 6, width: 1.6 });
    }
  };

  // ---------------------------------------------------------------------------
  // Узел схемы на синьке: двойной круг с глифом внутри
  // ---------------------------------------------------------------------------

  G.node = (g, x, y, r, o = {}) => {
    const q = o.p != null ? o.p : 1;
    if (q <= 0) return;
    const e = E.outBack(clamp(q));
    const rr = r * e;
    g.save();
    g.fillStyle = lib.rgba(P.navyLight, 0.95);
    g.beginPath();
    g.arc(x, y, rr, 0, TAU);
    g.fill();
    g.strokeStyle = lib.rgba(P.lavender, 0.85);
    g.lineWidth = 2.5;
    g.stroke();
    g.strokeStyle = lib.rgba(P.lavender, 0.45);
    g.lineWidth = 1.5;
    g.beginPath();
    g.arc(x, y, Math.max(0, rr - 9), 0, TAU);
    g.stroke();
    if (o.lit) {
      g.strokeStyle = o.litColor || P.magenta;
      g.lineWidth = 3;
      g.beginPath();
      g.arc(x, y, rr + 8, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(o.lit));
      g.stroke();
    }
    g.restore();
    if (o.glyph && q > 0.5) {
      g.save();
      g.translate(x, y);
      g.scale(e * (r / 60), e * (r / 60));
      g.globalAlpha *= clamp((q - 0.5) * 2);
      o.glyph(g);
      g.restore();
    }
  };

  /** Гибкая связь между узлами: тонкая дуга лавандой с бегущей точкой. */
  G.link = (g, x1, y1, x2, y2, o = {}) => {
    const q = o.p != null ? clamp(o.p) : 1;
    if (q <= 0) return;
    const bend = o.bend != null ? o.bend : 0.25;
    const mx = (x1 + x2) / 2 - (y2 - y1) * bend, my = (y1 + y2) / 2 + (x2 - x1) * bend;
    const pts = [];
    const n = 40;
    for (let i = 0; i <= n * q; i++) {
      const u = i / n;
      pts.push([(1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2, (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2]);
    }
    g.save();
    g.strokeStyle = lib.rgba(o.color || P.lavender, o.alpha != null ? o.alpha : 0.55);
    g.lineWidth = o.width || 1.5;
    g.beginPath();
    lib.tracePath(g, pts, false);
    g.stroke();
    g.restore();
    if (o.pulse != null && q >= 1) {
      const u = ((o.pulse % 1) + 1) % 1;
      const px = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2;
      const py = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2;
      lib.glowDot(g, px, py, 4, { rays: 0, glow: 5, intensity: 0.9 });
    }
  };

  // ---------------------------------------------------------------------------
  // Кольцо внимания поверх рисунка (outExpo, 5-12 кадров)
  // ---------------------------------------------------------------------------

  G.ring = (g, x, y, r, t, t0, o = {}) => {
    const d = o.dur || 0.45;
    const q = (t - t0) / d;
    if (q <= 0 || q >= 1) return;
    const e = E.outExpo(q);
    g.save();
    g.strokeStyle = o.color || P.annYellow;
    g.globalAlpha *= 1 - q;
    g.lineWidth = o.width || 3;
    g.beginPath();
    g.arc(x, y, r * (0.6 + 0.8 * e), 0, TAU);
    g.stroke();
    g.restore();
  };

  /** Крестик отказа. */
  G.cross = (g, x, y, r, o = {}) => {
    const q = o.p != null ? clamp(o.p) : 1;
    if (q <= 0) return;
    g.save();
    g.strokeStyle = o.color || P.annMagenta;
    g.lineWidth = o.width || 3.5;
    g.lineCap = 'round';
    const a = r * E.outBack(clamp(q * 2));
    const b = r * E.outBack(clamp(q * 2 - 1));
    g.beginPath();
    g.moveTo(x - a, y - a);
    g.lineTo(x + a, y + a);
    if (b > 0) {
      g.moveTo(x + b, y - b);
      g.lineTo(x - b, y + b);
    }
    g.stroke();
    g.restore();
  };

  // ---------------------------------------------------------------------------
  // Виды из config/species.yaml (для цвета крон) и раскладка плана по улице
  // ---------------------------------------------------------------------------

  G.SPECIES = [
    { ru: 'Липа мелколистная', lat: 'Tilia cordata', h: 25, fam: 'Malvaceae', fill: '#8FAF6E', deep: '#5E8248', r: 56 },
    { ru: 'Клён остролистный', lat: 'Acer platanoides', h: 20, fam: 'Sapindaceae', fill: '#A7B85E', deep: '#707F32', r: 58 },
    { ru: 'Боярышник обыкновенный', lat: 'Crataegus laevigata', h: 6, fam: 'Rosaceae', fill: '#B9C98A', deep: '#7D9152', r: 40, thorny: true },
    { ru: 'Сосна обыкновенная', lat: 'Pinus sylvestris', h: 30, fam: 'Pinaceae', fill: '#4F7A57', deep: '#2F5A3F', r: 44, kind: 'conifer' },
    { ru: 'Вяз гладкий', lat: 'Ulmus laevis', h: 25, fam: 'Ulmaceae', fill: '#7FA37C', deep: '#4E7250', r: 54 },
    { ru: 'Рябина обыкновенная', lat: 'Sorbus aucuparia', h: 10, fam: 'Rosaceae', fill: '#C8B27A', deep: '#8E7440', r: 42 },
    { ru: 'Каштан конский обыкновенный', lat: 'Aesculus hippocastanum', h: 22, fam: 'Sapindaceae', fill: '#9DBB86', deep: '#62824E', r: 60 },
    { ru: 'Туя западная', lat: 'Thuja occidentalis', h: 6, fam: 'Cupressaceae', fill: '#5F8C6A', deep: '#3A6247', r: 34, kind: 'conifer' },
  ];
  // слои результата, src/green/infrastructure/cad/writer.py
  G.LAYERS = ['GREEN_TREES', 'GREEN_TREES_APPROVAL', 'GREEN_TREES_BARRIER', 'GREEN_SHRUBS', 'GREEN_SHRUBS_APPROVAL', 'GREEN_REJECT', 'GREEN_LABELS', 'GREEN_ZONE_ALLOWED', 'GREEN_ZONE_APPROVAL'];
  G.SHRUB_COLORS = [['#9DB77A', '#6C8F52'], ['#C3B6D9', '#8C7DAA'], ['#D9B8A0', '#A97F63'], ['#A9C7A3', '#6E9468']];
  G.ok = G.candidates.filter((c) => c.ok);
  G.rejected = G.candidates.filter((c) => !c.ok);
  // вид каждой посадки: по кругу, соседние места разного вида
  G.ok.forEach((c, k) => (c.sp = G.SPECIES[(k * 3 + (c.row === 'B' ? 1 : 0)) % G.SPECIES.length]));

/*

 *   карта Москвы (в пикселях карты, 1 px = 45 м) -> квартал вокруг Берзарина (растр) -> улица (20 px = 1 м).

 * спуск с города в улицу выглядит как одно непрерывное движение.

(function () {

  G.camLerp = (a, b, q) => {
    if (q <= 0) return a;
    if (q >= 1) return b;
    const la = Math.log(a.z), lb = Math.log(b.z);
    const z = Math.exp(lerp(la, lb, q));
    let w = q;
    if (Math.abs(lb - la) > 1e-4) w = (1 / z - 1 / a.z) / (1 / b.z - 1 / a.z);
    return { x: lerp(a.x, b.x, w), y: lerp(a.y, b.y, w), z };

    const dusk = o.dusk || 0;
    const rv = o.reveal != null ? o.reveal : 1;
    ctx.fillStyle = lib.mix('#EDE0C4', '#2B2745', dusk);
    ctx.fillRect(0, 0, 1920, 1080);
    // растр 2x до m = 8, выше вектор; в полосе 6..8 они растворяются друг в друге
    const rasterOK = rv >= 1 && (dusk === 0 || dusk === 1);
    const ra = rasterOK ? 1 - clamp((m - 6) / 2) : 0;
    if (ra < 1) mapBody(ctx, cam, o, 'static');
    if (ra > 0) {
      const [sx, sy] = mapToScreen(cam, 0, 0);
      ctx.save();
      ctx.globalAlpha *= ra;
      ctx.drawImage(mapRaster(o, dusk), sx, sy, 2000 * m, 1100 * m);
      ctx.restore();
    }
    mapBody(ctx, cam, o, 'live');
  };

  function mapBody(ctx, cam, o, part) {
    const ST = part === 'static', LV = part === 'live';
    const m = cam.z * K;
    const t = o.t || 0;
    const dusk = o.dusk || 0;
    const rv = o.reveal != null ? o.reveal : 1;
    const rvA = (a, b) => clamp((rv - a) / (b - a));
    const ink = lib.mix(P.ink, '#E9E1F5', dusk * 0.85);
    const paperCol = lib.mix('#EDE0C4', '#2B2745', dusk);
    if (ST) {
    // градусная сетка: линии листа, по ним видно движение камеры
    ctx.save();
    ctx.strokeStyle = lib.rgba(dusk ? '#8C83B8' : P.inkFaint, 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    const step = 100;
    const x0 = MB[0] + (cam.x - SB[0]) / K - 960 / m, y0 = MB[1] + (cam.y - SB[1]) / K - 540 / m;
    for (let gx = Math.floor((x0 - 200) / step) * step; gx < x0 + VIEW.w / m + 200; gx += step) {
      const [sx] = mapToScreen(cam, gx, 0);
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, VIEW.h);
    }
    for (let gy = Math.floor((y0 - 200) / step) * step; gy < y0 + VIEW.h / m + 200; gy += step) {
      const [, sy] = mapToScreen(cam, 0, gy);
      ctx.moveTo(0, sy);
      ctx.lineTo(VIEW.w, sy);
    }
    ctx.stroke();
    ctx.restore();
    // застройка внутри МКАД чуть темнее листа
    if (rvA(0.5, 0.9) > 0) {
      const poly = MAP.mkad.map((p) => mapToScreen(cam, p[0], p[1]));
      ctx.save();
      ctx.globalAlpha *= rvA(0.5, 0.9);
      ctx.fillStyle = lib.mix(paperCol, dusk ? '#1E1B33' : '#D8C6A2', 0.45);
      ctx.beginPath();
      lib.tracePath(ctx, poly, true);
      ctx.fill();
      ctx.restore();
      MAP.minor.forEach((pts, k) => mapLine(ctx, cam, pts, { width: 1, color: ink, alpha: 0.3 * rvA(0.5, 0.9), seed: 500 + k, wobble: 0.4, taper: [2, 4] }));
    }
    // парки: заливка и штриховка
    for (const [px, py, rx, ry, seed] of MAP.parks) {
      if (rvA(0.5, 0.9) <= 0) break;
      const pts = lib.ellipsePts(px, py, rx, ry, 40).map(([x, y], i) => {
        const k = 1 + 0.12 * lib.noise1(i * 0.5, seed);
        return mapToScreen(cam, px + (x - px) * k, py + (y - py) * k);
      });
      if (m < 4) lib.inkPath(ctx, pts, { closed: true, width: 2, fill: lib.mix(dusk ? '#3F4D46' : '#C7D2AE', paperCol, 0.1), color: ink, seed, wobble: 1 });
      else {
        // вблизи контур парка простой: тысячи точек пера на экране не видны
        ctx.beginPath();
        lib.tracePath(ctx, pts, true);
        ctx.fillStyle = lib.mix(dusk ? '#3F4D46' : '#C7D2AE', paperCol, 0.1);
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      // крапинки в координатах карты: при полёте камеры они едут вместе с листом, а не переигрываются
      {
        const [ox, oy] = mapToScreen(cam, 0, 0);
        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(m, m);
        const mp = lib.ellipsePts(px, py, rx, ry, 40).map(([x, y], i) => {
          const k = 1 + 0.12 * lib.noise1(i * 0.5, seed);
          return [px + (x - px) * k, py + (y - py) * k];
        });
        // вблизи крапинок становится слишком много, парк остаётся заливкой
        if (m < 4) lib.stipple(ctx, mp, { spacing: 9 / Math.sqrt(m), r: [1 / m, 2 / m], color: lib.mix('#6E8F4F', ink, 0.2), alpha: 0.5, seed, boil: m > 1.3 ? false : undefined });
        ctx.restore();
      }
    }
    // река: лента с течением
    const rs = MAP.river.slice(0, Math.max(2, Math.floor(MAP.river.length * rvA(0.1, 0.7)))).map((p) => mapToScreen(cam, p[0], p[1]));
    const rw = Math.max(6, 11 * m);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = dusk ? '#3E5B7A' : '#9CC6CF';
    ctx.lineWidth = rw;
    ctx.beginPath();
    lib.tracePath(ctx, rs, false);
    ctx.stroke();
    ctx.restore();
    }
    if (LV) {
    const rs = MAP.river.slice(0, Math.max(2, Math.floor(MAP.river.length * rvA(0.1, 0.7)))).map((p) => mapToScreen(cam, p[0], p[1]));
    const rw = Math.max(6, 11 * m);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    lib.tracePath(ctx, rs, false);
    ctx.strokeStyle = lib.rgba(dusk ? '#9CC2EA' : P.white, 0.8);
    ctx.lineWidth = Math.max(1.2, rw * 0.12);
    ctx.setLineDash([rw * 1.4, rw * 1.6]);
    ctx.lineDashOffset = -t * 40 * Math.max(1, m * 0.4);
    ctx.stroke();
    ctx.restore();
    }
    if (ST) {
    mapLine(ctx, cam, MAP.river.map(([x, y]) => [x, y - 5.5]), { width: 1.6, color: ink, seed: 71, wobble: 0.8, reveal: rvA(0.1, 0.7) });
    mapLine(ctx, cam, MAP.river.map(([x, y]) => [x, y + 5.5]), { width: 1.6, color: ink, seed: 72, wobble: 0.8, reveal: rvA(0.1, 0.7) });
    // вылетные магистрали и кольца
    MAP.radials.forEach((pts, k) => mapLine(ctx, cam, pts, { width: 1.4, color: ink, alpha: 0.45, seed: 80 + k, wobble: 0.6, reveal: rvA(0.3, 0.9) }));
    MAP.rails.forEach((pts, k) => {
      const q = rvA(0.6, 1);
      if (q <= 0) return;
      mapLine(ctx, cam, pts, { width: 1.6, color: ink, alpha: 0.7, seed: 600 + k, wobble: 0.3, reveal: q });
      // шпалы
      const sp = pts.map((p) => mapToScreen(cam, p[0], p[1]));
      ctx.save();
      ctx.strokeStyle = lib.rgba(ink, 0.6);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i + 1 < sp.length * q - 1; i++) {
        const [x0, y0] = sp[i], [x1, y1] = sp[i + 1];
        const L = Math.hypot(x1 - x0, y1 - y0) || 1;
        const nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
        for (let u = 0; u < 1; u += (8 * m) / L) {
          const x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u;
          ctx.moveTo(x - nx * 4, y - ny * 4);
          ctx.lineTo(x + nx * 4, y + ny * 4);
        }
      }
      ctx.stroke();
      ctx.restore();
    });
    mapLine(ctx, cam, MAP.garden, { closed: true, width: 2.4, color: ink, seed: 3, wobble: 0.8, reveal: rvA(0.4, 0.8) });
    mapLine(ctx, cam, MAP.ttk, { closed: true, width: 3, color: ink, seed: 2, wobble: 0.9, reveal: rvA(0.2, 0.7) });
    mapLine(ctx, cam, MAP.mkad, { closed: true, width: 4.2, color: ink, seed: 1, wobble: 1, double: rv >= 1, reveal: rvA(0, 0.6) });
    // Кремль
    const kr = [[CX - 6, CY + 4], [CX + 7, CY + 5], [CX + 1, CY - 7]].map((p) => mapToScreen(cam, p[0], p[1]));
    lib.inkPath(ctx, kr, { closed: true, width: 2, fill: dusk ? '#C8C1EF' : '#C88C86', color: ink, seed: 9, smooth: false });
    if (m < 3) {
      const lab = (s, mx, my) => {
        const [sx, sy] = mapToScreen(cam, mx, my);
        G.text(ctx, s, sx, sy, { size: 15, weight: 500, family: G.MONO, color: ink, alpha: 0.55, tracking: 3 });
      };
      lab('МКАД', CX + 250, CY - 300);
      lab('ТТК', CX + 96, CY - 118);
      lab('МОСКВА-РЕКА', 1330, 668);
    }
    {
      const [bx, by] = mapToScreen(cam, 1560, 760);
      const [bx2] = mapToScreen(cam, 1560 + 111, 760);
      if (bx2 - bx < 900) {
        lib.ticks(ctx, bx, by, { length: bx2 - bx, n: 5, len: 8, major: 5, majorLen: 14, color: ink, alpha: 0.7, width: 1.6 });
        G.text(ctx, '5 км', bx2 + 10, by + 6, { size: 16, weight: 500, family: G.MONO, color: ink, alpha: 0.7 });
      }
    }
    return;
    }
    // тени облаков плывут по листу; вблизи их не видно, пропускаем
    ctx.save();
    for (let k = 0; k < (m < 3 ? 5 : 0); k++) {
      const r = lib.rng('cloud' + k);
      const mx = ((r() * 2400 + t * (14 + k * 3)) % 2600) - 400, my = 150 + r() * 800;
      const [sx, sy] = mapToScreen(cam, mx, my);
      const rad = (140 + r() * 120) * m;
      if (sx < -rad || sx > 1920 + rad || sy < -rad || sy > 1080 + rad) continue;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
      g.addColorStop(0, lib.rgba(dusk ? '#000' : P.ink, dusk ? 0.12 : 0.06));
      g.addColorStop(1, lib.rgba(P.ink, 0));
      ctx.fillStyle = g;
      ctx.fillRect(sx - rad, sy - rad, rad * 2, rad * 2);
    }
    ctx.restore();
    // метки улиц пилота
    MAP.markers.forEach(([mx, my], k) => {
      const [sx, sy] = mapToScreen(cam, mx, my);
      if (sx < -40 || sx > 1960 || sy < -40 || sy > 1120) return;
      const bloom = o.bloom != null ? clamp(o.bloom * 19 - k) : 0;
      const pop = E.outBack(clamp(rvA(0.75, 1) * 19 - k * 0.6));
      if (pop <= 0) return;
      const hot = k === 0;
      const r = (hot ? 7 : 5) * Math.min(3, Math.max(1, m * 0.6)) * pop;
      if (dusk) {
        lib.glowDot(ctx, sx, sy, r * (0.6 + 0.8 * bloom), { color: '#D9F26B', rays: bloom > 0.5 ? 8 : 0, intensity: 0.4 + 0.8 * bloom, seed: k });
      } else {
        ctx.fillStyle = hot ? P.annMagenta : lib.rgba(P.teal, 0.9);
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, TAU);
        ctx.fill();
        lib.inkCircle(ctx, sx, sy, r + 3, { width: 1.6, color: ink, seed: k + 40 });
      }
      if (hot && !dusk) {
        const ph = (t * 0.8) % 1;
        ctx.save();
        ctx.strokeStyle = lib.rgba(P.annMagenta, 1 - ph);
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 6 + ph * 30, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    });
    // роза ветров и масштаб
    {
      const [sx, sy] = mapToScreen(cam, 1790, 150);
      const R = 48 * m;
      if (R < 400) {
        const rot = t * 0.05;
        for (let k = 0; k < 8; k++) {
          const a = rot + (k * TAU) / 8 - Math.PI / 2;
          const L = k % 2 ? R * 0.5 : R;
          lib.inkPath(ctx, [[sx, sy], [sx + Math.cos(a) * L, sy + Math.sin(a) * L]], { width: k === 0 ? 3 : 1.6, color: k === 0 ? P.annMagenta : ink, seed: 90 + k, taper: 3 });
        }
        lib.inkCircle(ctx, sx, sy, R * 0.72, { width: 1.4, color: ink, seed: 99, alpha: 0.6 });
        G.text(ctx, 'С', sx + Math.cos(rot - Math.PI / 2) * (R + 16), sy + Math.sin(rot - Math.PI / 2) * (R + 16) + 6, { size: 18, weight: 600, family: G.MONO, color: ink, align: 'center' });
      }
    }
    drawCartouche(ctx, cam, t, o.team || 0, ink, dusk);
  }

  function drawCartouche(ctx, cam, t, reveal, ink, dusk) {
    const [cx, cy, cw, ch] = G.CARTOUCHE;
    const [sx, sy] = mapToScreen(cam, cx, cy);
    const [ex, ey] = mapToScreen(cam, cx + cw, cy + ch);
    const w = ex - sx, h = ey - sy;
    if (sx > 1960 || sy > 1120 || ex < -40 || ey < -40) return;
    const s = w / cw; // экранных пикселей на пиксель картуша
    ctx.save();
    ctx.fillStyle = lib.rgba(dusk ? '#353052' : '#F4EAD3', 0.95);
    ctx.fillRect(sx, sy, w, h);
    ctx.restore();
    lib.inkPath(ctx, lib.rectPts(sx, sy, w, h, 30), { closed: true, width: Math.max(1.5, 1.2 * s), color: ink, seed: 301, smooth: false, wobble: 0.8 });
    lib.inkPath(ctx, lib.rectPts(sx + 6 * s, sy + 6 * s, w - 12 * s, h - 12 * s, 30), { closed: true, width: Math.max(1, 0.6 * s), color: ink, alpha: 0.7, seed: 302, smooth: false, wobble: 0.8 });
    // завитки по углам растут вместе с проявлением
    const grow = clamp(reveal * 1.4);
    for (const [kx, ky, dx, dy, ks] of [[sx, sy, 1, 1, 0], [ex, sy, -1, 1, 1], [sx, ey, 1, -1, 2], [ex, ey, -1, -1, 3]]) {
      if (grow <= 0) break;
      const pts = [];
      for (let i = 0; i <= 24 * grow; i++) {
        const a = (i / 24) * TAU * 1.1;
        const r = (22 - i * 0.7) * s;
        pts.push([kx + dx * (16 * s + Math.cos(a) * r * 0.6), ky + dy * (16 * s + Math.sin(a) * r * 0.6)]);
      }
      if (pts.length > 1) lib.inkPath(ctx, pts, { width: Math.max(1, 0.7 * s), color: ink, seed: 320 + ks, taper: [2, 8] });
    }
    // пока имён нет, строки обозначены штрихами; они гаснут, когда вписывается первое имя
    const ph = 1 - clamp(reveal * 4);
    if (ph > 0) for (let i = 0; i < 6; i++) lib.inkLine(ctx, sx + 30 * s, sy + (60 + i * 30) * s, sx + (cw - 60 - (i % 2) * 60) * s, sy + (60 + i * 30) * s, { width: Math.max(1, 0.5 * s), color: ink, alpha: 0.4 * ph, seed: 310 + i });
    if (reveal <= 0) return;
    G.text(ctx, 'КОМАНДА', sx + w / 2, sy + 44 * s, { size: 13 * s, weight: 600, family: G.MONO, color: ink, align: 'center', tracking: 3 * s, p: clamp(reveal * 3) });
    lib.ticks(ctx, sx + w / 2 - 70 * s, sy + 54 * s, { length: 140 * s * clamp(reveal * 3), n: 14, len: 3 * s, major: 7, majorLen: 6 * s, color: ink, alpha: 0.5, width: Math.max(1, 0.5 * s) });
    G.TEAM.forEach((p, i) => {
      const q = clamp(reveal * 7 - 1.4 - i * 0.9);
      const y = sy + (84 + i * 32) * s;
      if (q <= 0) return;
      // значок: крона вида из каталога
      const sp = G.SPECIES[(i * 3) % G.SPECIES.length];
      G.tree(ctx, sx + 30 * s, y - 5 * s, 10 * s, { s: E.outBack(clamp(q * 2)), kind: sp.kind, fill: sp.fill, deep: sp.deep, hatch: s > 2, seed: 400 + i, width: Math.max(1, 0.5 * s) });
      G.text(ctx, p.name, sx + 52 * s, y, { size: 14 * s, weight: 500, color: ink, p: q });
      G.text(ctx, p.role, sx + cw * s - 40 * s, y, { size: 10.5 * s, weight: 400, color: dusk ? '#C8C1EF' : P.inkSoft, align: 'right', p: q });
    });
  }

  // ---------------------------------------------------------------------------
  // Квартал вокруг Берзарина: векторные фигуры в координатах улицы, рисуются с отсечением
  // ---------------------------------------------------------------------------

  const DIST = { x: SB[0] - 36000, y: SB[1] - 20250, w: 72000, h: 40500 };
  const HOLE = [-60, -60, 1980, 1140]; // здесь лежит сама улица, квартал её не перекрывает
  let distShapes = null;
  function districtShapes() {
    if (distShapes) return distShapes;
    const S = G.street;
    const out = { bands: [], rects: [], dots: [] };
    const band = (x, y, w, h, fill) => out.bands.push([x, y, w, h, fill]);
    const hs = [-8500, -16500, 9200, 16800];
    const vs = [-31000, -22500, -13000, -4200, 6400, 15200, 24800, 33000];
    band(DIST.x, S.walkTop[0], DIST.w, S.walkB[1] - S.walkTop[0], C.tile);
    band(DIST.x, S.lawnA[0], DIST.w, S.lawnA[1] - S.lawnA[0], C.lawn);
    band(DIST.x, S.lawnB[0], DIST.w, S.lawnB[1] - S.lawnB[0], C.lawn);
    band(DIST.x, S.road[0], DIST.w, S.road[1] - S.road[0], C.asphalt);
    for (const y of hs) {
      band(DIST.x, y - 300, DIST.w, 600, C.tile);
      band(DIST.x, y - 180, DIST.w, 360, C.asphalt);
    }
    for (const x of vs) {
      band(x - 280, DIST.y, 560, DIST.h, C.tile);
      band(x - 170, DIST.y, 340, DIST.h, C.asphalt);
    }
    const r = lib.rng('district');
    const inHole = (x0, y0, x1, y1) => x1 > HOLE[0] && x0 < HOLE[2] && y1 > HOLE[1] && y0 < HOLE[3];
    const ys = [DIST.y, -16500, -8500, S.road[0] - 1, S.road[1] + 1, 9200, 16800, DIST.y + DIST.h].sort((a, b) => a - b);
    const xs = [DIST.x, ...vs, DIST.x + DIST.w].sort((a, b) => a - b);
    for (let i = 0; i + 1 < ys.length; i++) {
      for (let j = 0; j + 1 < xs.length; j++) {
        const bx0 = xs[j] + 400, bx1 = xs[j + 1] - 400;
        let by0 = ys[i] + 400, by1 = ys[i + 1] - 400;
        if (Math.abs(ys[i] - (S.road[1] + 1)) < 2) by0 = S.facadeBot;
        if (Math.abs(ys[i + 1] - (S.road[0] - 1)) < 2) by1 = S.facadeTop;
        if (by1 - by0 < 600 || bx1 - bx0 < 800) continue;
        let y = by0;
        while (y < by1 - 400) {
          const hgt = 400 + r() * 900;
          let x = bx0;
          while (x < bx1 - 500) {
            const wid = 700 + r() * 2200;
            const x1 = Math.min(bx1, x + wid), y1 = Math.min(by1, y + hgt);
            if (!inHole(x, y, x1, y1)) {
              if (r() < 0.76) out.rects.push([x, y, x1 - x, y1 - y, r() < 0.5 ? C.roof : '#DCC9A6']);
              else for (let k = 0; k < 5; k++) out.dots.push([x + r() * wid, y + r() * hgt, 60 + r() * 90, r() < 0.5 ? C.crown : C.crownDeep]);
            }
            x += wid + 200 + r() * 300;
          }
          y += hgt + 300 + r() * 400;
        }
      }
    }
    // деревья вдоль соседних улиц и продолжение аллеи главной
    for (const y of hs) for (let x = DIST.x; x < DIST.x + DIST.w; x += 150 + r() * 80) {
      out.dots.push([x, y - 240, 55, C.crownDeep]);
      out.dots.push([x + 60, y + 240, 55, C.crownDeep]);
    }
    for (let x = DIST.x; x < DIST.x + DIST.w; x += 120) {
      if (x > HOLE[0] - 60 && x < HOLE[2] + 60) continue;
      out.dots.push([x, 410, 50, C.crown]);
      out.dots.push([x + 60, 740, 50, C.crown]);
    }
    out.river = MAP.river.map(([mx, my]) => [SB[0] + (mx - MB[0]) * K, SB[1] + (my - MB[1]) * K]);
    distShapes = out;
    return out;
  }

  function drawDistrict(ctx, cam, alpha) {
    const D = districtShapes();
    const vx0 = cam.x - 980 / cam.z, vx1 = cam.x + 980 / cam.z, vy0 = cam.y - 560 / cam.z, vy1 = cam.y + 560 / cam.z;
    const vis = (x, y, w, h) => x + w > vx0 && x < vx1 && y + h > vy0 && y < vy1;
    ctx.save();
    ctx.globalAlpha *= alpha;
    G.applyCam(ctx, cam);
    ctx.fillStyle = '#EDE0C4';
    ctx.fillRect(Math.max(DIST.x, vx0), Math.max(DIST.y, vy0), Math.min(DIST.x + DIST.w, vx1) - Math.max(DIST.x, vx0), Math.min(DIST.y + DIST.h, vy1) - Math.max(DIST.y, vy0));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#9CC6CF';
    ctx.lineWidth = 11 * K;
    ctx.beginPath();
    lib.tracePath(ctx, D.river, false);
    ctx.stroke();
    for (const [x, y, w, h, f] of D.bands) {
      if (!vis(x, y, w, h)) continue;
      ctx.fillStyle = f;
      ctx.fillRect(x, y, w, h);
    }
    const byFill = new Map();
    const strokes = new Path2D();
    for (const [x, y, w, h, f] of D.rects) {
      if (!vis(x, y, w, h)) continue;
      let p = byFill.get(f);
      if (!p) byFill.set(f, (p = new Path2D()));
      p.rect(x, y, w, h);
      strokes.rect(x, y, w, h);
    }
    for (const [f, p] of byFill) {
      ctx.fillStyle = f;
      ctx.fill(p);
    }
    // уровни детализации: контуры и деревья дворов рисуются, только когда их видно
    // контуры и точки дворов проявляются по масштабу, а не включаются разом
    const la = clamp((cam.z - 0.008) / 0.008);
    if (la > 0) {
      ctx.strokeStyle = lib.rgba(P.ink, 0.8 * la);
      ctx.lineWidth = 1.4 / cam.z;
      ctx.stroke(strokes);
    }
    const da = clamp((cam.z * 60 - 1.5) / 1.5);
    if (da <= 0) {
      ctx.restore();
      return;
    }
    ctx.globalAlpha *= da;
    const dotFill = new Map();
    for (const [x, y, r, f] of D.dots) {
      if (!vis(x - r, y - r, r * 2, r * 2)) continue;
      let p = dotFill.get(f);
      if (!p) dotFill.set(f, (p = new Path2D()));
      p.moveTo(x + r, y);
      p.arc(x, y, r, 0, TAU);
    }
    for (const [f, p] of dotFill) {
      ctx.fillStyle = f;
      ctx.fill(p);
      if (cam.z > 0.1) {
        ctx.strokeStyle = lib.rgba(P.ink, 0.5);
        ctx.lineWidth = 1 / cam.z;
        ctx.stroke(p);
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Мир целиком под камерой
  // ---------------------------------------------------------------------------

  /** Растр улицы с мягкими краями: для вида издалека. */
  function feathered() {
    return G.cachedCanvas('surfaceFeather', (g) => {
      g.fillStyle = P.paper;
      g.fillRect(0, 0, 1920, 1080);
      G.drawSurface(g);
      // маска: единица внутри, к краям плавно в ноль; destination-in одним кадром
      const mask = FILM.makeCanvas(480, 270);
      const mg = mask.getContext('2d');
      mg.fillStyle = '#000';
      mg.fillRect(0, 0, 480, 270);
      mg.globalCompositeOperation = 'destination-out';
      const f = 26;
      const strip = (x0, y0, x1, y1, rx, ry, rw, rh) => {
        const gr = mg.createLinearGradient(x0, y0, x1, y1);
        gr.addColorStop(0, 'rgba(0,0,0,1)');
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        mg.fillStyle = gr;
        mg.fillRect(rx, ry, rw, rh);
      };
      strip(0, 0, f, 0, 0, 0, f, 270);
      strip(480, 0, 480 - f, 0, 480 - f, 0, f, 270);
      strip(0, 0, 0, f, 0, 0, 480, f);
      strip(0, 270, 0, 270 - f, 0, 270 - f, 480, f);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mask, 0, 0, 1920, 1080);
      g.globalCompositeOperation = 'source-over';
    });
  }

  /**
   * world(ctx, cam, o) : карта, квартал и улица под камерой, с переходами по масштабу.
   * o.t : время; o.dusk : вечер; o.team : картуш; o.street : рисовать ли улицу (по умолчанию да);
   * o.plan(ctx) : что нарисовать поверх улицы в её координатах (посадки и пометки).
   */
  G.world = (ctx, cam, o = {}) => {
    const m = cam.z * K;
    // карту не рисуем, когда квартал целиком закрывает кадр
    const vw = 960 / cam.z, vh = 540 / cam.z;
    const covered = m > 12 && cam.x - vw > DIST.x && cam.x + vw < DIST.x + DIST.w && cam.y - vh > DIST.y && cam.y + vh < DIST.y + DIST.h;
    const mapA = covered ? 0 : 1 - clamp((m - 14) / 26);
    if (mapA > 0) {
      // карта проявляется по мере подъёма камеры, а не включается разом
      ctx.save();
      ctx.globalAlpha *= mapA;
      G.drawMap(ctx, cam, o);
      ctx.restore();
    }
    const distA = clamp((m - 5) / 7) * (o.district === false ? 0 : 1);
    if (distA > 0 && cam.z < 1.6) {
      drawDistrict(ctx, cam, distA);
      // вечерняя накладка только на квартал: карта темнеет своей палитрой
      if (o.tint) {
        ctx.save();
        ctx.globalAlpha *= distA;
        G.applyCam(ctx, cam);
        ctx.fillStyle = lib.rgba('#2B2745', 0.62 * o.tint);
        ctx.fillRect(DIST.x, DIST.y, DIST.w, DIST.h);
        ctx.restore();
      }
    }
    const strA = clamp((cam.z - 1 / 45) / (1 / 45)) * (o.street === false ? 0 : 1);
    if (strA > 0) {
      ctx.save();
      ctx.globalAlpha *= strA;
      G.applyCam(ctx, cam);
      // издалека края улицы растворяются в квартале; у самого плана растр полный, переход плавный
      const full = clamp((cam.z - 0.86) / 0.12);
      if (full < 1) ctx.drawImage(feathered(), 0, 0, 1920, 1080);
      if (full > 0) {
        ctx.save();
        ctx.globalAlpha *= full;
        ctx.fillStyle = P.paper;
        ctx.fillRect(0, 0, 1920, 1080);
        G.cached(ctx, 'surface', (g) => G.drawSurface(g), { boil: cam.z < 1.15 });
        ctx.restore();
      }
      if (o.plan) o.plan(ctx);
      if (o.tint) {
        ctx.fillStyle = lib.rgba('#2B2745', 0.62 * o.tint);
        ctx.fillRect(-100, -100, 2120, 1280);
      }
      ctx.restore();
    }
  };

  // ---------------------------------------------------------------------------
  // Линейка глав: нить рассказа вверху кадра
  // ---------------------------------------------------------------------------

  G.CHAPTERS = ['чтение', 'нормы', 'размещение', 'виды', 'объяснение', 'качество', 'сверка'];
  G.chapters = (ctx, t, cur, o = {}) => {
    const blue = o.blue;
    const col = blue ? P.lavender : o.color || P.inkSoft;
    const hot = blue ? P.magenta : P.annMagenta;
    const x0 = 1040, x1 = 1860, y = 52;
    const n = G.CHAPTERS.length;
    const seg = (x1 - x0) / n;
    const a = (o.fadeIn ? G.seg(t, 0.1, 0.5, 'linear') : 1) * (o.alpha != null ? o.alpha : 1);
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.fillStyle = blue ? lib.rgba(P.navyLight, 0.9) : lib.rgba(P.paper, 0.92);
    ctx.fillRect(x0 - 30, y - 30, x1 - x0 + 60, 82);
    ctx.strokeStyle = lib.rgba(col, 0.5);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    for (let k = 0; k <= n; k++) {
      ctx.moveTo(x0 + k * seg, y - 6);
      ctx.lineTo(x0 + k * seg, y + 6);
    }
    ctx.stroke();
    // пройденное и текущая глава
    ctx.strokeStyle = hot;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + (cur + G.seg(t, 0.4, o.dur ? o.dur - 1 : 8, 'linear')) * seg, y);
    ctx.stroke();
    ctx.restore();
    G.CHAPTERS.forEach((s, k) => {
      G.text(ctx, s, x0 + k * seg + seg / 2, y + 28, {
        size: 15, weight: k === cur ? 700 : 500, family: G.MONO, color: k === cur ? (blue ? P.lineWhite : P.ink) : col,
        align: 'center', alpha: a * (k <= cur ? 1 : 0.55),
      });
    });
  };

  // ---------------------------------------------------------------------------
  // Лист отгибается от угла: под бумагой синька
  // ---------------------------------------------------------------------------

  function clipHalf(poly, px, py, nx, ny, keepPositive) {
    // Сазерленд-Ходжман по одной прямой: оставляем точки, где (p - P)·n >= 0 (или <= 0)
    const out = [];
    const side = (p) => ((p[0] - px) * nx + (p[1] - py) * ny) * (keepPositive ? 1 : -1);
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const sa = side(a), sb = side(b);
      if (sa >= 0) out.push(a);
      if (sa >= 0 !== sb >= 0) {
        const u = sa / (sa - sb);
        out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);
      }
    }
    return out;
  }

  /**
   * peel(ctx, q, under, over) : лист over отгибается от правого нижнего угла, открывая under.
   * q = 0 лист лежит, q = 1 лист убран целиком.
   */
  G.peel = (ctx, q, under, over) => {
    if (q <= 0.001) { over(ctx); return; }
    under(ctx);
    if (q >= 0.999) return;
    const d = [-0.84, -0.54]; // куда движется линия сгиба
    const L = 1920 * 0.84 + 1080 * 0.54 + 60;
    const e = E.inOutCubic(q);
    const fx = 1920 + d[0] * L * e, fy = 1080 + d[1] * L * e;
    const frame = [[0, 0], [1920, 0], [1920, 1080], [0, 1080]];
    const rest = clipHalf(frame, fx, fy, -d[0], -d[1], false); // сторона, где лист ещё лежит
    const lifted = clipHalf(frame, fx, fy, -d[0], -d[1], true);
    ctx.save();
    ctx.beginPath();
    lib.tracePath(ctx, rest, true);
    ctx.clip();
    over(ctx);
    ctx.restore();
    if (lifted.length < 3) return;
    // отражение поднятой части через линию сгиба: изнанка листа
    const refl = lifted.map(([x, y]) => {
      const s = (x - fx) * d[0] + (y - fy) * d[1];
      return [x - 2 * s * d[0], y - 2 * s * d[1]];
    });
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    lib.tracePath(ctx, refl.map(([x, y]) => [x + 14, y + 18]), true);
    ctx.fill();
    const gr = ctx.createLinearGradient(fx, fy, fx + d[0] * 300, fy + d[1] * 300);
    gr.addColorStop(0, '#D9C8A6');
    gr.addColorStop(0.35, '#F3E9D2');
    gr.addColorStop(1, '#E6D6B5');
    ctx.fillStyle = gr;
    ctx.beginPath();
    lib.tracePath(ctx, refl, true);
    ctx.fill();
    ctx.restore();
    lib.hatch(ctx, refl, { angle: Math.atan2(d[1], d[0]) + Math.PI / 2, spacing: 9, width: 1.2, color: P.inkSoft, alpha: 0.35, clip: true, density: (x, y) => 1 - clamp(((x - fx) * d[0] + (y - fy) * d[1]) / 120) });
    lib.inkPath(ctx, refl, { closed: true, width: 2.4, seed: 61, smooth: false, wobble: 0.6 });
  };

  // ---------------------------------------------------------------------------
  // Красный карандаш: обвод нарушения от руки
  // ---------------------------------------------------------------------------

  G.scribble = (ctx, x, y, r, q, seed, o = {}) => {
    if (q <= 0) return;
    const rr = lib.rng(seed);
    const turns = 1.25 + rr() * 0.3;
    const n = Math.max(2, Math.floor(60 * clamp(q)));
    const pts = [];
    const a0 = rr() * TAU;
    for (let i = 0; i <= n; i++) {
      const u = i / 60;
      const a = a0 + u * TAU * turns;
      const k = 1 + 0.12 * Math.sin(u * 9 + seed) + (u > 1 ? 0.08 : 0);
      pts.push([x + Math.cos(a) * r * k * 1.08, y + Math.sin(a) * r * k * 0.92]);
    }
    lib.inkPath(ctx, pts, { width: o.width || 3.2, color: o.color || '#C8322B', alpha: 0.88, seed, wobble: 2.2, tremble: 0.8, taper: [4, 18] });
  };
})();

// ---- scenes/00-shared.js
// 00 общее для сцен: опорные кадры камеры, жизнь на улице, план посадок в разных стилях
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const TAU = Math.PI * 2;

  // опорные кадры: конец одного слайда совпадает с началом следующего
  G.CAMS = {
    city: G.mapCam(1000, 560, 1),
    cityEnd: G.mapCam(1025, 572, 1.08),
    team: G.mapCam(1710, 925, 3.1),
    mark: G.mapCam(G.MB[0], G.MB[1], 2.4),
    street: { x: 960, y: 540, z: 1 },
    tree: (() => {
      // крупный план: дерево ложится туда, где на крупном плане стоит посадка №3
      const c = G.TREE3;
      const z = 3.6;
      return { x: c.x + 420 / z, y: c.y - 60 / z, z, c };
    })(),
    ui: { x: 1250, y: 560, z: 0.9 },
  };

  /** Машины по полосам и пешеходы по тротуарам, движение на «двойках». */
  G.traffic = (ctx, t, o = {}) => {
    const tt = lib.onTwos(t);
    const cars = [
      { lane: 520, v: 70, x0: -200, c: '#C88C86' },
      { lane: 520, v: 70, x0: 700, c: '#9CC2EA' },
      { lane: 640, v: -55, x0: 1500, c: '#EFDCA3' },
      { lane: 640, v: -55, x0: 400, c: '#FBF6EA' },
    ];
    for (const car of cars) {
      const span = 2400;
      const x = (((car.x0 + car.v * tt + 300) % span) + span) % span - 300;
      const y = car.lane;
      const pts = lib.rrectPts(x - 46, y - 20, 92, 40, 12, 12);
      lib.inkPath(ctx, pts, { closed: true, width: 2.6, fill: car.c, seed: car.x0 + 3, wobble: 0.6, boilAmp: 0.7 / Math.max(1, G.zoomNow || 1) });
      const dir = Math.sign(car.v);
      ctx.fillStyle = lib.rgba(P.ink, 0.55);
      ctx.fillRect(x + dir * 18 - 7, y - 14, 14, 28);
    }
    if (o.people === false) return;
    // пешеходы: головы сверху, тень от солнца
    const r = lib.rng('people');
    for (let k = 0; k < 14; k++) {
      const top = k % 2 === 0;
      const y = top ? 250 + r() * 90 : 800 + r() * 90;
      const v = (r() < 0.5 ? -1 : 1) * (18 + r() * 16);
      const x = ((((r() * 2000 + v * tt) % 2100) + 2100) % 2100) - 90;
      ctx.fillStyle = lib.rgba(P.ink, 0.16);
      ctx.beginPath();
      ctx.ellipse(x + 5, y + 6, 8, 5, 0.6, 0, TAU);
      ctx.fill();
      ctx.fillStyle = [P.rose, P.teal, P.ochre, P.dusk][k % 4];
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = P.ink;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  };

  /** Посадки плана поверх улицы. o.plain : без видов, o.trees / o.shrubs : доли появления. */
  G.plan = (ctx, o = {}) => {
    const tr = o.trees != null ? o.trees : 1;
    const sh = o.shrubs != null ? o.shrubs : 1;
    if (sh > 0) G.drawPlanShrubs(ctx, (k) => (typeof sh === 'function' ? sh(k) : sh));
    if (tr !== 0) G.drawPlanTrees(ctx, (k, c) => (typeof tr === 'function' ? tr(k, c) : tr), { plain: o.plain });
  };

  /** Улица линиями синьки: для вида издалека и для вариантов раскладки. */
  G.streetLines = (ctx, o = {}) => {
    G.drawSurfaceBlue(ctx, { alpha: o.alpha != null ? o.alpha : 0.7 });
  };

  /** Заголовок главы в углу: номер, название, одна строка. */
  G.chapterTitle = (ctx, t, num, title, o = {}) => {
    const blue = o.blue;
    const out = o.t1 != null ? 1 - G.seg(t, o.t1, 0.5, 'linear') : 1;
    if (out <= 0) return;
    ctx.save();
    ctx.globalAlpha *= out;
    const a = G.seg(t, o.t0 || 0.3, 0.4, 'linear');
    if (a > 0) {
      const w = G.measure(ctx, title, { size: 46, weight: 300 }) + 60;
      ctx.save();
      ctx.globalAlpha *= a;
      ctx.fillStyle = blue ? lib.rgba(P.navyLight, 0.92) : lib.rgba(P.paper, 0.93);
      ctx.fillRect(40, 26, w, 128);
      ctx.restore();
      lib.inkLine(ctx, 40, 154, 40 + w * a, 154, { width: 2.4, color: blue ? P.lavender : P.ink, seed: 12, alpha: a });
    }
    G.kicker(ctx, num, 70, 70, { color: blue ? P.lavender : P.inkSoft, p: G.seg(t, o.t0 || 0.3, 0.5, 'linear') });
    G.text(ctx, title, 66, 124, { size: 46, weight: 300, color: blue ? P.lineWhite : P.ink, p: G.seg(t, (o.t0 || 0.3) + 0.1, 0.9, 'linear') });
    ctx.restore();
  };

  /** Карточка-подпись с абзацем, появляется и уходит сама. */
  G.caption = (ctx, t, t0, t1, x, y, w, text, o = {}) => {
    const q = G.seg(t, t0, 0.4) * (t1 ? 1 - G.seg(t, t1, 0.3) : 1);
    if (q <= 0) return;
    const lines = G.lines(ctx, text, { size: o.size || 26, weight: 400, maxW: w - 72 });
    const lh = (o.size || 26) * 1.32;
    const h = lines.length * lh + (o.kick ? 88 : 56);
    G.card(ctx, x, y, w, h, { p: q, seed: o.seed || Math.round(x + y), blue: o.blue });
    let yy = y + 50;
    if (o.kick) {
      G.kicker(ctx, o.kick, x + 36, y + 46, { color: o.blue ? P.lavender : P.inkSoft, alpha: q });
      yy = y + 88;
    }
    G.para(ctx, text, x + 36, yy, { size: o.size || 26, weight: 400, maxW: w - 72, lh, color: o.blue ? P.lineWhite : P.ink, p: G.seg(t, t0 + 0.2, Math.max(1.2, lines.length * 0.6), 'linear'), alpha: q });
  };
})();

// 03 маршрут: 15 этапов змейкой, импульс проходит каждый узел; в конце узлы слетаются

(function () {

  const DUR = 18;

  // этап, подпись, глава рассказа (индекс в G.CHAPTERS)
  const STAGES = [
    ['Конвертация', 'DWG → DXF: ODA или LibreDWG', 0],
    ['Склейка комплекта', 'XREF между файлами', 0],
    ['Чтение', 'ремонт строк, блоки до 8 уровней', 0],
    ['Классификация', '76 правил слоёв, 37 классов', 0],
    ['Карта покрытий', 'грунт по замкнутым граням', 0],
    ['Кандидаты', 'аллея вдоль борта, сетка по газону', 2],
    ['Проверка норм', '46 отступов, допуск 1 мм', 1],
    ['Портфель', 'до 8 раскладок, лучший индекс', 5],
    ['Подбор видов', 'MILP, квоты 10-20-30', 3],
    ['Кустарники', 'группы 3 × 3 на местах, пустых по квотам', 3],
    ['Проверка плана', '13 кодов нарушений', 5],
    ['Индекс качества', '10 слагаемых, ценность посадки', 5],
    ['Объяснения', 'из трассы правил, без LLM', 4],
    ['Запись DXF', '9 слоёв GREEN_*', 6],
    ['Сверка', 'blake2b каждой исходной сущности', 6],
  ];
  const ROWS = [370, 610, 850];
  const XS = [250, 605, 960, 1315, 1670];
  const NODES = STAGES.map((s, i) => {
    const row = Math.floor(i / 5);
    const col = row % 2 === 0 ? i % 5 : 4 - (i % 5);
    return { x: XS[col], y: ROWS[row], name: s[0], cap: s[1], ch: s[2], row };
  });
  const T0 = 2.0, STEP = 0.6;
  const litAt = (i) => T0 + i * STEP;
  const COLLAPSE = [15.4, 1.8];
  // куда слетаются узлы: центр своей главы на линейке (координаты из G.chapters)
  const rulerX = (ch) => 1040 + ((1860 - 1040) / G.CHAPTERS.length) * (ch + 0.5);

  function pathPoint(u) {
    const n = NODES.length - 1;
    const f = clamp(u) * n;
    const i = Math.min(n - 1, Math.floor(f));
    const q = f - i;
    const a = NODES[i], b = NODES[i + 1];
    if (a.row === b.row) return [lib.lerp(a.x, b.x, q), a.y];
    const side = a.row % 2 === 0 ? 1 : -1;
    const cy = (a.y + b.y) / 2, r = (b.y - a.y) / 2;
    const ang = -Math.PI / 2 + q * Math.PI;
    return [a.x + side * Math.cos(ang) * r * 0.9, cy + Math.sin(ang) * r];
  }

  FILM.slide({
    id: 'pipeline',
    mode: 'blue',
    dur: DUR,
    tr: { kind: 'lens', dur: 1.5, x: 960, y: 540, ring: P.ink },
    draw(ctx, t) {
      lib.blueprint(ctx, { noise: 0, center: [960, 640] });
      const cq = G.seg(t, COLLAPSE[0], COLLAPSE[1], 'inOutCubic');
      const keep = 1 - G.seg(t, COLLAPSE[0], 0.6, 'linear');
      ctx.save();
      ctx.globalAlpha *= keep;
      G.kicker(ctx, 'МАРШРУТ ПРОГОНА', 120, 106, { color: P.lavender, p: G.seg(t, 0.2, 0.6, 'linear') });
      G.text(ctx, 'Пятнадцать этапов, один сценарий', 116, 170, { size: 60, weight: 300, color: P.lineWhite, p: G.seg(t, 0.3, 1.0, 'linear') });
      G.para(ctx, 'CLI, HTTP API и веб-интерфейс вызывают один и тот же сценарий PlanSite. Ядро без фреймворков, границы слоёв держит import-linter.', 120, 240, { size: 24, weight: 400, maxW: 1600, lh: 34, color: P.lavender, p: G.seg(t, 0.8, 1.6, 'linear') });
      for (let i = 0; i + 1 < NODES.length; i++) {
        const a = NODES[i], b = NODES[i + 1];
        const q = G.seg(t, 0.5 + i * 0.05, 0.6, 'outCubic');
        if (a.row === b.row) {
          G.link(ctx, a.x + 62 * Math.sign(b.x - a.x), a.y, b.x - 62 * Math.sign(b.x - a.x), b.y, { p: q, bend: 0, alpha: 0.5 });
        } else {
          const side = a.row % 2 === 0 ? 1 : -1;
          ctx.save();
          ctx.strokeStyle = lib.rgba(P.lavender, 0.5);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          const cy = (a.y + b.y) / 2, r = (b.y - a.y) / 2;
          ctx.ellipse(a.x, cy, r * 0.9, r, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * q * side, side < 0);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.restore();
      // узлы: на сворачивании летят к своей главе и превращаются в точки линейки
      NODES.forEach((n, i) => {
        const appear = G.seg(t, 0.4 + i * 0.06, 0.35, 'linear');
        const lit = G.seg(t, litAt(i), 0.3, 'outCubic');
        const c = clamp(cq * 1.3 - i * 0.02);
        const e = E.inOutCubic(c);
        const x = lib.lerp(n.x, rulerX(n.ch), e);
        const y = lib.lerp(n.y, 52, e);
        const r = lib.lerp(56, 5, e);
        if (c < 1) {
          G.node(ctx, x, y, r, { p: appear, lit: lit * (1 - c), litColor: i === NODES.length - 1 ? P.magenta : P.paleBlue });
          G.text(ctx, String(i + 1).padStart(2, '0'), x, y + 11 * (r / 56), { size: 30 * (r / 56), weight: 400, family: G.MONO, color: P.lineWhite, align: 'center', alpha: appear * (1 - c) });
        }
        const fl = (t - litAt(i)) / 0.5;
        if (fl > 0 && fl < 1) {
          lib.glowDot(ctx, n.x, n.y - 56, 6, { intensity: 1 - fl, rays: 8 });
          G.ring(ctx, n.x, n.y, 80, t, litAt(i), { color: P.paleBlue, dur: 0.5 });
        }
        const lq = G.seg(t, litAt(i) - 0.1, 0.6, 'linear') * keep;
        G.text(ctx, n.name, n.x, n.y + 96, { size: 25, weight: 500, color: P.lineWhite, align: 'center', p: lq });
        G.text(ctx, n.cap, n.x, n.y + 126, { size: 18, weight: 400, family: G.MONO, color: P.lavender, align: 'center', p: lq, alpha: 0.9 });
      });
      // импульс по змейке, потом бегущие точки
      const u = (t - T0) / (STEP * (NODES.length - 1));
      if (keep > 0) {
        if (u > 0 && u < 1) {
          const [px, py] = pathPoint(u);
          lib.glowDot(ctx, px, py, 7, { rays: 8, intensity: 1.1 });
        }
        if (u >= 1) {
          for (let k = 0; k < 3; k++) {
            const v = (((t - T0 - STEP * 14) / 7 + k / 3) % 1 + 1) % 1;
            const [px, py] = pathPoint(v);
            lib.glowDot(ctx, px, py, 4, { rays: 0, glow: 5, intensity: 0.7 * keep });
          }
        }
      }
      // линейка глав собирается из узлов
      G.chapters(ctx, t, 0, { blue: true, alpha: G.seg(t, COLLAPSE[0] + 0.8, 0.8, 'linear'), dur: 1e9 });
    },
  });
})();

// 03 чтение: камера спускается с карты в улицу, чертёж раскладывается на слои и собирается обратно
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;

  const DUR = 23, DIVE = 6.0, OPEN = [6.6, 8.2], CLOSE = [14.6, 15.8];
  const LAYERS = [
    ['nets', 'подземные сети', (g) => G.drawNetsBlue(g, { labels: false })],
    ['road', 'проезжая часть и борта', (g) => G.drawSurface(g, { part: 'road' })],
    ['lawns', 'газоны', (g) => G.drawSurface(g, { part: 'lawns' })],
    ['walks', 'тротуары и покрытия', (g) => G.drawSurface(g, { part: 'walks' })],
    ['buildings', 'здания', (g) => G.drawSurface(g, { part: 'buildings' })],
  ];

  // изометрия: поворот, сжатие по высоте, общий масштаб; слой i поднят над нижним
  const TH = -0.35, SQ = 0.5, KK = 0.48, CX = 1100, CY = 610, GAP = 118;
  function layerMatrix(q, i) {
    const c = Math.cos(TH), s = Math.sin(TH);
    const L = [KK * c, -KK * s, KK * SQ * s, KK * SQ * c];
    const A = [lib.lerp(1, L[0], q), lib.lerp(0, L[1], q), lib.lerp(0, L[2], q), lib.lerp(1, L[3], q)];
    const off = -(i - (LAYERS.length - 1) / 2) * GAP * q;
    const cx = lib.lerp(960, CX, q), cy = lib.lerp(540, CY, q);
    // x' = cx + A0 (x - 960) + A1 (y - 540); y' = cy + A2 (x - 960) + A3 (y - 540) + off
    return [A[0], A[2], A[1], A[3], cx - A[0] * 960 - A[1] * 540, cy - A[2] * 960 - A[3] * 540 + off];
  }
  const apply = (M, x, y) => [M[0] * x + M[2] * y + M[4], M[1] * x + M[3] * y + M[5]];

  function exploded(ctx, t, q) {
    const bob = Math.sin(t * 1.3);
    LAYERS.forEach(([key, name, fn], i) => {
      const M = layerMatrix(q, i);
      M[5] += bob * 6 * q * (i - 2);
      ctx.save();
      ctx.transform(...M);
      // лист слоя: полупрозрачная бумага с рамкой
      ctx.fillStyle = lib.rgba(P.paper, 0.72 * q);
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.drawImage(G.cachedCanvas('part-' + key, fn), 0, 0, 1920, 1080);
      ctx.strokeStyle = lib.rgba(P.ink, 0.8 * q);
      ctx.lineWidth = 3 / KK;
      ctx.strokeRect(0, 0, 1920, 1080);
      ctx.restore();
      // подпись слоя справа, с выноской
      const la = G.seg(t, OPEN[1] - 0.2 + i * 0.22, 0.4, 'linear') * (1 - G.seg(t, CLOSE[0] - 0.3, 0.3, 'linear'));
      if (la > 0) {
        const [ax, ay] = apply(M, 1920, 540);
        lib.inkPath(ctx, [[ax + 6, ay], [ax + 60, ay - 20]], { width: 1.8, color: P.annBlue, seed: i + 3, taper: 2, alpha: la });
        G.text(ctx, name, ax + 68, ay - 14, { size: 21, weight: 500, family: G.MONO, color: i === 0 ? P.annMagenta : P.ink, p: la });
      }
    });
  }

  function desk(ctx) {
    // стол под листами: миллиметровка
    ctx.fillStyle = '#EDE6D3';
    ctx.fillRect(0, 0, 1920, 1080);
    ctx.save();
    ctx.strokeStyle = lib.rgba(P.annBlue, 0.12);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= 1920; x += 24) { ctx.moveTo(x, 0); ctx.lineTo(x, 1080); }
    for (let y = 0; y <= 1080; y += 24) { ctx.moveTo(0, y); ctx.lineTo(1920, y); }
    ctx.stroke();
    ctx.strokeStyle = lib.rgba(P.annBlue, 0.22);
    ctx.beginPath();
    for (let x = 0; x <= 1920; x += 120) { ctx.moveTo(x, 0); ctx.lineTo(x, 1080); }
    for (let y = 0; y <= 1080; y += 120) { ctx.moveTo(0, y); ctx.lineTo(1920, y); }
    ctx.stroke();
    ctx.restore();
  }

  FILM.slide({
    id: 'drawing',
    mode: 'paper',
    dur: DUR,
    tr: { kind: 'lens', dur: 1.5, x: 960, y: 540, ring: P.lavender },
    draw(ctx, t) {
      const cam = G.camPath([[0, G.CAMS.mark], [0.6, G.CAMS.mark], [DIVE, G.CAMS.street, 'inOutSine']], t);
      const q = G.seg(t, OPEN[0], OPEN[1] - OPEN[0], 'inOutCubic') * (1 - G.seg(t, CLOSE[0], CLOSE[1] - CLOSE[0], 'inOutCubic'));
      // улица и разложенные листы сменяют друг друга растворением, без скачка
      const flat = 1 - lib.clamp(q / 0.18);
      if (flat < 1) {
        desk(ctx);
        exploded(ctx, t, q);
      }
      if (flat > 0) {
        ctx.save();
        ctx.globalAlpha *= flat;
        G.world(ctx, cam, { t: t + 23, team: 1 });
        if (cam.z > 0.2) {
          G.applyCam(ctx, cam);
          G.traffic(ctx, t);
        }
        ctx.restore();
      }
      G.chapters(ctx, t, 0, { dur: DUR });
      if (t < DIVE) return;
      G.chapterTitle(ctx, t, '01 · ЧТЕНИЕ', 'Чертёж раскладывается на слои', { t0: DIVE + 0.1, t1: DUR - 0.8 });
      G.caption(ctx, t, DIVE + 0.5, DUR - 0.9, 60, 170, 560, 'Берзарина: 206 860 объектов. Чтение с ремонтом строк LibreDWG заняло 55 с.', { seed: 3 });
      G.caption(ctx, t, 9.8, DUR - 0.9, 60, 400, 560, '76 правил layer_map.yaml раскладывают слои по 37 классам. Незнакомое имя слоя разбирается по словарю, а что не разобрано, остаётся на проверку.', { seed: 5 });
      G.caption(ctx, t, 16.2, DUR - 0.9, 60, 690, 560, 'Единицы берутся из . REGION без ACIS и XCLIP останавливают расчёт с причиной в input_read.json.', { seed: 7 });
    },
  });
})();

// 04 нормы: лист улицы отгибается, под ним синька с живыми сетями; каждая сеть обрастает полосой отступа
(function () {
  const FILM = window.FILM, lib = FILM.lib, P = lib.pal, G = FILM.G, C = G.C, E = lib.ease;
  const clamp = lib.clamp;
  const S = G.street;
  const M = G.M;
  const PEEL = [0.5, 2.6], DUR = 19;

  const YAML = [
    ['- rule_id: ', 'R-POWER-TREE-001'],
    ['  object_class: ', 'utility.power_cable'],
    ['  planting_type: ', 'tree'],
    ['  min_distance_m: ', '2.0'],
    ['  measure_to: ', 'outer_wall'],
    ['  citation:', ''],
    ['    act_id: ', 'SP42_13330_2016'],
    ['    clause: ', '"п. 9.6, табл. 9.1: подземные сети,'],
    ['            ', ' силовой кабель; прим. 5"'],
    ['    status: ', 'verified'],
  ];
  const TABLE = [
    ['стена здания', '5,0', '1,5'],
    ['силовой кабель, связь', '2,0', '0,7'],
    ['водопровод', '2,0', '-'],
    ['газ, канализация', '1,5', '-'],
    ['теплосеть', '2,0', '1,0'],
    ['опора освещения', '4,0', '-'],
  ];

  // длина ломаной и точка на ней по доле
  const pathLen = (pts) => pts.slice(1).reduce((a, p, i) => a + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
  function along(pts, u) {
    const L = pathLen(pts) * u;
    let acc = 0;
    for (let i = 0; i + 1 < pts.length; i++) {
      const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      if (acc + d >= L) {
        const q = (L - acc) / d;
        return [lib.lerp(pts[i][0], pts[i + 1][0], q), lib.lerp(pts[i][1], pts[i + 1][1], q)];
      }
      acc += d;
    }
    return pts[pts.length - 1];
  }

  // по сетям бежит то, что по ним течёт: вода, ток, газ, тепло
  function flow(ctx, t, q) {
    if (q <= 0) return;
    const speed = { power: 0.16, telecom: 0.22, water: 0.06, gas: 0.05, heat: 0.04, sewer: 0.03 };
    for (const n of S.nets) {
      const cnt = 9;
      for (let k = 0; k < cnt; k++) {
        const u = (((k / cnt + t * speed[n.key] * (n.key === 'heat' ? -1 : 1)) % 1) + 1) % 1;
        const [x, y] = along(n.pts, u);
        if (n.key === 'power' || n.key === 'telecom') lib.glowDot(ctx, x, y, 3.5, { color: n.color, rays: 4, glow: 5, intensity: q, seed: k });
        else {
          ctx.fillStyle = lib.rgba(n.color, 0.9 * q);
          ctx.beginPath();
          ctx.ellipse(x, y, 11, 3.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function band(ctx, pts, half, color, q) {
    if (q <= 0) return;
    const h = half * E.outCubic(q);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = lib.rgba(color, 0.18);
    ctx.lineWidth = h * 2;
    ctx.beginPath();
    lib.tracePath(ctx, pts, false);
    ctx.stroke();
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = lib.rgba(color, 0.8 * q);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      lib.tracePath(ctx, pts.map(([x, y]) => [x, y + s * h]), false);
      ctx.stroke();
    }
    ctx.restore();
  }

  function underground(ctx, t) {
    lib.blueprint(ctx, { noise: 0, seed: 11, center: [1300, 560] });
    // слои грунта: горизонтальные разрезы с редкой штриховкой
    ctx.save();
    ctx.strokeStyle = lib.rgba(P.lavender, 0.06);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 20; y < 1080; y += 14) {
      ctx.moveTo(0, y + 4 * Math.sin(y * 0.05));
      ctx.lineTo(1920, y + 4 * Math.sin(y * 0.05 + 2));
    }
    ctx.stroke();
    ctx.restore();
    G.drawSurfaceBlue(ctx, { alpha: 0.35 });
    // полосы отступов по очереди
    const T0 = 3.8;
    S.nets.forEach((n, i) => band(ctx, n.pts, G.RULES[n.key] * M + (n.channel || 0) / 2, n.color, G.seg(t, T0 + i * 0.45, 0.6)));
    const qp = G.seg(t, T0 + 2.8, 0.6);
    if (qp > 0) {
      for (const [x, y] of S.poles) {
        ctx.save();
        ctx.fillStyle = lib.rgba(P.lineWhite, 0.1);
        ctx.strokeStyle = lib.rgba(P.lineWhite, 0.7);
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, G.RULES.pole * M * E.outBack(qp), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }
    G.drawNetsBlue(ctx, { p: G.seg(t, 1.2, 1.6, 'inOutCubic'), labelX: 830 });
    flow(ctx, t, G.seg(t, 2.4, 0.8, 'linear'));
    const tags = [['2,0 м', 300, C.power, 0], ['2,0 м', 636, C.heat, 4], ['1,5 м', 560, C.sewer, 5], ['2,0 м', 846, C.water, 2]];
    for (const [s, y, col, i] of tags) {
      const q = G.seg(t, T0 + i * 0.45 + 0.4, 0.4, 'linear');
      if (q > 0) G.text(ctx, s, 1880, y - 10, { size: 20, weight: 600, family: G.MONO, color: col, align: 'right', alpha: q });
    }
    if (qp > 0.4) G.text(ctx, '4,0 м', 1690, 440, { size: 20, weight: 600, family: G.MONO, color: P.lineWhite, alpha: qp });
  }

  G.undergroundScene = underground;

  function card(ctx, t) {
    const cq = G.seg(t, 2.6, 0.5, 'linear') * (1 - G.seg(t, DUR - 0.9, 0.5, 'linear'));
    if (cq <= 0) return;
    ctx.save();
    ctx.globalAlpha *= cq;
    G.card(ctx, 40, 186, 740, 856, { blue: true, p: cq });
    YAML.forEach(([k, v], i) => {
      const q = G.seg(t, 3.0 + i * 0.22, 0.35, 'linear');
      if (q <= 0) return;
      const y = 240 + i * 28;
      G.text(ctx, k, 76, y, { size: 19, weight: 400, family: G.MONO, color: P.lavender, alpha: q });
      const w = G.measure(ctx, k, { size: 19, weight: 400, family: G.MONO });
      G.text(ctx, v, 76 + w, y, { size: 19, weight: 500, family: G.MONO, color: i === 3 ? P.magenta : P.lineWhite, p: q });
    });
    const ty = 560;
    const hq = G.seg(t, 5.6, 0.5, 'linear');
    G.text(ctx, 'объект', 76, ty, { size: 17, weight: 500, family: G.MONO, color: P.lavender, alpha: hq });
    G.text(ctx, 'дерево', 560, ty, { size: 17, weight: 500, family: G.MONO, color: P.lavender, alpha: hq, align: 'right' });
    G.text(ctx, 'кустарник', 740, ty, { size: 17, weight: 500, family: G.MONO, color: P.lavender, alpha: hq, align: 'right' });
    TABLE.forEach(([o, a, b], i) => {
      const q = G.seg(t, 5.8 + i * 0.32, 0.45, 'linear');
      if (q <= 0) return;
      const y = ty + 42 + i * 38;
      G.text(ctx, o, 76, y, { size: 22, weight: 400, color: P.lineWhite, p: q });
      G.text(ctx, a + ' м', 560, y, { size: 22, weight: 500, family: G.MONO, color: P.lineWhite, align: 'right', alpha: q });
      G.text(ctx, b === '-' ? '-' : b + ' м', 740, y, { size: 22, weight: 500, family: G.MONO, color: P.lavender, align: 'right', alpha: q });
    });
    G.para(ctx, '95 правил, из них 62 отступа. У 78 основание сверено по тексту акта, 15 - проектные параметры с пометкой в объяснении.', 76, 880, { size: 22, weight: 400, maxW: 670, lh: 30, color: P.lavender, p: G.seg(t, 8.4, 2.0, 'linear') });
    ctx.restore();
  }

  FILM.slide({
    id: 'underground',
    mode: 'blue',
    dur: DUR,
    tr: { kind: 'morph', dur: 0.4 },
    draw(ctx, t) {
      const q = G.seg(t, PEEL[0], PEEL[1] - PEEL[0], 'linear');
      G.peel(ctx, q, (c) => underground(c, t), (c) => {
