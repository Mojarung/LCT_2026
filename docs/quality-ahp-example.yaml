# Анкеты экспертов для весов индекса качества (docs/quality-weights.md).
#
# Суждение - число по шкале Саати: 1 - равная важность, 3 - умеренно важнее, 5 - заметно,
# 7 - сильно, 9 - абсолютно; 2, 4, 6, 8 - промежуточные. Если важнее второй элемент пары,
# пишется обратная величина: 1/3 = 0.333.
#
# groups:      [надёжность/функции, надёжность/состав, надёжность/объём,
#               функции/состав, функции/объём, состав/объём]
# reliability: [пригодность/категория, пригодность/запас, категория/запас]
# functions:   [тень/пылезащита, тень/ярусность, пылезащита/ярусность]
# composition: [разнообразие/ряды, разнообразие/сезонность, ряды/сезонность]
#
# Ниже - ЧЕРНОВИК КОМАНДЫ, а не суждение эксперта: он только показывает формат и даёт веса,
# близкие к нынешним весам по умолчанию. Члены команды экспертами не считаются
# (docs/plans/2026-09-22-quality-literature.md, п. 8.3).
experts:
  черновик-команды:
    groups: [1, 2, 2, 1, 2, 2]
    reliability: [2, 2, 1]
    functions: [1, 1, 1]
    composition: [2, 2, 1]
