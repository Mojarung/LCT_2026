  - {id: PP743-T361-N1, law: pp743, clause: "табл. 3.6.1, прим. 1",
     quote: "1. Приведенные нормативы относятся к деревьям с диаметром кроны не более 5 м и должны быть соответственно увеличены для деревьев большего диаметра."}
  - {id: PP743-T361-N3, law: pp743, clause: "табл. 3.6.1, прим. 3",
