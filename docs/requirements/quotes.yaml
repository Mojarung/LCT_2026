  # --- МГСН 1.02-02 (ТСН 30-307-2002), ред. с изм. от 24.05.2022 ---
  - {id: MGSN-4.2.4, law: mgsn, clause: "п. 4.2.4",
     quote: "При проектировании озеленения следует обеспечивать: минимальные расстояния посадок деревьев и кустарников до инженерных сетей, зданий и сооружений"}
  - {id: MGSN-4.2.8-ZONES, law: mgsn, clause: "п. 4.2.8",
     quote: "следует учитывать фактор прогревания почвы в обе стороны от оси теплотрассы на расстояние: интенсивного прогревания - до 2 м, среднего - 2-6 м, слабого - 6-10 м."}
  - {id: MGSN-4.2.8-GENERA, law: mgsn, clause: "п. 4.2.8",
     quote: "У теплотрасс не следует размещать: липу, клен, сирень, жимолость - ближе 2 м, тополь, боярышник, кизильник, дерен, лиственницу, березу - ближе 3-4 м."}
  - {id: MGSN-4.2.9.2, law: mgsn, clause: "п. 4.2.9.2",
     quote: "обеспечивая в ряду расстояния между стволами взрослых деревьев 8-10 м (с широкой кроной), 5-6 м (со средней кроной), 3-4 м (с узкой кроной)"}
