     quote: "Позиционные обозначения элементов озеленения на плане указывают в окружностях диаметром 8-12 мм в виде дроби, в числителе которой приводят порядковый номер породы или вида насаждения, а в знаменателе - количество или площадь (для цветников)"}
  - {id: GOST-10.8, law: gost21508, clause: "п. 10.8", quote: "- ведомость элементов озеленения по"}

