  # --- СП 42.13330.2016 (с Изм. N 1-4) ---
  - {id: SP42-9.6, law: sp42, clause: "п. 9.6",
     quote: "9.6 Расстояние от зданий и сооружений, а также объектов инженерного благоустройства до деревьев и кустарников принимают в соответствии с"}
  - {id: SP42-T91-BLD, law: sp42, clause: "табл. 9.1", quote: "Наружная стена здания и сооружения 5,0 1,5"}
  - {id: SP42-T91-TRAM, law: sp42, clause: "табл. 9.1", quote: "Край трамвайного полотна 5,0 3,0"}
  - {id: SP42-T91-SWALK, law: sp42, clause: "табл. 9.1", quote: "Край тротуара и садовой дорожки 0,7 0,5"}
  - {id: SP42-T91-ROAD, law: sp42, clause: "табл. 9.1",
     quote: "Край проезжей части улиц, обочины дороги или бровка канавы, или кювета 2,0 1,0"}
  - {id: SP42-T91-POLE, law: sp42, clause: "табл. 9.1",
     quote: "Мачта и опора осветительной сети, трамвая, мостовая опора и эстакада 4,0 -"}
  - {id: SP42-T91-SLOPE, law: sp42, clause: "табл. 9.1", quote: "Подошва откоса, террасы и др. 1,0 0,5"}
  - {id: SP42-T91-RETAIN, law: sp42, clause: "табл. 9.1",
     quote: "Подошва или внутренняя грань подпорной стенки 3,0 1,0"}
  - {id: SP42-T91-GAS, law: sp42, clause: "табл. 9.1", quote: "- газопровод, канализация 1,5 -"}
  - {id: SP42-T91-HEAT, law: sp42, clause: "табл. 9.1",
     quote: "- тепловая сеть (стенка канала, тоннеля или оболочка при бесканальной прокладке) 2,0 1,0"}
  - {id: SP42-T91-WATER, law: sp42, clause: "табл. 9.1", quote: "- водопровод, дренаж 2,0 -"}
  - {id: SP42-T91-POWER, law: sp42, clause: "табл. 9.1", quote: "- силовой кабель и кабель связи 2,0 0,7"}
  - {id: SP42-T91-LKS, law: sp42, clause: "табл. 9.1", quote: "- ЛКС ТМК 1,0 0,5"}
  - {id: SP42-T91-N1, law: sp42, clause: "табл. 9.1, прим. 1",
     quote: "1 Приведенные нормы относятся к деревьям с диаметром кроны не более 5 м и должны быть увеличены для деревьев с кроной большего диаметра."}
  - {id: SP42-T91-N2, law: sp42, clause: "табл. 9.1, прим. 2",
     quote: "2 Расстояния от воздушных линий электропередачи (ВЛ) до деревьев следует принимать по"}
  - {id: SP42-T91-N3, law: sp42, clause: "табл. 9.1, прим. 3",
     quote: "3 Деревья, высаживаемые у зданий, не должны препятствовать инсоляции и освещенности жилых и общественных помещений"}
  - {id: SP42-T91-N4, law: sp42, clause: "табл. 9.1, прим. 4",
     quote: "4 Расстояние от инженерных сетей, а также отступ от бордюра, примыкающего к проезжей части улиц и дорог до кадки с растениями или защитных прикорневых барьеров, следует принимать не менее 500 мм."}
  - {id: SP42-T91-N5, law: sp42, clause: "табл. 9.1, прим. 5",
     quote: "5 При устройстве защитных прикорневых барьеров (не более чем с двух сторон от ствола) в зависимости от высоты кроны деревьев их высадка может проводиться на расстоянии от инженерных сетей и бордюров улиц и дорог, м, не менее: 0,5 - для деревьев с высотой кроны менее 5 м; 1 - для деревьев с высотой кроны от 5 до 20 м."}
  - {id: SP42-T91-N5-MEASURE, law: sp42, clause: "табл. 9.1, прим. 5",
     quote: "Расстояние от инженерных сетей до дерева (кустарника) измеряется как расстояние между наружными поверхностями их стволов и трубы инженерной сети (либо защитного футляра (обоймы))."}
  - {id: SP42-T91-N7, law: sp42, clause: "табл. 9.1, прим. 7",
     quote: "7 При посадке деревьев вдоль тротуаров, улиц и дорог, обочин, канав, откосов, террас, подпорных стенок и т.п. допускается уменьшение расстояния до ствола деревьев при условии разработки мероприятий"}
  - {id: SP42-11.16, law: sp42, clause: "п. 11.16",
     quote: "В пределах треугольников видимости не допускается размещение зданий, сооружений, передвижных предметов (киосков, фургонов, реклам, малых архитектурных форм и др.), деревьев и кустарников высотой более 0,5 м."}
  - {id: SP42-11.27, law: sp42, clause: "п. 11.27",
     quote: "Вдоль линий метрополитена мелкого заложения следует предусматривать техническую зону, в которой до окончания строительства метрополитена запрещаются посадка деревьев"}

  # --- 743-ПП (ред. от 10.06.2026, действует с 01.07.2026) ---
  - {id: PP743-3.6.1, law: pp743, clause: "п. 3.6.1",
     quote: "Посадки деревьев и кустарников на территории города Москвы должны осуществляться только при наличии заключения о соответствии проектной документации требованиям, установленным в нормативных правовых актах в области защиты зеленых насаждений"}
