  # --- СП 82.13330.2016 (с Изм. N 1-3) ---
  - {id: SP82-9.6, law: sp82, clause: "п. 9.6",
     quote: "Размер ям для посадки саженцев с комом должен быть на 0,5 м больше наибольшего размера кома."}
  - {id: SP82-9.7, law: sp82, clause: "п. 9.7",
     quote: "Ширина траншей под групповые посадки кустарников должна быть 50 см для однорядной посадки с добавлением 20 см на каждый следующий ряд посадки."}
  - {id: SP82-9.22-POPLAR, law: sp82, clause: "п. 9.22",
     quote: "9.22 Посадка в населенных местах женских экземпляров тополей и шелковиц, засоряющих территорию и воздух во время плодоношения, не допускается."}
  - {id: SP82-9.22-TOXIC, law: sp82, clause: "п. 9.22",
     quote: "вдоль пешеходных улиц, тротуаров, площадей, а также на площадках различного функционального назначения следует исключать посадку токсичных и аллергенных пород деревьев и кустарников."}
  - {id: SP82-9.22-THORNY, law: sp82, clause: "п. 9.22",
     quote: "Размещение колючих растений (например, кустарников розы, барбариса, боярышника) для ландшафтных композиций допускается на расстоянии не менее 2 м от площадок и пешеходных коммуникаций."}
  - {id: SP82-9.22-NEGUNDO, law: sp82, clause: "п. 9.22", quote: "Посадка клена ясенелистного не допускается."}
  - {id: SP82-9.22-PLAYGROUND, law: sp82, clause: "п. 9.22",
     quote: "Для озеленения детских игровых и спортивных площадок не допускается использовать колючие и обильно плодоносящие деревья и кустарники."}
  - {id: SP82-9.29, law: sp82, clause: "п. 9.29",
     quote: "Расстояние от поверхности дорожки до низа кроны деревьев должно быть не менее 2,1 м."}
  - {id: SP82-9.30, law: sp82, clause: "п. 9.30",
     quote: "с посадками отдельных деревьев (отстоящих от стен домов не менее чем на 5 м)"}
  - {id: SP82-9.40, law: sp82, clause: "п. 9.40",
     quote: "За пределами треугольников видимости следует использовать кустарники высотой до 1 м, деревья, высота кроны которых не ниже 2 м."}
  - {id: SP82-9.41, law: sp82, clause: "п. 9.41",
     quote: "Для взаимной защиты зданий и сооружений и зеленых насаждений применяют прикорневые барьеры"}

  # --- СП 59.13330.2020 (с Изм. N 1-3) ---
  - {id: SP59-5.1.7, law: sp59, clause: "п. 5.1.7",
     quote: "5.1.7 Ширину прохожей части пешеходного пути для МГН следует принимать не менее 2 м. Высота свободного пространства над прохожей частью должна составлять не менее 2,1 м."}
  - {id: SP59-5.1.7-TIGHT, law: sp59, clause: "п. 5.1.7",
     quote: "В стесненных условиях допускается принимать ширину прохожей части пешеходного пути не менее 1,2 м"}
  - {id: SP59-5.1.10, law: sp59, clause: "п. 5.1.10",
     quote: "для обозначения стволов деревьев, расположенных на прохожей части пешеходного пути, допускается применять приствольные решетки"}
  - {id: SP59-5.1.18, law: sp59, clause: "п. 5.1.18",
     quote: "Ширина просветов ячеек решеток не должна превышать 13 мм. Диаметр круглых ячеек в решетках не должен превышать 18 мм."}

