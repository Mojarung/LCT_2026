services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: green:latest
    ports:
      - "8000:8000"
    environment:
      GREEN_MAX_PARALLEL_RUNS: "2"
      GREEN_CORS_ORIGINS: '["http://localhost:5173"]'
      # Каталог улиц пилотного проекта внутри смонтированного датасета. Датасета может не
      # быть - тогда список улиц пуст, а форма принимает свой чертёж, как и раньше.
      GREEN_STREETS_DIR: /dataset/streets_oda
      # Стенд по ТЗ - 10-20 ГБ SSD, прогон тяжёлой улицы - до нескольких ГБ: перед новым
      # прогоном самые старые законченные удаляются, пока том прогонов больше предела.
      GREEN_RUNS_MAX_GB: "8"
      # Подсказки локальной LLM по именам слоёв на странице уточнения (только совет, план от
      # них не зависит). Пусто - выключено. Своя Ollama в compose: GREEN_LLM_URL=
      # http://ollama:11434 и `docker compose --profile llm up -d`; Ollama на этой машине:
      # GREEN_LLM_URL=http://host.docker.internal:11434 (в .env рядом с compose.yaml).
      GREEN_LLM_URL: ${GREEN_LLM_URL:-}
      GREEN_LLM_MODEL: ${GREEN_LLM_MODEL:-gemma4:e4b-it-qat}
      # Предел на все подсказки прогона, секунды: что не успели спросить - без подсказки.
      GREEN_LLM_TIMEOUT_S: ${GREEN_LLM_TIMEOUT_S:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runs:/data/runs
      - ./dataset:/dataset:ro
    restart: unless-stopped

  # Локальная LLM для подсказок (профиль llm, по умолчанию не поднимается). Образ 3,8 ГБ и модель
  # 6,1 ГБ на диске, 3,3 ГБ памяти. Считает процессор (подсказки для десятков имён - минуты,
  # прогон ждёт их не дольше GREEN_LLM_TIMEOUT_S); видеокарта NVIDIA - с compose.gpu.yaml.
  ollama:
    image: ollama/ollama:0.40.5
    profiles: [llm]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Однократная загрузка модели в том ollama: интернет нужен только при первом запуске.
  ollama-pull:
    image: ollama/ollama:0.40.5
    profiles: [llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${GREEN_LLM_MODEL:-gemma4:e4b-it-qat}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  runs:
  ollama:
