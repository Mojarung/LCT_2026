<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>green - проектирование озеленения улиц</title>
    <meta
      name="description"
      content="Автопроектирование озеленения улиц по чертежу подосновы: план посадок на отдельных слоях с объяснением каждого решения по пунктам нормативных актов."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Цвет строки браузера = фон страницы (--ground в tokens.css). -->
    <meta name="theme-color" content="#efe6d2" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script>
      // Тему выбираем до первой отрисовки, иначе страница мигает бумагой перед тёмной.
      try {
        const saved = localStorage.getItem('green-theme');
        if (saved) {
          document.documentElement.dataset.theme = saved;
          const ground = saved === 'dark' ? '#0e1013' : '#efe6d2';
          for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
            meta.content = ground;
        }
      } catch {
        /* приватный режим: остаёмся на бумаге */
      }
      // Стиль карты - тоже до отрисовки: инженерный чертёж по умолчанию, иллюстрация по кнопке
      // (src/map/style.ts, ключ green-map-style).
      try {
        const style = localStorage.getItem('green-map-style');
        document.documentElement.dataset.mapStyle =
          style === 'illustrated' ? 'illustrated' : 'engineering';
      } catch {
        document.documentElement.dataset.mapStyle = 'engineering';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
