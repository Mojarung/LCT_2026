description: Проверка входа. Неизвестные обозначения требуют уточнения; грунт оценивается отдельно.
infer_unknown: false
planting_type: tree
species_code: tilia_cordata
spacing_m: 5.0  # 743-ПП, п. 3.6.4, табл. 3.6.2: однорядная 5-6 м, групповая 5-7 м; нижняя граница (docs/notes/30)
# Сначала 3 м от борта: перед деревом встаёт изгородь в 1 м от борта; уже полоса - 2,5 и 2 м.
curb_offsets_m: [3.0, 2.5, 2.0]
require_utility_data: true
unknown_lines_as_utility: true
allow_needs_approval: true
# Подбор ассортимента: вид выбирается сервисом после размещения (docs/species.md).
assortment_mode: auto
region_hardiness_zone: 4  # Москва 4b-5a
salt_zone_m: 5.0
max_height_under_lines_m: 4.0
crown_extra_per_m: 0.5  # прим. 1 к табл. 9.1: величину акт не задаёт, прирост радиуса кроны - толкование проекта
# 743-ПП п. 3.6.18 видов не называет, МГСН табл. В.6 и 515-ПП берёзу рекомендуют: решает акт,
# называющий вид (notes/16, шаг 1.4). false - запрет массовых аллергенов выше, берёзы в плане нет.
allergen_act_priority: true
territory: green_fund  # 369-ПП: иная территория зелёного фонда, виды группы III с условием
# Доли пород - по практике 18 принятых проектов пилота (docs/notes/34): доля главной породы
# в проектах от 19 до 73%, медиана 40%; правило 10-20-30 (Santamour 1990) не соблюдено ни в
# одном. Квоты мягкие: место, прошедшее нормы, занимается (премия 10 за место), перебор доли -
# штраф quota_penalty за растение в подборе и в индексе качества.
quota_species: 0.40
quota_genus: 0.50
quota_family: 0.70
quota_penalty: 5.0
conifer_share: [0.0, 0.50]  # хвойных в проектах от 0 до 50%, медиана около 20%
structure_patch_size: 10
# Вопрос 8 сессии с заказчиком 17.09.2026: охранные зоны поверх нормативных отступов не
# применяются. Охранная зона газопровода (ПП РФ N 878, п. 7, 8, 16; текст сверен 27.09.2026)
# отключена; отступ от газопровода по табл. 9.1 СП 42 (R-GAS-TREE-001, 1,5 м) действует.
# Включить зону: параметр {"disabled_rules": []} - посадки в 2 м от оси (по яме) требуют
# письменного разрешения эксплуатационной организации.
disabled_rules: [R-GASZONE-TREE-001, R-GASZONE-SHRUB-001]
lawns: true  # п. 3 ТЗ: газоны на грунте, который посадки оставили свободным (application/lawns.py)
