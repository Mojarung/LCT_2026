description: Рядовая посадка кустарника вдоль борта.
planting_type: shrub
species_code: syringa_meyeri
spacing_m: 1.0  # 743-ПП, п. 3.6.4, табл. 3.6.2: однорядная посадка высоких кустарников 0,5-1 м
curb_offsets_m: [1.0, 1.5, 2.0]
# Добор зоны (fill) для кустарника не нужен: сетка газона с шагом 1 м и так проверяет каждую ячейку.
modes: [alley, lawn]
require_utility_data: true
unknown_lines_as_utility: true
allow_needs_approval: true
# Кустарники подбираются из жизненных форм shrub_*; слой кустарников отдельным приёмом
# пока не строится, поэтому квоты мягче, а доля хвойных не задаётся.
assortment_mode: auto
region_hardiness_zone: 4
salt_zone_m: 5.0
max_height_under_lines_m: 4.0
crown_extra_per_m: 0.5
territory: green_fund
# Кустарники в проектах пилота: главный вид 27-61% штук, медиана около 35-40% (docs/notes/34).
# Квоты мягкие: место занимается, перебор доли - штраф quota_penalty.
quota_species: 0.40
quota_genus: 0.50
quota_family: 0.70
quota_penalty: 5.0
conifer_share: [0.0, 0.30]
structure_patch_size: 8
# Вопрос 8 сессии с заказчиком 17.09.2026: охранные зоны поверх нормативных отступов не
# применяются. Охранная зона газопровода (ПП РФ N 878, текст не сверен) отключена; отступ
# от газопровода по табл. 9.1 СП 42 (R-GAS-TREE-001, 1,5 м) действует.
disabled_rules: [R-GASZONE-TREE-001]
