description: Чертёж без подземных сетей (например, выгрузка АСУ ОДХ). Посадки ставятся, но помечаются «требует согласования».
planting_type: tree
species_code: tilia_cordata
spacing_m: 5.0  # 743-ПП, п. 3.6.4, табл. 3.6.2: однорядная 5-6 м, групповая 5-7 м; нижняя граница (docs/notes/30)
# Сначала 3 м от борта: перед деревом встаёт изгородь в 1 м от борта; уже полоса - 2,5 и 2 м.
curb_offsets_m: [3.0, 2.5, 2.0]
require_utility_data: false
unknown_lines_as_utility: true
allow_needs_approval: true
# Подбор ассортимента: тот же, что в строгом профиле; сетей в чертеже нет, поэтому
# видозависимые отступы до них не проверяются и в объяснении этого не скрывают.
assortment_mode: auto
region_hardiness_zone: 4
salt_zone_m: 5.0
max_height_under_lines_m: 4.0
crown_extra_per_m: 0.5
territory: green_fund
# Доли пород - по практике 18 принятых проектов пилота (docs/notes/34): доля главной породы
# в проектах от 19 до 73%, медиана 40%; правило 10-20-30 (Santamour 1990) не соблюдено ни в
# одном. Квоты мягкие: место, прошедшее нормы, занимается (премия 10 за место), перебор доли -
# штраф quota_penalty за растение в подборе и в индексе качества.
quota_species: 0.40
quota_genus: 0.50
quota_family: 0.70
quota_penalty: 5.0
conifer_share: [0.0, 0.50]  # хвойных в проектах от 0 до 50%, медиана около 20%
structure_patch_size: 10
# Вопрос 8 сессии с заказчиком 17.09.2026: охранные зоны поверх нормативных отступов не
# применяются. Охранная зона газопровода (ПП РФ N 878, текст не сверен) отключена; отступ
# от газопровода по табл. 9.1 СП 42 (R-GAS-TREE-001, 1,5 м) действует.
disabled_rules: [R-GASZONE-TREE-001]
