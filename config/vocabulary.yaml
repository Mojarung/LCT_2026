# Словарь слов в именах слоёв и блоков: класс незнакомого объекта нового чертежа.
#
# Решение пользователя 25.09.2026 (задача 14 плана): незнакомое не останавливает прогон, а
# заменяется самым правдоподобным; газон нового формата всегда газон. Словарь работает после
# config/symbols.yaml и config/layer_map.yaml, когда их правила молчат или спорят; основание
# каждого вывода видно в отчёте классификации (inferred_name:<слово>).
#
# Имя нормализуется: строчные буквы, ё -> е, «а.б» -> «аб», разделители -> пробел; у слова
# из букв и цифр («бр100», «в1») проверяется и буквенная часть. Слово словаря длиной до трёх
# букв сравнивается целиком, длиннее - как начало слова. phrases ищутся целиком в имени,
# patterns - регулярные выражения по нормализованному имени.
#
# Проектная грамматика (стадия «по проекту», вопрос 2 пользователя): новое - до разделителя.
# «Газон за счёт АБ ТР», «ПЧ за газон», «Уширение на месте газона», пара заливок «ГЗН-АБ ТР»
# (проверено подписями съёмки внутри заливок Олимпийской деревни и Багрицкого: «А» внутри
# «ГЗН-АБ ТР», «ГАЗОН» внутри «АБ ТР-ГЗН (2 и более метров)»).
version: 1
separators: ["за счет", "на месте", "вместо", "за", "на"]
# Отрицание перед словом снимает его: «без газона», «не газон».
negations: ["не", "без", "нет"]
# Снимаемое проектом (демонтаж, снос) в расчёт не идёт: на его месте будет то, что нарисовано
# другими слоями.
removal: ["демонтаж", "демонт", "дем", "снос", "сносим", "удален", "удаляем", "ликвид", "уничтож",
          "разборк", "разбор", "вырубк", "вырубаем", "demolition", "demolish", "remove", "removed"]
# Посадки проектировщика - его ответ, а не препятствие: наш план их заменяет. Дерево без
# пометки или с пометкой «сущ»/«сохранить» - существующее (дерево на дерево не встанет).
proposed: ["проект", "проектир", "посадк", "новы", "нова", "ново", "новог", "гп", "пр", "proposed",
           "new", "planned"]
existing: ["сущ", "существ", "сохран", "existing"]
# Оформление: объект такого слоя - надпись, линия листа или вспомогательная линия.
annotation:
  words: ["текст", "подпис", "надпис", "размер", "выноск", "офр", "оформлен", "рамк", "штамп",
          "пикет", "piket", "pikets", "text", "dim", "dims", "dimension", "legend", "легенд",
          "условн", "обознач", "непечат", "вспомог", "рабоч", "пометк", "вопрос", "defpoints",
          "interpolation", "interpolations", "ось", "осев", "освещенност", "xref", "pdf",
          "отметк", "горизонтал", "уклон", "стрелк", "номер", "лист", "листы", "viewport",
          "note", "notes", "anno", "annotation", "разметк", "координат", "сетк", "крест",
          "спутник", "растр", "карта", "подложк", "фото", "схема", "title", "border"]
  phrases: ["не печат"]
# Слабый намёк: решает, только если других слов нет.
# Материал без назначения («аб», «асфальт») - тротуар: край проезжей части даёт 2 м через борт.
weak:
  контр: contour
  контур: contour
  граница: contour
  границы: contour
  акр: ignore
  эн: utility.power_cable
  иот: utility.power_cable
  аб: sidewalk
  асфальт: sidewalk
  покрыти: sidewalk
  щ: sidewalk
classes:
  # rank: point - объект в точке; line - сеть, борт, ограда; object - сооружение, препятствие;
  # surface - покрытие; boundary - граница работ. Сильнее тот ранг, что раньше в этом списке;
  # внутри ранга решает первое слово, а среди покрытий - последнее («hatch road sidewalk» -
  # тротуар, «hatch road grass» - газон), и неизвестная сеть уступает известной.
  existing_tree:
    rank: point
    words: ["дерев", "tree", "trees", "ствол", "липа", "липы", "клен", "берез", "дуб", "ясен", "тополь",
            "тополя", "ель", "ели", "елк", "сосн", "рябин", "яблон", "груш", "вяз", "каштан",
            "лиственниц", "туя", "туи", "черемух", "ольх", "осин", "ива", "ивы", "платан",
            "акаци", "орех"]
  existing_shrub:
    rank: point
    words: ["кустар", "куст", "кусты", "shrub", "shrubs", "bush", "изгород", "спире", "сирен",
            "кизильник", "дерен", "пузыреплод", "барбарис", "шиповник", "самшит"]
  utility.access:
    rank: point
    words: ["колодец", "колодц", "люк", "люки", "решетк", "дождеприем", "manhole"]
  pole:
    rank: point
    words: ["опор", "столб", "мачт", "светильн", "фонар", "торшер", "флагшт", "флаг",
            "светофор", "стойк", "pole", "poles", "mast", "lamp"]
  power_line_overhead:
    rank: line
    words: ["вл", "вли", "лэп", "сип", "воздушн", "overhead"]
  utility.power_cable:
    rank: line
    words: ["кабел", "кл", "ркл", "эс", "электр", "силов", "заземл", "зеземл", "cable", "cables",
            "power", "electric"]
  utility.telecom:
    rank: line
    words: ["связ", "телеф", "мгтс", "слаботоч", "вок", "спайк", "оптик", "сс", "telecom",
            "fiber", "fibre"]
  utility.water:
    rank: line
    words: ["водопровод", "водовод", "в1", "water"]
  utility.sewer:
    rank: line
    words: ["канализ", "фекал", "к1", "sewer", "sewage"]
  utility.storm:
    rank: line
    words: ["водосто", "ливнев", "дождев", "водоотвод", "лотк", "лоток", "к2", "storm"]
  utility.drain:
    rank: line
    words: ["дренаж", "drain", "drainage"]
  utility.heat:
    rank: line
    words: ["теплосет", "теплотрасс", "тепловод", "тс", "heat", "heating"]
  utility.gas:
    rank: line
    words: ["газопровод", "газ", "г1", "gas"]
  utility.unknown:
    rank: line
    words: ["труб", "коммуникац", "футляр", "гнб", "коллектор", "pipe", "pipes", "utility",
            "utilities", "сети", "сеть"]
  curb:
    rank: line
    words: ["борт", "бордюр", "бр", "бк", "kerb", "curb"]
    patterns: ["^_?гп ?\\d"]
  fence:
    rank: line
    words: ["огражд", "ограда", "ограды", "забор", "ограничивающ", "удерживающ", "fence",
            "barrier"]
  building:
    rank: object
    words: ["здани", "строени", "дом", "building", "wall"]
  structure:
    rank: object
    words: ["сооруж", "стел", "павильон", "остановк", "киоск", "лестниц", "ступен", "подпорн",
            "стенк", "пандус", "мост", "эстакад", "тоннел", "шахт", "воздуховод", "платформ",
            "stair", "stairs", "bridge"]
    phrases: ["retaining wall"]
  obstacle:
    rank: object
    words: ["маф", "мафы", "урна", "урны", "скамь", "скамейк", "лавк", "лавоч", "контейнер", "тбо", "велопарк",
            "вазон", "полусфер", "столбик", "фонтан", "памятник", "скульптур", "bench",
            "benches", "bin", "bollard", "fountain"]
  lawn:
    rank: surface
    words: ["газон", "гзн", "лужайк", "луг", "травян", "трава", "цветник", "lawn", "grass",
            "turf"]
  sidewalk:
    rank: surface
    words: ["тротуар", "трот", "тр", "пешеход", "дорожк", "плитк", "плитн", "мощен", "брусчат",
            "площадк", "детск", "спорт", "гравий", "щебен", "щебн", "sidewalk", "footway",
            "footpath", "path", "paving"]
    phrases: ["crushed stone"]
  road:
    rank: surface
    words: ["проезж", "пч", "дорог", "дорожн", "автодорог", "уширен", "обочин", "кромк",
            "парковк", "стоянк", "въезд", "заезд", "щма", "мз", "road", "roads", "carriageway",
            "parking"]
  work_boundary:
    rank: boundary
    phrases: ["граница работ", "границы работ", "граница благоустр", "границы благоустр",
              "граница проектир", "граница участк", "граница заказа", "work boundary"]
