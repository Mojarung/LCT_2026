# Словарь условных знаков подосновы: код блока Мосгеотреста -> класс объекта и роль знака.
#
# Код - базовое имя блока (base_name): локальное имя без префикса внешней ссылки и без номеров
# экземпляра (DEREVO_935, AFIS_1_2 -> DEREVO, AFIS). Знак решает раньше слоя: слой говорит,
# в какой группе объектов знак нарисован, знак - что это за объект.
#
# role:
#   point      - объект в точке вставки (дерево, куст, колодец, опора); штрихи знака - рисунок,
#                сами объектами не являются
#   marker     - знак материала области (газон, лесной массив): отметка внутри контура,
#                не объект в точке
#   geometry   - штрихи знака сами контур объекта
#   annotation - оформление (стрелка, скобка, пикет, крест сетки): в расчёт не идёт
#
# confirmed: true - значение знака подтверждено рисунком из переписи 25.09.2026 и слоем, на
# котором знак стоит; false - требует подтверждения (вопрос в note).
# source: УЗ 1:500 - «Условные знаки для топографических планов масштабов 1:5000-1:500».
