# Ассортимент: один вид (или сорт) - одна запись. Описание полей и шкал - docs/species.md.
#
# Семейства по APG IV (липа - Malvaceae, клён - Sapindaceae), а не по традиции русских
# справочников (Tiliaceae, Aceraceae): семейство участвует в квоте разнообразия 10-20-30,
# где важна общая уязвимость к вредителю, а не удобство названия.
# genus - латинский род в нижнем регистре, обязан совпадать с первым словом name_lat.
# crown_diameter_m - крона через 10 лет для условного знака; crown_mature_m - взрослая крона,
# по ней считается увеличение отступов (прим. к табл. 9.1 СП 42.13330.2016).
# hardiness_zone - минимальная зона USDA, которую вид переносит; Москва 4 (4b-5a),
# поэтому вид с зоной 5 по умолчанию отсеивается, хотя в паспортах пилота такие есть.
# pilot_streets / pilot_count - в скольких паспортах пилота встречается род и сколько штук
# по ведомостям; единицы в паспортах не унифицированы, величина справочная (tools/build_species_catalog.py).
# status: verified - сверено с актом, reference - справочник, pilot - паспорта пилота, draft.
# sources: имя поля -> источник значения; обязательны hardiness_zone и salt_tolerance.
# Справочник по умолчанию: Колесников А.И. Декоративная дендрология. М.: Лесная пром-сть, 1974.
