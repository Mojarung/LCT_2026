  # Охранная зона газораспределительной сети (ПП РФ N 878, текст сверен 27.09.2026 по ГАРАНТ):
  # 2 м от оси (п. 7 «а», п. 8). Посадка в зоне не запрещена, но яма нарушает почву глубже
  # 0,3 м - это письменное разрешение эксплуатационной организации (п. 16): вердикт «требует
  # согласования». Мерится яма, а не ствол: порог - 2 м плюс радиус посадочного места
  # (planting_radius_m 1,24 м дерева, shrub_planting_radius_m 0,5 м куста; тест
  # test_gas_zone_rules). Заказчик (вопрос 8, notes/15): охранные зоны поверх нормативных
  # отступов не применять - в профилях правило отключено, включается {"disabled_rules": []}.
  - rule_id: R-GASZONE-TREE-001
    object_class: utility.gas
    planting_type: tree
    min_distance_m: 3.24
    measure_to: axis
    severity: needs_approval
    citation:
      act_id: PPRF878
      clause: "Правила, п. 7 «а», п. 8, п. 16: охранная зона 2 м от оси газопровода; яма глубже 0,3 м - по письменному разрешению эксплуатационной организации (2 м + радиус ямы дерева 1,24 м)"
      quote: "7. Для газораспределительных сетей устанавливаются следующие охранные зоны: а) вдоль трасс наружных газопроводов - в виде территории, ограниченной условными линиями, проходящими на расстоянии 2 метров с каждой стороны газопровода; ... 16. Хозяйственная деятельность в охранных зонах газораспределительных сетей, не предусмотренная пунктами 14 и 15 настоящих Правил, при которой производится нарушение поверхности земельного участка и обработка почвы на глубину более 0,3 метра, осуществляется на основании письменного разрешения эксплуатационной организации газораспределительных сетей."
      status: verified
      related:
        - {act_id: PPRF878, clause: "п. 8: отсчёт расстояний от оси газопровода"}
        - {act_id: PPRF878, clause: "п. 7 «б»: полиэтиленовый газопровод с медным проводом - 3 м со стороны провода; материал трубы в чертеже не подписан, взята зона 2 м"}
        - {act_id: SP42_13330_2016, clause: "табл. 9.1: газопровод - 1,5 м до ствола дерева (запрет, R-GAS-TREE-001)"}
