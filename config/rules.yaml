  # МГСН 1.02-02 п. 4.2.8: у теплотрасс отступ зависит от породы. «3-4 м» принято по верхней границе.
  - rule_id: R-HEAT-TREE-002
    object_class: utility.heat
    planting_type: tree
    min_distance_m: 2.0
    measure_to: axis
    genera: [Tilia, Acer]
    citation:
      act_id: PP623
      clause: "МГСН 1.02-02, п. 4.2.8: липа, клён у теплотрасс не ближе 2 м"
      quote: "У теплотрасс не следует размещать: липу, клен, сирень, жимолость - ближе 2 м, тополь, боярышник, кизильник, дерен, лиственницу, березу - ближе 3-4 м."
      status: verified
  - rule_id: R-HEAT-TREE-003
