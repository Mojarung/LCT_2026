      quote: "10. В пределах охранных зон без письменного решения о согласовании сетевых организаций юридическим и физическим лицам запрещаются: ... в) посадка и вырубка деревьев и кустарников. Приложение, а): до 1 кВ - 2 м; 1 - 20 кВ - 10 м (5 - для линий с самонесущими или изолированными проводами, размещенных в границах населенных пунктов)."
