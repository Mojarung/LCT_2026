# Газоны плана (ТЗ, п. 3: рекомендовать травянистые покрытия). Газон - грунт карты покрытий в
# границе работ без посадочных мест деревьев и кустарников плана и без существующих массивов
# (application/lawns.py). Требования к газонам из актов заказчика не выписывались: поиск
# 17.09.2026 шёл по словам «дерев», «кустарник», «посад», «озелен», «насажден»
# (docs/requirements/planting-requirements.md), и сверенной цитаты о том, где газон сохранять,
# восстанавливать или устраивать, нет. Поэтому основания kept и new - параметры проекта со
# статусом «не сверено». Обозначение газона на плане - ГОСТ 21.508-2020, п. 10.4 (цитата
# GOST-10.4 в docs/requirements/quotes.yaml сверена по тексту из папки заказчика). Правило без
# kind относится к любому участку газона.
lawn_rules:
  - rule_id: R-LAWN-KEPT-001
    kind: kept
    citation:
      act_id: PROJECT
      clause: "сохраняемый или восстанавливаемый газон: грунт, где газон есть по чертежу (контур слоя газона, знак газона, подпись «ГАЗОН»), без посадочных мест деревьев и кустарников плана и существующих массивов; участок меньше порога площади профиля (lawn_min_area_m2) не выделяется"
      status: unverified
  - rule_id: R-LAWN-NEW-001
    kind: new
    citation:
      act_id: PROJECT
      clause: "устраиваемый газон: грунт в границе работ без газона и цветника по чертежу, без посадочных мест деревьев и кустарников плана и существующих массивов; участок меньше порога площади профиля (lawn_min_area_m2) не выделяется"
      status: unverified
  - rule_id: R-LAWN-DRAW-001
    citation:
      act_id: GOST_21_508_2020
      clause: "п. 10.4: газоны наносят на план условными графическими обозначениями"
      quote: "10.4 Деревья, кустарники, цветники, газоны наносят условными графическими обозначениями по"
      status: verified
