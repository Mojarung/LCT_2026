  # Охранная зона ВЛ (ТЗ: «охранные зоны ЛЭП»). Класс напряжения в чертеже не подписан: взята зона
  # для ВЛ до 1 кВ. Посадка в зоне требует письменного согласования сетевой организации, а не запрещена.
  # Охранные зоны из слоёв ГИС (config/geo_layers.yaml): полигон зоны задан данными, поэтому
  # мерится до самой зоны. Посадочная яма (дерево r = 1,24 м, куст 0,5 м) не должна заходить в
  # зону без письменного согласования: вердикт «требует согласования». Слой подаётся явно,
  # поэтому правила действуют и при ответе заказчика про охранные зоны сетей (вопрос 8).
  - rule_id: R-OHLZONE-TREE-001
    object_class: zone.power_line
    planting_type: tree
    min_distance_m: 1.24
    measure_to: edge
    severity: needs_approval
    citation:
      act_id: PPRF160
      clause: "Правила, п. 10 «в»: посадка деревьев в охранной зоне ВЛ - по письменному решению сетевой организации (зона - из слоя ГИС; яма дерева r = 1,24 м не заходит в зону)"
      quote: "10. В пределах охранных зон без письменного решения о согласовании сетевых организаций юридическим и физическим лицам запрещаются: ... в) посадка и вырубка деревьев и кустарников."
      status: verified
