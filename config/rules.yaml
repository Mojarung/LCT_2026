      clause: "п. 9.6, табл. 9.1: край проезжей части улиц"
      quote: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы | 2,0 | 1,0"
      status: verified
      related:
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
        - {act_id: SP42_13330_2026, clause: "п. 6.4.8, табл. 6.3: край проезжей части улиц, обочины дороги или бровка канавы, или кювета - 2,0 / 1,0 м (формулировка строки уточнена, значения те же)"}
  - rule_id: R-ROAD-SHRUB-001
