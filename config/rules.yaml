  # СП 82.13330.2016 п. 9.22: колючие растения не ближе 2 м от площадок и пешеходных путей. Правило
  # видозависимое (traits): применяется, когда вид выбран и у него в каталоге thorny: true.
  - rule_id: R-THORNSW-TREE-001
    object_class: sidewalk
    planting_type: tree
    min_distance_m: 2.0
    measure_to: edge
    traits: [thorny]
    citation:
      act_id: SP82_13330_2016
      clause: "п. 9.22: колючие растения не ближе 2 м от площадок и пешеходных коммуникаций (тротуар)"
      quote: "Размещение колючих растений (например, кустарников розы, барбариса, боярышника) для ландшафтных композиций допускается на расстоянии не менее 2 м от площадок и пешеходных коммуникаций."
      status: verified
  - rule_id: R-THORNSW-SHRUB-001
    object_class: sidewalk
    planting_type: shrub
    min_distance_m: 2.0
    measure_to: edge
    traits: [thorny]
    citation:
