    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край тротуара и садовой дорожки (граница покрытия топоплана)"
      quote: "Край тротуара и садовой дорожки | 0,7 | 0,5"
      status: verified
      related: *table_trees

  # Опоры и сооружения.
  - rule_id: R-POLE-TREE-001
    object_class: pole
    planting_type: tree
    min_distance_m: 4.0
    measure_to: axis
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: мачта и опора осветительной сети, трамвая, мостовая опора и эстакада"
      quote: "Мачта и опора осветительной сети, трамвая, мостовая опора и эстакада | 4,0 | -"
      status: verified
      related: *table_trees
  # Класс structure: парапеты, лестницы набережных, мосты, подземные переходы. Приняты как подпорные стенки.
  - rule_id: R-STRUCT-TREE-001
