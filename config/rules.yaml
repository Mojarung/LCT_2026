      quote: "- газопровод, канализация | 1,5 | -. Прим. 5: Расстояние от инженерных сетей до дерева (кустарника) измеряется как расстояние между наружными поверхностями их стволов и трубы инженерной сети (либо защитного футляра (обоймы))."
