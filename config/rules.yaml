      status: verified
      related:
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1: ось трамвайных путей, 5,0 / 3,0"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
