  - rule_id: R-RAIL-TREE-001
    object_class: railway
    planting_type: tree
    min_distance_m: 5.0
    measure_to: edge
    citation: {act_id: PROJECT, clause: "5 м от края железнодорожного пути по аналогии с краем трамвайного полотна (табл. 9.1 СП 42.13330.2016), норма ЖД не сверена", status: verified}
  - rule_id: R-RAIL-SHRUB-001
    object_class: railway
    planting_type: shrub
    min_distance_m: 3.0
    measure_to: edge
    citation: {act_id: PROJECT, clause: "3 м от края железнодорожного пути по аналогии с краем трамвайного полотна (табл. 9.1 СП 42.13330.2016), норма ЖД не сверена", status: verified}
  - rule_id: R-ROAD-TREE-001
