  # Существующие деревья: ориентировочный шаг посадки 743-ПП, принят нижний предел.
  - rule_id: R-EXTREE-TREE-001
    object_class: existing_tree
    planting_type: tree
    min_distance_m: 5.0
    measure_to: axis
    citation:
      act_id: PP743
      clause: "п. 3.6.4, табл. 3.6.2: расстояние между деревьями при однорядной посадке 5-6 м (принят нижний предел)"
      quote: "С однорядной посадкой деревьев | 5-6; С двухрядной посадкой деревьев | 7-8; С групповой посадкой: деревьев | 5-7"
      status: verified

  # Охранная зона ВЛ (ТЗ: «охранные зоны ЛЭП»). Класс напряжения в чертеже не подписан: взята зона
