# 369-ПП, приложение 2: где высадка вида группы запрещена, а где допускается с условием.
# Территория вне conditional_on считается запрещённой: п. 2.4 запрещает высадку в городе.
invasive_groups:
  - rule_id: R-INVGROUP-ONE-001
    group: 1
    citation:
      act_id: PP369_2026
      clause: "приложение 2, п. 3.1 и п. 2.4: группа I, запрет высадки"
      quote: "3.1. Применяются меры, предусмотренные пунктами 2.1, 2.3 - 2.6 настоящего Порядка. ... 2.4. Запрет высадки инвазивных растений на территории города Москвы."
      status: verified
  - rule_id: R-INVGROUP-TWO-001
    group: 2
    citation:
      act_id: PP369_2026
      clause: "приложение 2, п. 4.1 и п. 2.4: группа II, запрет высадки"
      quote: "4.1. Применяются меры, предусмотренные пунктом 2 настоящего Порядка. ... 2.4. Запрет высадки инвазивных растений на территории города Москвы."
      status: verified
  - rule_id: R-INVGROUP-THREE-001
    group: 3
    conditional_on: [green_fund]
    condition: "меры по недопущению распространения вида на территории иных правообладателей (369-ПП, прил. 2, п. 5.3), удаление самосева и поросли (п. 5.6)"
    citation:
      act_id: PP369_2026
      clause: "приложение 2, пп. 5.1-5.3: группа III, запрет на особо охраняемых зелёных и природных территориях, допуск с условием на иных территориях зелёного фонда"
      quote: "5.1. Применяются меры, предусмотренные пунктом 2 настоящего Порядка, если иное не предусмотрено настоящим пунктом. 5.2. Не допускаются высадка инвазивных растений на особо охраняемых зеленых территориях, природных территориях... 5.3. На иных территориях зеленого фонда города Москвы допускаются высадка и произрастание инвазивных растений группы III... при условии принятия правообладателем земельного участка (балансодержателем территории и (или) зеленых насаждений), обладателем публичного сервитута мер по недопущению распространения указанных инвазивных растений группы III на территориях иных правообладателей (балансодержателей)."
      status: verified
  - rule_id: R-INVGROUP-FOUR-001
    group: 4
    citation:
      act_id: PP369_2026
      clause: "приложение 2, п. 6.1 и п. 2.4: группа IV, запрет высадки"
      quote: "6.1. Применяются меры, предусмотренные пунктами 2.3, 2.4, 2.6 настоящего Порядка. ... 2.4. Запрет высадки инвазивных растений на территории города Москвы."
      status: verified

# 743-ПП п. 3.6.18. Пункт не перечисляет виды: отнесение вида к пуховым, засоряющим или
# массовым аллергенам хранится в config/species.yaml с источником (поля fluff, planting_sex,
# fruit_litter, allergen: 2) и печатается в объяснении рядом с нормой.
species_restrictions:
  - rule_id: R-PPSEVEN-FLUFF-001
    kind: female_fluff
    citation:
      act_id: PP743
      clause: "п. 3.6.18: женские экземпляры тополей и других растений"
      quote: &pp743_3618 "3.6.18. Посадка в городе женских экземпляров тополей и других растений, засоряющих территорию во время плодоношения или вызывающих массовые аллергические реакции во время цветения, не допускается."
      status: verified
  - rule_id: R-PPSEVEN-LITTER-001
    kind: fruit_litter
