      quote: "У теплотрасс не следует размещать: липу, клен, сирень, жимолость - ближе 2 м, тополь, боярышник, кизильник, дерен, лиственницу, березу - ближе 3-4 м."
      status: verified
  - rule_id: R-HEAT-SHRUB-003
    object_class: utility.heat
    planting_type: shrub
    min_distance_m: 4.0
