    planting_type: shrub
    min_distance_m: 0.5
    measure_to: edge
    severity: needs_approval
    citation:
      act_id: PPRF160
      clause: "Правила, п. 10 «в»: посадка кустарников в охранной зоне ВЛ - по письменному решению сетевой организации (зона - из слоя ГИС; яма куста r = 0,5 м не заходит в зону)"
      quote: "10. В пределах охранных зон без письменного решения о согласовании сетевых организаций юридическим и физическим лицам запрещаются: ... в) посадка и вырубка деревьев и кустарников."
      status: verified
  - rule_id: R-GASAREA-TREE-001
    object_class: zone.gas
    planting_type: tree
    min_distance_m: 1.24
    measure_to: edge
    severity: needs_approval
    citation:
      act_id: PPRF878
      clause: "Правила, п. 16: яма глубже 0,3 м в охранной зоне газопровода - по письменному разрешению эксплуатационной организации (зона - из слоя ГИС; яма дерева r = 1,24 м)"
      quote: "16. Хозяйственная деятельность в охранных зонах газораспределительных сетей, не предусмотренная пунктами 14 и 15 настоящих Правил, при которой производится нарушение поверхности земельного участка и обработка почвы на глубину более 0,3 метра, осуществляется на основании письменного разрешения эксплуатационной организации газораспределительных сетей."
      status: verified
  - rule_id: R-GASAREA-SHRUB-001
    object_class: zone.gas
