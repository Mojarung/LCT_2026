# Правила размещения. rule_id стабилен, пункт и цитата меняются при смене редакции.
# Основная ссылка на СП 42.13330.2016 (п. 9.6, табл. 9.1), как требует ТЗ. Те же значения дают
# 743-ПП (п. 3.6.3, табл. 3.6.1) и МГСН 1.01-99 (табл. 7.6), на которую отсылает 623-ПП (п. 4.2.4):
# они указаны в related, чтобы объяснение ссылалось на все три акта ТЗ.
# Расстояние до сетей по примечанию 5 к табл. 9.1 мерится между наружными поверхностями ствола
# и трубы: measure_to outer_wall вычитает половину диаметра сети, если он подписан в чертеже.
version: 2
distance_rules:
  # Здания и сооружения.
  - rule_id: R-BLD-TREE-001
    object_class: building
    planting_type: tree
    min_distance_m: 5.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: наружная стена здания и сооружения"
      quote: "Наружная стена здания и сооружения | 5,0 | 1,5"
      status: verified
      related:
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
        - {act_id: SP42_13330_2026, clause: "п. 6.4.8, табл. 6.3: наружная стена здания и сооружения - 5,0 / 1,5 м, как в ред. 2016"}
  - rule_id: R-BLD-SHRUB-001
    object_class: building
    planting_type: shrub
    min_distance_m: 1.5
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: наружная стена здания и сооружения"
      quote: "Наружная стена здания и сооружения | 5,0 | 1,5"
      status: verified
      related:
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
        - {act_id: SP42_13330_2026, clause: "п. 6.4.8, табл. 6.3: наружная стена здания и сооружения - 5,0 / 1,5 м, как в ред. 2016"}
  # 743-ПП, табл. 3.6.1, прим. 3: широкая крона у здания. Правило видозависимое: применяется,
  # когда вид выбран и его взрослая крона шире 5 м (прим. 1: нормы таблицы даны для кроны до 5 м).
  # Жилое здание или нет, топоплан не различает, поэтому норма применяется ко всем зданиям.
  - rule_id: R-BLDCROWN-TREE-001
    object_class: building
    planting_type: tree
    min_distance_m: 10.0
    measure_to: edge
    min_crown_m: 5.0
    citation:
      act_id: PP743
      clause: "п. 3.6.3, табл. 3.6.1, прим. 3: деревья с широкой кроной у зданий"
      quote: "3. Деревья с широкой кроной (липа, клен, дуб, каштан, тополь и др.), затеняющие жилые помещения, должны сажаться не ближе 10 м от здания (Методические указания по осуществлению государственного санитарного надзора за устройством и содержанием зданий, утвержденные 24.02.1981 N 2295-81)."
      status: verified

  # Улица: трамвай, проезжая часть, борт, тротуар.
