  # Fail-closed: сеть неизвестного типа получает наибольший отступ из правил для сетей.
  - rule_id: R-UTILUNK-TREE-001
    object_class: utility.unknown
    planting_type: tree
    min_distance_m: 2.0
    measure_to: outer_wall
    citation: {act_id: PROJECT, clause: "fail-closed: максимум из отступов до подземных сетей по табл. 9.1 СП 42.13330.2016", status: verified}
  - rule_id: R-UTILUNK-SHRUB-001
    object_class: utility.unknown
    planting_type: shrub
    min_distance_m: 1.0
    measure_to: outer_wall
    citation: {act_id: PROJECT, clause: "fail-closed: максимум из отступов до подземных сетей по табл. 9.1 СП 42.13330.2016", status: verified}
  # Колодец - единственный признак сети в чертежах без линий сетей (выгрузка АСУ ОДХ).
  - rule_id: R-ACCESS-TREE-001
    object_class: utility.access
    planting_type: tree
    min_distance_m: 2.0
    measure_to: axis
    citation: {act_id: PROJECT, clause: "смотровой колодец как признак подземной сети, отступ как до водопровода", status: verified}

  # Существующие деревья: ориентировочный шаг посадки 743-ПП, принят нижний предел.
  - rule_id: R-EXTREE-TREE-001
    object_class: existing_tree
    planting_type: tree
    min_distance_m: 5.0
    measure_to: axis
    citation:
      act_id: PP743
      clause: "п. 3.6.4, табл. 3.6.2: расстояние между деревьями при однорядной посадке 5-6 м (принят нижний предел)"
      quote: "С однорядной посадкой деревьев | 5-6; С двухрядной посадкой деревьев | 7-8; С групповой посадкой: деревьев | 5-7"
      status: verified

  # Охранная зона ВЛ (ТЗ: «охранные зоны ЛЭП»). Класс напряжения в чертеже не подписан: взята зона
  # для ВЛ до 1 кВ. Посадка в зоне требует письменного согласования сетевой организации, а не запрещена.
  - rule_id: R-OHL-TREE-001
    object_class: power_line_overhead
    planting_type: tree
    min_distance_m: 2.0
    measure_to: axis
    severity: needs_approval
    citation:
      act_id: PPRF160
      clause: "Правила, п. 10 «в»; приложение, п. «а»: охранная зона ВЛ до 1 кВ - 2 м"
      quote: "10. В пределах охранных зон без письменного решения о согласовании сетевых организаций юридическим и физическим лицам запрещаются: ... в) посадка и вырубка деревьев и кустарников. Приложение, а): до 1 кВ - 2 м; 1 - 20 кВ - 10 м (5 - для линий с самонесущими или изолированными проводами, размещенных в границах населенных пунктов)."
      status: verified
      related:
        - {act_id: SP42_13330_2016, clause: "табл. 9.1, прим. 2: расстояния от ВЛ до деревьев по [10]"}
  - rule_id: R-OHL-SHRUB-001
    object_class: power_line_overhead
    planting_type: shrub
    min_distance_m: 2.0
    measure_to: axis
    severity: needs_approval
    citation:
      act_id: PPRF160
      clause: "Правила, п. 10 «в»; приложение, п. «а»: охранная зона ВЛ до 1 кВ - 2 м"
      quote: "10. В пределах охранных зон без письменного решения о согласовании сетевых организаций юридическим и физическим лицам запрещаются: ... в) посадка и вырубка деревьев и кустарников."
      status: verified

