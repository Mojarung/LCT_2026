      quote: "Подошва или внутренняя грань подпорной стенки | 3,0 | 1,0"
      status: verified
      related: *table_trees

  # Подземные сети (табл. 9.1, раздел «Подземные сети»; для кустарника «-» означает, что нормы нет).
  - rule_id: R-GAS-TREE-001
    object_class: utility.gas
    planting_type: tree
    min_distance_m: 1.5
    measure_to: outer_wall
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: подземные сети, газопровод; прим. 5"
      quote: "- газопровод, канализация | 1,5 | -. Прим. 5: Расстояние от инженерных сетей до дерева (кустарника) измеряется как расстояние между наружными поверхностями их стволов и трубы инженерной сети (либо защитного футляра (обоймы))."
      status: verified
      related: *table_trees
  - rule_id: R-GASZONE-TREE-001
