    min_distance_m: 0.7
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край тротуара и садовой дорожки"
      quote: "Край тротуара и садовой дорожки | 0,7 | 0,5"
      status: verified
      related: *table_trees
  - rule_id: R-SWALK-SHRUB-001
    object_class: sidewalk
