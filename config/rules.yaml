# Правила размещения. rule_id стабилен, пункт и цитата меняются при смене редакции.
# Основная ссылка на СП 42.13330.2016 (п. 9.6, табл. 9.1), как требует ТЗ. Те же значения дают
# 743-ПП (п. 3.6.3, табл. 3.6.1) и МГСН 1.01-99 (табл. 7.6), на которую отсылает 623-ПП (п. 4.2.4):
# они указаны в related, чтобы объяснение ссылалось на все три акта ТЗ.
# Расстояние до сетей по примечанию 5 к табл. 9.1 мерится между наружными поверхностями ствола
# и трубы: measure_to outer_wall вычитает половину диаметра сети, если он подписан в чертеже.
version: 2
distance_rules:
  # Здания и сооружения.
  - rule_id: R-BLD-TREE-001
    object_class: building
    planting_type: tree
    min_distance_m: 5.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: наружная стена здания и сооружения"
      quote: "Наружная стена здания и сооружения | 5,0 | 1,5"
      status: verified
      related: &table_trees
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
  - rule_id: R-BLD-SHRUB-001
    object_class: building
    planting_type: shrub
    min_distance_m: 1.5
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: наружная стена здания и сооружения"
      quote: "Наружная стена здания и сооружения | 5,0 | 1,5"
      status: verified
      related: *table_trees
  # 743-ПП, табл. 3.6.1, прим. 3: широкая крона у здания. Правило видозависимое: применяется,
  # когда вид выбран и его взрослая крона шире 5 м (прим. 1: нормы таблицы даны для кроны до 5 м).
  # Жилое здание или нет, топоплан не различает, поэтому норма применяется ко всем зданиям.
  - rule_id: R-BLDCROWN-TREE-001
    object_class: building
    planting_type: tree
    min_distance_m: 10.0
    measure_to: edge
    min_crown_m: 5.0
    citation:
      act_id: PP743
      clause: "п. 3.6.3, табл. 3.6.1, прим. 3: деревья с широкой кроной у зданий"
      quote: "3. Деревья с широкой кроной (липа, клен, дуб, каштан, тополь и др.), затеняющие жилые помещения, должны сажаться не ближе 10 м от здания (Методические указания по осуществлению государственного санитарного надзора за устройством и содержанием зданий, утвержденные 24.02.1981 N 2295-81)."
      status: verified

  # Улица: трамвай, проезжая часть, борт, тротуар.
  - rule_id: R-TRAM-TREE-001
    object_class: tram
    planting_type: tree
    min_distance_m: 5.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край трамвайного полотна"
      quote: "Край трамвайного полотна | 5,0 | 3,0"
      status: verified
      related: &table_tram
        - {act_id: PP743, clause: "п. 3.6.3, табл. 3.6.1: ось трамвайных путей, 5,0 / 3,0"}
        - {act_id: PP623, clause: "п. 4.2.4 (табл. 7.6 МГСН 1.01-99)"}
  - rule_id: R-TRAM-SHRUB-001
    object_class: tram
    planting_type: shrub
    min_distance_m: 3.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край трамвайного полотна"
      quote: "Край трамвайного полотна | 5,0 | 3,0"
      status: verified
      related: *table_tram
  # Железные дороги есть в топопланах Геотреста (Берзарина, 48 объектов). Строки для ЖД в табл. 9.1
  # нет: проектный отступ по аналогии с краем трамвайного полотна, до сверки норм ЖД.
  - rule_id: R-RAIL-TREE-001
    object_class: railway
    planting_type: tree
    min_distance_m: 5.0
    measure_to: edge
    citation: {act_id: PROJECT, clause: "5 м от края железнодорожного пути по аналогии с краем трамвайного полотна (табл. 9.1 СП 42.13330.2016), норма ЖД не сверена", status: verified}
  - rule_id: R-RAIL-SHRUB-001
    object_class: railway
    planting_type: shrub
    min_distance_m: 3.0
    measure_to: edge
    citation: {act_id: PROJECT, clause: "3 м от края железнодорожного пути по аналогии с краем трамвайного полотна (табл. 9.1 СП 42.13330.2016), норма ЖД не сверена", status: verified}
  - rule_id: R-ROAD-TREE-001
    object_class: road
    planting_type: tree
    min_distance_m: 2.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край проезжей части улиц"
      quote: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы | 2,0 | 1,0"
      status: verified
      related: *table_trees
  - rule_id: R-ROAD-SHRUB-001
    object_class: road
    planting_type: shrub
    min_distance_m: 1.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край проезжей части улиц"
      quote: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы | 2,0 | 1,0"
      status: verified
      related: *table_trees
  # Бортовой камень в топоплане разделяет и проезжую часть с тротуаром, и тротуар с газоном.
  # Сторона не известна, поэтому борт принят как край проезжей части (больший отступ).
  - rule_id: R-CURB-TREE-001
    object_class: curb
    planting_type: tree
    min_distance_m: 2.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край проезжей части улиц (бортовой камень принят как край проезжей части)"
      quote: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы | 2,0 | 1,0"
      status: verified
      related: *table_trees
  - rule_id: R-CURB-SHRUB-001
    object_class: curb
    planting_type: shrub
    min_distance_m: 1.0
    measure_to: edge
    citation:
      act_id: SP42_13330_2016
      clause: "п. 9.6, табл. 9.1: край проезжей части улиц (бортовой камень принят как край проезжей части)"
      quote: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы | 2,0 | 1,0"
      status: verified
      related: *table_trees
  - rule_id: R-SWALK-TREE-001
    object_class: sidewalk
    planting_type: tree
