# Дополнительные слои ГИС: GeoJSON (.geojson, .json) и SHP (.zip с .shp, .shx, .dbf, .prj).
# ТЗ, п. 1: на входе - данные публичных кадастров, функциональное зонирование, элементы
# городской среды (data.mos.ru), охранные зоны. Объект слоя получает класс по первому
# совпавшему правилу; объекты без правила перечисляются в предупреждениях прогона.
version: 1

# Система координат чертежей Мосгеотреста - местная МСК-Москва. Слой с явной системой
# координат (crs GeoJSON, .prj SHP) или в долготе и широте (GeoJSON по RFC 7946, выгрузки
# data.mos.ru) пересчитывается в неё; слой без системы координат с метровыми значениями
# считается уже местным. Параметры проверены на Кустанайской 27.09.2026: точка посадки
# (16 046; -5 738) переходит в 55,6152 с. ш., 37,7528 в. д. - Кустанайская улица.
drawing_crs: "+proj=tmerc +lat_0=55.66666666667 +lon_0=37.5 +k=1 +x_0=16.098 +y_0=14.512 +ellps=bessel +towgs84=316.151,78.924,589.65,-1.57273,2.69209,2.34693,8.4507 +units=m +no_defs"

# Погрешность пересчёта, м: входит в запас каждой проверки расстояния до объекта такого
# слоя, как погрешность геометрии чертежа. Для местного слоя - 0.
transform_error_m: 1.0

rules:
  # Явный класс в атрибуте green_class: слой готовит тот, кто знает данные, и класс берётся
  # как есть (значения - классы config/layer_map.yaml: building, road, utility.gas, ...).
  - {attribute: green_class, object_class: from_attribute}
  # Охранные зоны по имени файла.
  - {file: "(?i)(охран|zone).*(лэп|вл\\b|электр|power)", object_class: zone.power_line}
  - {file: "(?i)(охран|zone).*(газ|gas)", object_class: zone.gas}
  # Тип территории по 369-ПП, приложение 2, п. 5.2: на особо охраняемых зелёных и природных
  # территориях виды группы III не высаживаются. Слой ООЗТ - особо охраняемая зелёная
  # территория; ООПТ и природный комплекс - природная территория.
  - {file: "(?i)(оозт|особо.?охраняем\\w*.?зел)", object_class: territory.protected_green}
  - {file: "(?i)(оопт|особо.?охраняем\\w*.?природ|природн\\w*.?(комплекс|террит)|protected.?area|natural)",
     object_class: territory.natural}
  # Публичная кадастровая карта (НСПД, прежде ПКК Росреестра), выгрузка GeoJSON или SHP.
  # Зоны с особыми условиями использования территории (ЗОУИТ): вид зоны - в атрибутах.
  # Охранные зоны газопровода и ЛЭП - ограничения посадки (те же классы, что у слоёв охранных
  # зон); зоны тепловых сетей, связи, водоснабжения отступами не задаются: отступ меряется от
  # самой сети чертежа по СП 42.13330, табл. 9.1.
  - {file: '(?i)(зоуит|zouit|особ\w*.?услови|кадастр|nspd|pkk)', any_value: '(?i)газопровод|газораспредел|газоснабж',
     object_class: zone.gas}
  - {file: '(?i)(зоуит|zouit|особ\w*.?услови|кадастр|nspd|pkk)', any_value: '(?i)электросетев|линии электропередач|(?<![а-я])лэп|(?<![а-я])вл[- ]?\d',
     object_class: zone.power_line}
  - {file: '(?i)(зоуит|zouit|особ\w*.?услови)', object_class: ignore,
     note: "ЗОУИТ кроме газопровода и ЛЭП (тепловые сети, связь, водоохранные) приняты к сведению: отступ от этих сетей меряется от самой сети чертежа (СП 42.13330, табл. 9.1)"}
  # Земельные участки: вид разрешённого использования (ВРИ, приказ Росреестра П/0412) задаёт
  # тип территории так же, как функциональное зонирование: место посадки и категория по
  # МГСН 1.02-02, табл. В.6. Признаки - слова и коды ВРИ, а не адрес: «Бульвар», «Парковая»
  # в адресе участка о его назначении не говорят.
  # Участок в частной собственности - не территория общего пользования (ГрК РФ, ст. 1, п. 12):
  # посадка на нём требует согласования с правообладателем (правило R-PARCEL-*).
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)частн\w*.?собственност|собственност\w* (граждан|юридическ)',
     object_class: parcel.private}
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)улично.?дорожн|(?<![\d.])12\.0\.1(?![\d])',
     object_class: territory.street}
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)благоустройств\w*.?территори|(?<![\d.])12\.0\.2(?![\d])',
     object_class: territory.square}
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)отдых\s*\(?рекреаци|(?<![а-я])рекреаци|парков\w* зон|лесопарк',
     object_class: territory.park}
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)особо охраняем\w* природн|природоохранн',
     object_class: territory.natural}
  # Участок многоквартирного дома - двор, и озеленять его решает общее собрание собственников
  # (ЖК РФ, ст. 44, ч. 2, п. 2.1; правило R-MKD-*). Участок индивидуального или блокированного
  # дома - двор чужого участка: согласование с правообладателем.
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)многоквартирн|(много|средне|мало)этажн\w* жил',
     object_class: territory.yard, also: parcel.residential}
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', any_value: '(?i)жил\w* застройк|индивидуальн\w* жил|блокированн\w* жил',
     object_class: territory.yard, also: parcel.private}
  # Объекты капитального строительства (ОКС) кадастра - здания, если подоснова их не несёт.
  - {file: '(?i)(окс|(?<![а-я])oks|капитальн\w*.?строит)', object_class: building}
  # Элементы городской среды data.mos.ru.
  - {file: "(?i)(здани|строени|building)", object_class: building}
  - {file: "(?i)(дерев|tree)", object_class: existing_tree}
  - {file: "(?i)(ограж|забор|fence)", object_class: fence}
  - {file: "(?i)(границ.*работ|work.?boundary|красн.*лини)", object_class: work_boundary}
  # Участок с другим ВРИ (образование, торговля, производство) - не территория общего
  # пользования: тип территории по нему не задаётся, посадка на нём - по согласованию с
  # правообладателем.
  - {file: '(?i)(кадастр|участ|parcel|nspd|pkk|(?<![a-zа-я])зу(?![a-zа-я]))', object_class: parcel.private,
     note: "земельные участки без ВРИ улицы, благоустройства, рекреации или жилой застройки - вне территорий общего пользования: посадка на них требует согласования с правообладателем (ГрК РФ, ст. 1, п. 12)"}
  # Функциональное зонирование: вид территории по словам в атрибутах задаёт место посадки и
  # категорию по МГСН 1.02-02, табл. В.6 (application/places). Порядок важен: «дворовая
  # территория жилой застройки» - двор, а не улица.
  - {file: "(?i)(зонир|zoning|функц)", any_value: '(?i)двор|внутрикварт|придомов|(?<![а-я])жил(?!ищ)',
     object_class: territory.yard}
  - {file: "(?i)(зонир|zoning|функц)", any_value: "(?i)сквер|бульвар", object_class: territory.square}
  - {file: "(?i)(зонир|zoning|функц)", any_value: '(?i)(?<![а-я])парк(?!овк|инг)|(?<!детский )(?<![а-я])сад\b|лесопарк', object_class: territory.park}
  - {file: "(?i)(зонир|zoning|функц)", any_value: "(?i)улиц|дорог|уличн|удс|магистрал|проезд",
     object_class: territory.street}
  - {file: "(?i)(зонир|zoning|функц)", object_class: ignore,
     note: "зона без вида территории в атрибутах: место посадки по ней не определяется"}
