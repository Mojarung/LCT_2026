# Проверки на каждый push и PR: те же команды, что перед коммитом локально (CLAUDE.md,
# «Конвенции»). Датасет и акты заказчика в репозиторий не входят - тесты, которым они нужны,
# пропускаются с причиной (pytest -rs).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Та же версия, что в docker/Dockerfile (UV_VERSION).
          version: "0.12.15"
          enable-cache: true
      - name: Зависимости
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Типы
        run: uv run ty check src
      - name: Контракты импортов
        run: uv run lint-imports
      - name: Тесты
        run: uv run pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Та же версия, что у стадии сборки веба в docker/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Типы
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
