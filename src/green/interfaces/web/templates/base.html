<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}green{% endblock %}</title>
<meta name="description" content="Автопроектирование озеленения улиц по чертежу подосновы: план посадок на отдельных слоях с объяснением каждого решения по пунктам нормативных актов.">
<meta name="color-scheme" content="light dark">
<!-- Версия в адресе статики: без неё браузер после обновления сервиса показывает старый CSS. -->
<link rel="stylesheet" href="/static/app.css?v={{ asset_versions['app.css'] }}">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/ibm-plex-sans-cyrillic-400-normal.woff2">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<script>
  // Тему выбираем до первой отрисовки, иначе страница мигает светлым.
  try {
    const saved = localStorage.getItem('green-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* приватный режим: остаёмся на системной теме */ }
</script>
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="skip" href="#content">К содержимому</a>

<!-- Шапка - одна пилюля значков поверх плана, без названия сервиса и полосы во всю ширину:
     полоса отрезала бы от карты пятьдесят пикселей, которые на участке-ленте дороже
     заголовка, а название на своём же экране человеку ничего не сообщает. -->
<header class="topbar">
  <nav class="topbar-nav">
    <a href="/docs" title="Документация API (Swagger)" aria-label="Документация API">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 7v14"/>
        <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
      </svg>
    </a>
    <button type="button" id="theme-toggle" title="Переключить тему" aria-label="Переключить тему">
      <!-- Показывается тот значок, в которую тему нажатие переведёт: в тёмной - солнце. -->
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </nav>
</header>

<main id="content">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span class="mono">green {{ version }}</span>
</footer>

<script>
  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', () => {
    const root = document.documentElement;
    // Читаем действующую тему по её фактическому эффекту, а не по тому, что мы ей назначили:
    // иначе переключатель может «работать», ничего не переключая.
    const dark = getComputedStyle(root).getPropertyValue('--is-dark').trim() === '1';
    const next = dark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('green-theme', next); } catch (e) { /* не страшно */ }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
