<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}green{% endblock %}</title>
<!-- Версия в адресе статики: без неё браузер после обновления сервиса показывает старый CSS. -->
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
<link rel="icon" href="data:,">
<script>
  // Тему выбираем до первой отрисовки, иначе страница мигает светлым.
  try {
    const saved = localStorage.getItem('green-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* приватный режим: остаёмся на системной теме */ }
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true"></span>
    green
  </a>
  <span class="brand-note">автопроектирование озеленения улиц</span>
  <nav class="topbar-nav">
    <a href="/docs">API</a>
    <button type="button" id="theme-toggle" class="ghost" aria-label="Переключить тему">Тема</button>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>green {{ version }}</span>
  <span>результат пишется только на слои GREEN_*, исходные сущности не меняются</span>
</footer>

<script>
  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', () => {
    const root = document.documentElement;
    const dark = getComputedStyle(root).getPropertyValue('--is-dark').trim() === '1';
    const next = dark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('green-theme', next); } catch (e) { /* не страшно */ }
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
